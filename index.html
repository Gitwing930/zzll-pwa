096","page":0,"subtitle":"","text":"4.艾丁湖：位于新疆吐鲁番盆地，是我国{{b1221}}的湖泊，属于内陆咸水湖。","blanks":[{"id":"b1221","answer":"海拔最低","source":""}]},{"id":"q0572","unit":"u097","page":0,"subtitle":"","text":"秦岭—淮河以北        秦岭—淮河以南地理分区        北方             南方1 月均温        0℃以下             0℃以上气候类型      温带季风气候        亚热带季风气候年降水量         {{b1222}}800 毫米              {{b1223}}800 毫米干湿地区             {{b1224}}                     {{b1225}} 耕地类型         {{b1226}}农业              {{b1227}}农业土壤类型      多肥沃的褐土         多贫瘠的红壤农作物  以{{b1228}}、玉米、花生、甜菜为主  以{{b1229}}、油菜、甘蔗为主作物熟制    一年一熟或两年三熟       一年两熟到三熟","blanks":[{"id":"b1222","answer":"小于","source":""},{"id":"b1223","answer":"大于","source":""},{"id":"b1224","answer":"半湿润地区","source":""},{"id":"b1225","answer":"湿润地区","source":""},{"id":"b1226","answer":"旱地","source":""},{"id":"b1227","answer":"水田","source":""},{"id":"b1228","answer":"小麦","source":""},{"id":"b1229","answer":"水稻","source":""}]},{"id":"q0573","unit":"u098","page":0,"subtitle":"","text":"（1）基本原则：生态环境保护坚持{{b1230}}、系统治理、{{b1231}}、绿色发展、公众参与、损害担责的原则。","blanks":[{"id":"b1230","answer":"预防为主","source":""},{"id":"b1231","answer":"生态优先","source":""}]},{"id":"q0574","unit":"u098","page":0,"subtitle":"","text":"（1）县级以上{{b1232}}应当组织、协调、督促部门依法履行生态环境保护监管职责。","blanks":[{"id":"b1232","answer":"人民政府","source":""}]},{"id":"q0575","unit":"u098","page":0,"subtitle":"","text":"（2）国务院生态环境主管部门对全国生态环境保护工作实施统一 {{b1233}}，统一{{b1234}}标准制定，统一{{b1235}}，统一监体制骨架  督执法，统一督察问责。","blanks":[{"id":"b1233","answer":"监督管理","source":""},{"id":"b1234","answer":"政策规划","source":""},{"id":"b1235","answer":"监测评估","source":""}]},{"id":"q0576","unit":"u098","page":0,"subtitle":"","text":"（3）国务院自然资源主管部门在其职责范围内对全国自然资源开发利用和保护工作实施监督管理，根据{{b1236}}授权统一履行全民所有自然资源资产所有者职责，统一履行所有国土空间用途管制和生态的保护与修复职责。特色制度  {{b1237}}依法建立健全河湖长制、林长制。国家建立健全跨行政区域的重点区域、流域、海域生态环境联合协同机制  保护协调机制，实行{{b1238}}、统一标准、{{b1239}}、统一保护措施。","blanks":[{"id":"b1236","answer":"国务院","source":""},{"id":"b1237","answer":"省、市、县、乡","source":""},{"id":"b1238","answer":"统一规划","source":""},{"id":"b1239","answer":"统一监测","source":""}]},{"id":"q0577","unit":"u098","page":0,"subtitle":"","text":"（1）国家坚持{{b1240}}、{{b1241}}、精准管控，实施地上地下、陆海统筹、区域联动的生态环境监督管理制度，加强规划、标准、监管制度  监测等监督管理制度的衔接协调。（2 ）生态环境保护督察实行{{b1242}} 和 {{b1243}}两级督察体制。","blanks":[{"id":"b1240","answer":"分区域","source":""},{"id":"b1241","answer":"差异化","source":""},{"id":"b1242","answer":"中央","source":""},{"id":"b1243","answer":"省、自治区、直辖市","source":""}]},{"id":"q0578","unit":"u098","page":0,"subtitle":"","text":"（3）生态环境分区管控：应当落实{{b1244}}、{{b1245}}、资源利用上线目标，划定优先保护、重点管控、一般管控单元，明确生态环境准入清单。","blanks":[{"id":"b1244","answer":"生态保护红线","source":""},{"id":"b1245","answer":"环境质量底线","source":""}]},{"id":"q0579","unit":"u098","page":0,"subtitle":"","text":"2.生态保护补偿国家建立健全生态保护补偿制度，通过财政{{b1246}}补偿、地三元机制区间{{b1247}}补偿、市场机制补偿等机制。对按照规定或约定开展生态环境保护的地区、单位和个人予以补补偿对象偿。{{b1248}}主导、{{b1249}}参与、{{b1250}}运作、可持续机制定位的生态保护补偿机制。可采取{{b1251}}、{{b1252}}、产业转移、人才培训、共建园区、补偿方式购买生态产品和服务等多种方式。","blanks":[{"id":"b1246","answer":"纵向","source":""},{"id":"b1247","answer":"横向","source":""},{"id":"b1248","answer":"政府","source":""},{"id":"b1249","answer":"企业和社会","source":""},{"id":"b1250","answer":"市场化","source":""},{"id":"b1251","answer":"资金补偿","source":""},{"id":"b1252","answer":"对口协作","source":""}]},{"id":"q0580","unit":"u098","page":0,"subtitle":"","text":"3.突发生态环境事件应对：各级人民政府及其有关部门、企业事业单位和其他生产经营者，应当依法做好突发生态环境事件的{{b1253}}、监测预警、应急处置、{{b1254}}、事后恢复等工作。国家建立{{b1255}}、{{b1256}}、部门协同的突发生态环境事件应对责任体系。","blanks":[{"id":"b1253","answer":"预防准备","source":""},{"id":"b1254","answer":"调查评估","source":""},{"id":"b1255","answer":"分级负责","source":""},{"id":"b1256","answer":"属地为主","source":""}]},{"id":"q0581","unit":"u098","page":0,"subtitle":"","text":"（1）污染防治方针：坚持统筹规划、{{b1257}}、{{b1258}}、社会共治，强化多污染物控制协同、区域治理协同，加强全过程监督管理。","blanks":[{"id":"b1257","answer":"源头防控","source":""},{"id":"b1258","answer":"分类管理","source":""}]},{"id":"q0582","unit":"u098","page":0,"subtitle":"","text":"（2）污染物排放管理：国家实行重点污染物排放{{b1259}}制度。对超过重点污染物排放总量控制指标或者未完成生态环境质量目标的地区，省级以上人民政府生态环境主管部门应当{{b1260}}审批该地区新增重点污染物排放总量的建设项目的生态环境影响报告书、生态环境影响报告表。","blanks":[{"id":"b1259","answer":"总量控制","source":""},{"id":"b1260","answer":"暂停","source":""}]},{"id":"q0583","unit":"u098","page":0,"subtitle":"","text":"（3）排污许可管理：国家建立健全以{{b1261}}为核心的固定污染源监督管理制度，未取得排污许可证的不得排放污染物。污染物产生量、排放量或对生态环境影响程度较大，排污许可重点管理。污染物产生量、排放量和对生态影响程度都较小，实行排污许可简化管理。实行排污许可管理的企业事业单位和其他生产经营者范围、实施步骤和管理类别名录，由国务院生态环境主管部门拟订并报 {{b1262}}批准后公布实施。","blanks":[{"id":"b1261","answer":"排污许可制","source":""},{"id":"b1262","answer":"国务院","source":""}]},{"id":"q0584","unit":"u098","page":0,"subtitle":"","text":"（4）固体废物：固体废物污染防治坚持{{b1263}}、{{b1264}}和无害化的原则，加强产生、收集、贮存、运输、利用、处置等全过程管控。国家实行固体废物 {{b1265}}。","blanks":[{"id":"b1263","answer":"减量化","source":""},{"id":"b1264","answer":"资源化","source":""},{"id":"b1265","answer":"","source":"","pending":true}]},{"id":"q0585","unit":"u098","page":0,"subtitle":"","text":"（5）新增国家建立持久性有机污染物等新污染物{{b1266}}和环境风险管控化学物质体系。国家实行新化学物质环境{{b1267}}制度。生产、进口新化污染风险学物质的企业事业单位，应当在生产、进口前向国务院生态环境主管控管部门申请新化学物质环境管理登记。电磁辐射国家对电磁辐射设施实行{{b1268}}。污染防治县级以上地方人民政府应当根据实际情况，实行光污染防治光污染 {{b1269}}，加强对需要特殊保护区域的人工照明和日光照射条件的防治控制。","blanks":[{"id":"b1266","answer":"协同治理","source":""},{"id":"b1267","answer":"管理登记","source":""},{"id":"b1268","answer":"分类管理","source":""},{"id":"b1269","answer":"分区","source":""}]},{"id":"q0586","unit":"u098","page":0,"subtitle":"","text":"（1）基本原则同一个违法行为违反多个生态环境法律规范应当给予罚款处罚择一重罚的，按照罚款{{b1270}}的规定处罚。实施行政处罚，适用违法行为{{b1271}}的生态环境法律、法规、规章的规定。但是，作出行政处罚决定时，生态环境法律、法规、从旧兼从轻规章已被修改或者废止，且新的规定处罚较轻或者不认为是违法的，适用{{b1272}}。","blanks":[{"id":"b1270","answer":"数额高","source":""},{"id":"b1271","answer":"发生时","source":""},{"id":"b1272","answer":"新的规定","source":""}]},{"id":"q0587","unit":"u098","page":0,"subtitle":"","text":"（2）时效造成环境污染、生态破坏等危害后果的违法行为在{{b1273}}被行政处罚  发现的，应当依法给予行政处罚；其他违法行为在{{b1274}}被发现的，应当依法给予行政处罚。提起生态环境民事诉讼的诉讼时效期间为{{b1275}}。诉讼时效期民事诉讼间自当事人知道或者应当知道受到损害以及责任人之日起计算。","blanks":[{"id":"b1273","answer":"五年内","source":""},{"id":"b1274","answer":"二年内","source":""},{"id":"b1275","answer":"五年","source":""}]},{"id":"q0588","unit":"u098","page":0,"subtitle":"","text":"（3）不予处罚：违法行为轻微并及时改正，没有造成危害后果的，不予处罚；{{b1276}}且危害后果轻微并及时改正的，可以不予处罚。","blanks":[{"id":"b1276","answer":"初次违法","source":""}]},{"id":"q0589","unit":"u098","page":0,"subtitle":"","text":"（4）责任衔接：因污染环境、破坏生态等行为应当承担民事责任、行政责任、刑事责任的，承担行政责任或者刑事责任不影响承担民事责任。财产不足以支付的，优先承担{{b1277}}责任。污染环境、破坏生态等违法行为构成犯罪，人民法院判处拘役或者{{b1278}}时，行政机关已经实施行政拘留的，应当依法折抵相应刑期；已经实施行政罚款的，应当依法{{b1279}}相应罚金。","blanks":[{"id":"b1277","answer":"民事","source":""},{"id":"b1278","answer":"有期徒刑","source":""},{"id":"b1279","answer":"折抵","source":""}]},{"id":"q0590","unit":"u099","page":0,"subtitle":"","text":"（1）原则方针：社会救助坚持城乡统筹，坚持{{b1280}}、{{b1281}}，坚持保基本、兜底线、救急难、可持续，坚持与其他社会保障制度相衔接，坚持与经济社会发展相适应。社会救助工作遵循公开、公平、公正、便民、及时的原则。","blanks":[{"id":"b1280","answer":"尽力而为","source":""},{"id":"b1281","answer":"量力而行","source":""}]},{"id":"q0591","unit":"u099","page":0,"subtitle":"","text":"（2）工作分工：社会救助实行{{b1282}}、政府负责、{{b1283}}、部门协同、社会参与的工作机制。乡镇人民政府、街道办事处依法做好社会救助受理、审核、动态管理等工作。{{b1284}}、居民委员会依法协助做好入户走访、社会救助申请等工作。","blanks":[{"id":"b1282","answer":"党委领导","source":""},{"id":"b1283","answer":"民政牵头","source":""},{"id":"b1284","answer":"村民委员会","source":""}]},{"id":"q0592","unit":"u099","page":0,"subtitle":"","text":"（1）救助对象：{{b1285}}、{{b1286}}家庭、最低生活保障边缘家庭、刚性支出困难家庭、受灾人员、基本生活暂时出现严重困难的人员、需要疾病应急救助人员以及生活无着的流散人员等。","blanks":[{"id":"b1285","answer":"特困人员","source":""},{"id":"b1286","answer":"最低生活保障","source":""}]},{"id":"q0593","unit":"u099","page":0,"subtitle":"","text":"（2）救助体系：国家建立健全{{b1287}}的社会救助体系。","blanks":[{"id":"b1287","answer":"分层分类","source":""}]},{"id":"q0594","unit":"u099","page":0,"subtitle":"","text":"（1）特困人员供养：特困人员可以在供养服务机构{{b1288}}，也可以在家{{b1289}}。特困人员中的未成年人年满十八周岁后，仍在义务教育或者高中阶段教育（含中等职业教育）阶段就学的，基本生活 {{b1290}}予以供养。救助","blanks":[{"id":"b1288","answer":"集中供养","source":""},{"id":"b1289","answer":"分散供养","source":""},{"id":"b1290","answer":"继续","source":""}]},{"id":"q0595","unit":"u099","page":0,"subtitle":"","text":"（2）最低生活保障：对家庭人均收入{{b1291}}当地最低生活保障标准且财产状况符合规定的最低生活保障家庭，由社会救助管理部门给予最低生活保障，{{b1292}}最低生活保障金。专项社会医疗救助、教育救助、住房救助、就业救助、受灾人员救助。救助","blanks":[{"id":"b1291","answer":"低于","source":""},{"id":"b1292","answer":"按月发放","source":""}]},{"id":"q0596","unit":"u099","page":0,"subtitle":"","text":"（1）临时救助：对遭遇突发性、紧迫性、灾难性等困难导致基本生活暂时出现严重困难的人员，由社会救助管理部门采取发放 {{b1293}}或者配发实物等方式给予临时救助。对申请临时救助，情况紧急、救助金额较小、需立即采取救助措施的，应当 {{b1294}}。紧急情况解除后，应当按照规定补充说明情况。","blanks":[{"id":"b1293","answer":"救助金","source":""},{"id":"b1294","answer":"先行救助","source":""}]},{"id":"q0597","unit":"u099","page":0,"subtitle":"","text":"（2）疾病应急救助：对需要急救但{{b1295}}或者无力支付急救急难社会费用且符合规定的急危重伤病患者，由社会救助管理部门给予疾救助病应急救助。对急危重伤病患者给予疾病应急救助的，由医疗机构实施紧急救治。符合规定的紧急救治费用，由疾病应急救助基金予以{{b1296}}。","blanks":[{"id":"b1295","answer":"身份不明","source":""},{"id":"b1296","answer":"支付","source":""}]},{"id":"q0598","unit":"u099","page":0,"subtitle":"","text":"（3）生活无着的流散人员救助：申请生活无着的流散人员救助，向急难发生地{{b1297}}以上地方人民政府有关救助管理机构提出，也可以向急难发生地乡镇人民政府、街道办事处提出。","blanks":[{"id":"b1297","answer":"县级","source":""}]},{"id":"q0599","unit":"u100","page":0,"subtitle":"","text":"1.中华民族共同体：{{b1298}}是民族团结之本。铸牢中华民族共同体意识，应当引导各族人民牢固树立{{b1299}}、荣辱与共、{{b1300}}、命运与共的共同体理念，增强中华民族凝聚力。","blanks":[{"id":"b1298","answer":"中华民族共同体意识","source":""},{"id":"b1299","answer":"休戚与共","source":""},{"id":"b1300","answer":"生死与共","source":""}]},{"id":"q0600","unit":"u100","page":0,"subtitle":"","text":"（1）价值目标：国家坚持以{{b1301}}为引领，深化爱国主义、集体主义、社会主义教育，引导各族群众弘扬以{{b1302}}为核心的民族精神和以{{b1303}}为核心的时代精神，坚定对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同。","blanks":[{"id":"b1301","answer":"社会主义核心价值观","source":""},{"id":"b1302","answer":"爱国主义","source":""},{"id":"b1303","answer":"改革创新","source":""}]},{"id":"q0601","unit":"u100","page":0,"subtitle":"","text":"（2）文化建设：国家发展社会主义先进文化，弘扬革命文化，传承 {{b1304}} ，引导各族群众增进中华文化认同。国家坚持以 {{b1305}}引领各民族优秀传统文化的创造性转化和创新性发展。","blanks":[{"id":"b1304","answer":"中华优秀传统文化","source":""},{"id":"b1305","answer":"社会主义核心价值观","source":""}]},{"id":"q0602","unit":"u100","page":0,"subtitle":"","text":"（3）语言文字：国家全面推广普及国家通用语言文字。国家机关以国家通用语言文字为{{b1306}}用语用字。","blanks":[{"id":"b1306","answer":"基本","source":""}]},{"id":"q0603","unit":"u100","page":0,"subtitle":"","text":"3.促进交往交流交融：推进{{b1307}}社区环境建设，完善各族群众共居共学、共建共享、共事共乐的社会条件。","blanks":[{"id":"b1307","answer":"互嵌式","source":""}]},{"id":"q0604","unit":"u100","page":0,"subtitle":"","text":"（1）区域协调：国家促进区域协调发展，完善区域{{b1308}}发展机制和 {{b1309}}区域支持政策，健全对口支援、东西部协作等帮扶协作机制。","blanks":[{"id":"b1308","answer":"协调","source":""},{"id":"b1309","answer":"差别化","source":""}]},{"id":"q0605","unit":"u100","page":0,"subtitle":"","text":"5.民族工作格局：党委统一领导、政府依法管理、{{b1310}}工作部门牵头协调、{{b1311}}工作部门履职尽责、各部门通力合作、全社会共同参与的民族工作格局。","blanks":[{"id":"b1310","answer":"统战","source":""},{"id":"b1311","answer":"民族","source":""}]},{"id":"q0606","unit":"u101","page":0,"subtitle":"","text":"（1）起止时间：从{{b1312}}时起，到{{b1313}}时止。","blanks":[{"id":"b1312","answer":"出生","source":""},{"id":"b1313","answer":"死亡","source":""}]},{"id":"q0607","unit":"u101","page":0,"subtitle":"","text":"（2）特殊规定：涉及{{b1314}}、接受赠与等胎儿利益保护的，胎儿视为具有民事权利能力；但是胎儿娩出时为死体的，其民事权利能力{{b1315}}。自然人死亡后，仅剩余7 项人格利益，即姓名、肖像、名誉、荣誉、隐私、遗体、遗骨。","blanks":[{"id":"b1314","answer":"遗产继承","source":""},{"id":"b1315","answer":"消灭","source":""}]},{"id":"q0608","unit":"u101","page":0,"subtitle":"","text":"2.自然人的民事行为能力：自然人依法独立进行民事活动的资格。类型          条件            效力完全民事行  {{b1316}}以上；16 周岁以上的未成年  可{{b1317}}民事法律行为能力  人，以自己劳动收入为主要生活来源。 为。可以独立实施{{b1318}} 限制民事行  {{b1319}}以上的未成年人；不能完全 的民事法律行为或与其为能力  辨认自己行为的成年人。         年龄、智力{{b1320}}的民事法律行为。不能独立实施任何民事无民事行为  不满{{b1321}}的未成年人；不能辨认 法律行为，一切民事法能力   自己行为的成年人。        律行为均由法定代理人代理实施。","blanks":[{"id":"b1316","answer":"18周岁","source":""},{"id":"b1317","answer":"独立实施","source":""},{"id":"b1318","answer":"纯获利益","source":""},{"id":"b1319","answer":"8周岁","source":""},{"id":"b1320","answer":"相适应","source":""},{"id":"b1321","answer":"8周岁","source":""}]},{"id":"q0609","unit":"u102","page":0,"subtitle":"","text":"类型                条件有效的    行为人具有相应的民事行为能力；{{b1322}}真实；不违反法律、民事法律行为  行政法规的{{b1323}}规定，不违背公序良俗。缺乏民事法律行为的有效条件而不产生法律效力的民事法律行为无效。无效的民事法律行为{{b1324}}、确定无效，无效的民事法律行为自始{{b1325}}，无须任何人主张。效力待定的  限制民事行为能力人从事依法不能从事的民事法律行为，其行民事法律行为  为效力有待法定代理人确认；{{b1326}}行为（表见代理除外）。可撤销的    {{b1327}}（行为性质、标的物、价金的误解）；{{b1328}}；胁民事法律行为  迫；显失公平（利用对方危困状态）。","blanks":[{"id":"b1322","answer":"意思表示","source":""},{"id":"b1323","answer":"强制性","source":""},{"id":"b1324","answer":"当然无效","source":""},{"id":"b1325","answer":"无效","source":""},{"id":"b1326","answer":"无权代理","source":""},{"id":"b1327","answer":"重大误解","source":""},{"id":"b1328","answer":"欺诈","source":""}]},{"id":"q0610","unit":"u103","page":0,"subtitle":"","text":"1.不动产：不动产物权的设立、变更、转让和消灭，经依法{{b1329}}，发生效力，但法律另有规定的除外。","blanks":[{"id":"b1329","answer":"登记","source":""}]},{"id":"q0611","unit":"u103","page":0,"subtitle":"","text":"2.动产：对于一般动产，其物权的设立和转让，自{{b1330}}时发生效力。现实交付   出让物直接转移给受让人占有（{{b1331}}标的物）。动产物权转让前，受让人已经占有该动产的，转让人与受让人简易交付达成的物权转让{{b1332}}时即交付。出让人设立动产物权时，{{b1333}}已占有该动产，让与人将其指示交付对第三人的返还请求权让与买受人，代替现实交付。转让动产物权时，出让人和买受人约定，由出让人{{b1334}} 占有改定该动产，受让人取得动产的间接占有，代替现实交付。","blanks":[{"id":"b1330","answer":"交付","source":""},{"id":"b1331","answer":"交付","source":""},{"id":"b1332","answer":"协议生效","source":""},{"id":"b1333","answer":"受让人","source":""},{"id":"b1334","answer":"继续","source":""}]},{"id":"q0612","unit":"u104","page":0,"subtitle":"","text":"（1）设立：当事人应当以{{b1335}}订立抵押合同；不动产抵押，应当办理抵押物{{b1336}}，抵押权自登记时设立；动产抵押，抵押权    抵押权自{{b1337}}生效时设立。（不转移占有） （2）顺位：抵押权已经登记的，按照登记的{{b1338}}确定清偿顺序；抵押权已经登记的{{b1339}}未登记的受偿；抵押权未登记的，按照债权{{b1340}}清偿。","blanks":[{"id":"b1335","answer":"书面形式","source":""},{"id":"b1336","answer":"登记","source":""},{"id":"b1337","answer":"抵押合同","source":""},{"id":"b1338","answer":"先后顺序","source":""},{"id":"b1339","answer":"优先于","source":""},{"id":"b1340","answer":"比例","source":""}]},{"id":"q0613","unit":"u104","page":0,"subtitle":"","text":"（1）动产质权：以动产为质押财产的质权。当事人应采取书面形式订立质押合同，质押权自出质人{{b1341}}质押财产时设立。质押权","blanks":[{"id":"b1341","answer":"交付","source":""}]},{"id":"q0614","unit":"u104","page":0,"subtitle":"","text":"（2）权利质权：当事人应采取书面形式订立质押合同，有权利（转移占有）凭证的，自权利凭证{{b1342}}质权人时设立；没有权利凭证的，自办理出质{{b1343}}时设立。合法占有债务人动产的债权人，于债务人不能履行到期债务留置权   时，得留置该动产并以其价值优先受偿的权利。其属于 {{b1344}}担保物权。","blanks":[{"id":"b1342","answer":"交付","source":""},{"id":"b1343","answer":"登记","source":""},{"id":"b1344","answer":"法定","source":""}]},{"id":"q0615","unit":"u105","page":0,"subtitle":"","text":"（1）监护人责任是替代责任。无民、限民造成他人损害，由监护人责任 {{b1345}}承担责任。","blanks":[{"id":"b1345","answer":"监护人","source":""}]},{"id":"q0616","unit":"u105","page":0,"subtitle":"","text":"（2）监护人责任是{{b1346}}责任。","blanks":[{"id":"b1346","answer":"无过错","source":""}]},{"id":"q0617","unit":"u105","page":0,"subtitle":"","text":"（3）承担损害赔偿责任时，应优先使用{{b1347}}的财产。","blanks":[{"id":"b1347","answer":"被监护人","source":""}]},{"id":"q0618","unit":"u105","page":0,"subtitle":"","text":"（1）宾馆、商场、银行、车站、机场、体育场馆、娱乐场所等经营场所、公共场所的经营者、管理者或者群众性活动违反    的组织者，{{b1348}}安全保障义务，造成他人损害的，应当安全保障义务的 承担侵权责任。侵权责任   （2）因第三人行为造成他人损害的，由{{b1349}}承担责任；经营场所、公共场所的经营者、管理者或者群众性活动的组织者，未尽到安全保障义务的，承担相应的补充责任。","blanks":[{"id":"b1348","answer":"未尽到","source":""},{"id":"b1349","answer":"第三人","source":""}]},{"id":"q0619","unit":"u105","page":0,"subtitle":"","text":"（1）产品缺陷致人损害，受害人可向产品{{b1350}}要求赔偿，也可向销售者要求赔偿。产品缺陷是由生产者造成的，销售者赔偿后，有权向生产者{{b1351}}。产品责任","blanks":[{"id":"b1350","answer":"生产者","source":""},{"id":"b1351","answer":"追偿","source":""}]},{"id":"q0620","unit":"u105","page":0,"subtitle":"","text":"（2）产品运输者、仓储者等{{b1352}}的过错使产品存在缺陷，造成他人损害的，生产者、销售者在向受害者赔偿后有权向运输者、仓储者要求赔偿。从建筑物中抛掷物品或者从建筑物上坠落的物品造成他人抛掷物、坠落物 损害，由{{b1353}}依法承担侵权责任；经调查难以确定具体致人损害   侵权人的，除能够证明自己不是侵权人的外，由{{b1354}} 的建筑物使用人给予补偿。","blanks":[{"id":"b1352","answer":"第三人","source":""},{"id":"b1353","answer":"侵权人","source":""},{"id":"b1354","answer":"可能加害","source":""}]},{"id":"q0621","unit":"u105","page":0,"subtitle":"","text":"（1）医疗机构不承担赔偿：患者或者近亲属{{b1355}}医疗机构进行符合诊疗规范的诊疗；医务人员在抢救生命垂危的患者等紧急情况下已经尽到合理诊疗义务；限于当时的医疗水平{{b1356}}。医疗损害责任","blanks":[{"id":"b1355","answer":"不配合","source":""},{"id":"b1356","answer":"难以诊疗","source":""}]},{"id":"q0622","unit":"u105","page":0,"subtitle":"","text":"（2）医疗产品责任：因药品、消毒产品、医疗器械的缺陷，或者输入不合格的血液造成患者损害的，患者可以向药品上市{{b1357}}、{{b1358}}、血液提供机构请求赔偿，也可以向 {{b1359}}请求赔偿。","blanks":[{"id":"b1357","answer":"许可持有人","source":""},{"id":"b1358","answer":"生产者","source":""},{"id":"b1359","answer":"医疗机构","source":""}]},{"id":"q0623","unit":"u106","page":0,"subtitle":"","text":"1.刑事责任年龄：行为人对自己的犯罪行为负刑事责任必须达到的年龄。已满16 周岁   {{b1360}}刑事责任。已满14 周岁   故意杀人、{{b1361}}致人重伤或死亡、抢劫、强奸、贩卖不满16 周岁   毒品、{{b1362}}、爆炸、{{b1363}}的，应当负责。犯故意杀人、故意伤害罪，致人死亡或以特别残忍手段致已满12 周岁人重伤造成严重残疾，情节恶劣，经最高人民{{b1364}}核不满14 周岁准追诉，应当负刑事责任。不满12 周岁   {{b1365}}刑事责任。对依照上述规定追究刑事责任的不满18 周岁的人，应当从注意轻或者减轻处罚。","blanks":[{"id":"b1360","answer":"应当负","source":""},{"id":"b1361","answer":"故意伤害","source":""},{"id":"b1362","answer":"放火","source":""},{"id":"b1363","answer":"投放危险物质","source":""},{"id":"b1364","answer":"检察院","source":""},{"id":"b1365","answer":"不负","source":""}]},{"id":"q0624","unit":"u106","page":0,"subtitle":"","text":"（1）精神病人：精神病人在不能辨认或者不能控制自己行为的时候造成危害结果，经法定程序鉴定确认的，{{b1366}}刑事责任，但是应当责令他的家属或者监护人严加看管和医疗；必要时，由{{b1367}}强制医疗。间歇性的精神病人在精神正常的时候犯罪，应当负刑事责任。","blanks":[{"id":"b1366","answer":"不负","source":""},{"id":"b1367","answer":"政府","source":""}]},{"id":"q0625","unit":"u106","page":0,"subtitle":"","text":"（2）醉酒的人：醉酒的人犯罪，{{b1368}}刑事责任。","blanks":[{"id":"b1368","answer":"应当负","source":""}]},{"id":"q0626","unit":"u107","page":0,"subtitle":"","text":"（1）一般防卫：为了使国家、公共利益、本人或者他人的人身和其他权利免受{{b1369}}的不法侵害，而对{{b1370}}所采取的合理的防卫行为。正当防卫没有实质犯罪性，不负刑事责任。","blanks":[{"id":"b1369","answer":"正在进行","source":""},{"id":"b1370","answer":"不法侵害人","source":""}]},{"id":"q0627","unit":"u107","page":0,"subtitle":"","text":"（2）特殊防卫：正在进行行凶、{{b1371}}、{{b1372}}、强奸、绑架以及其他严重危及人身安全的暴力犯罪，采取防卫行为，造成不法侵害人{{b1373}}的，不负刑事责任。","blanks":[{"id":"b1371","answer":"杀人","source":""},{"id":"b1372","answer":"抢劫","source":""},{"id":"b1373","answer":"伤亡","source":""}]},{"id":"q0628","unit":"u107","page":0,"subtitle":"","text":"2.紧急避险：为了使国家、公共利益、本人或者他人的人身和其他权利免受正在发生的危险，{{b1374}}而采取的损害另一较小的合法利益的行为。紧急避险行为造成损害的，不负刑事责任。","blanks":[{"id":"b1374","answer":"不得已","source":""}]},{"id":"q0629","unit":"u108","page":0,"subtitle":"","text":"（1）一般累犯：犯罪发生时，犯罪人已满{{b1375}}；前罪与后罪都是{{b1376}}犯罪；前罪与后罪被判处{{b1377}}以上刑罚；后罪法在刑罚执行完毕或者赦免以后在{{b1378}}。累犯  （2）特别累犯：危害{{b1379}}犯罪、{{b1380}}犯罪、黑社会性质的组织犯罪的犯罪分子，在刑罚执行完毕或赦免以后，在{{b1381}}再犯上述{{b1382}}罪的情形。","blanks":[{"id":"b1375","answer":"18周岁","source":""},{"id":"b1376","answer":"故意","source":""},{"id":"b1377","answer":"有期徒刑","source":""},{"id":"b1378","answer":"五年以内","source":""},{"id":"b1379","answer":"国家安全","source":""},{"id":"b1380","answer":"恐怖活动","source":""},{"id":"b1381","answer":"任何时候","source":""},{"id":"b1382","answer":"任何一类","source":""}]},{"id":"q0630","unit":"u108","page":0,"subtitle":"","text":"（3）处罚：对累犯应当从重处罚，对累犯不适用{{b1383}}和假释。","blanks":[{"id":"b1383","answer":"缓刑","source":""}]},{"id":"q0631","unit":"u108","page":0,"subtitle":"","text":"（1）一般自首：犯罪后{{b1384}}，如实供述自己罪行的行为。","blanks":[{"id":"b1384","answer":"自动投案","source":""}]},{"id":"q0632","unit":"u108","page":0,"subtitle":"","text":"（2）特别自首：被采取强制措施的犯罪嫌疑人、被告人和正在服刑自首  的罪犯，如实供述司法机关还{{b1385}}的本人其他罪行的行为。","blanks":[{"id":"b1385","answer":"未掌握","source":""}]},{"id":"q0633","unit":"u108","page":0,"subtitle":"","text":"（1）犯罪分子{{b1386}}的犯罪行为，查证属实的，或者提供重要线索，从而得以侦破其他案件等行为。立功","blanks":[{"id":"b1386","answer":"揭发他人","source":""}]},{"id":"q0634","unit":"u108","page":0,"subtitle":"","text":"（2）犯罪分子有{{b1387}}表现的，可以从轻或者减轻处罚；有重大立功表现的，可以减轻或者免除处罚。","blanks":[{"id":"b1387","answer":"立功","source":""}]},{"id":"q0635","unit":"u109","page":0,"subtitle":"","text":"1.{{b1388}}：参加间谍组织或接受间谍组织及其代理人的任务，或为敌人指示轰击目标，危害国家安全的行为。","blanks":[{"id":"b1388","answer":"间谍罪","source":""}]},{"id":"q0636","unit":"u109","page":0,"subtitle":"","text":"（2）行为人既参加间谍组织，又为其窃取、刺探、收买、非法提供国家秘密或情报，只定{{b1389}}。","blanks":[{"id":"b1389","answer":"间谍罪","source":""}]},{"id":"q0637","unit":"u109","page":0,"subtitle":"","text":"3.挪用公款罪：{{b1390}}利用职务上的便利，挪用公款归{{b1391}}使用，进行非法活动的，或者挪用公款数额较大、进行{{b1392}}的，或者挪用公款数额较大、超过{{b1393}}未还的行为。","blanks":[{"id":"b1390","answer":"国家工作人员","source":""},{"id":"b1391","answer":"个人","source":""},{"id":"b1392","answer":"营利活动","source":""},{"id":"b1393","answer":"三个月","source":""}]},{"id":"q0638","unit":"u109","page":0,"subtitle":"","text":"4.受贿罪：国家工作人员，利用职务上的便利，{{b1394}}他人财物，或者非法收受他人财物并为他人谋取利益的行为。","blanks":[{"id":"b1394","answer":"索取","source":""}]},{"id":"q0639","unit":"u109","page":0,"subtitle":"","text":"6.盗窃罪（无暴力）：以非法占有为目的，窃取他人占有的数额较大的财物，或者{{b1395}}、{{b1396}}、携带凶器盗窃、{{b1397}}的行为。本罪行为公式：他人占有的财物—以平和手段—转移为自己占有。","blanks":[{"id":"b1395","answer":"多次盗窃","source":""},{"id":"b1396","answer":"入户盗窃","source":""},{"id":"b1397","answer":"扒窃","source":""}]},{"id":"q0640","unit":"u109","page":0,"subtitle":"","text":"7.抢夺罪（{{b1398}}实施暴力）：以非法占有为目的，当场直接夺取他人紧密占有的数额较大的公私财物，或者多次抢夺的行为。","blanks":[{"id":"b1398","answer":"乘人不备","source":""}]},{"id":"q0641","unit":"u109","page":0,"subtitle":"","text":"8.抢劫罪（{{b1399}}实施暴力）：以非法占有为目的，使用暴力、胁迫或者其他足以压制对方反抗的方法，强行劫取公私财物的行为。","blanks":[{"id":"b1399","answer":"当场","source":""}]},{"id":"q0642","unit":"u109","page":0,"subtitle":"","text":"（2）携带凶器抢夺的，以{{b1400}}论处。","blanks":[{"id":"b1400","answer":"抢劫罪","source":""}]},{"id":"q0643","unit":"u109","page":0,"subtitle":"","text":"（3）转化型抢劫罪：犯盗窃、诈骗、抢夺罪，为{{b1401}}、{{b1402}}或毁灭罪证，当场使用暴力或以暴力相威胁的，依照抢劫罪的规定定罪处罚。携带凶器抢夺的，以抢劫罪论处。","blanks":[{"id":"b1401","answer":"窝藏赃物","source":""},{"id":"b1402","answer":"抗拒抓捕","source":""}]},{"id":"q0644","unit":"u110","page":0,"subtitle":"","text":"1.种类学理分类 人身罚  资格罚    行为罚    财产罚  声誉罚 {{b1403}}许限制开展生产   {{b1404}}；可证件、降行政        经营活动、责令 没收违法   {{b1405}}、法定种类      低资质等拘留        停产停业、责令 所得、非法 通报批评级、吊销许关闭；限制从业  财物可证件","blanks":[{"id":"b1403","answer":"行政拘留","source":""},{"id":"b1404","answer":"没收违法所得","source":""},{"id":"b1405","answer":"罚款","source":""}]},{"id":"q0645","unit":"u110","page":0,"subtitle":"","text":"（1）普通程序立案  符合立案标准的，行政机关应当及时立案当由具有执法资格的执法人员实施，执法人员不得少于{{b1406}}人。调查在进行检查时，应当{{b1407}}向当事人或有关人员出示执法证件。行政机关负责人作出处罚{{b1408}}，应当由从事行政处罚决定法制审核的人员进行法制审核。审核 {{b1409}}从事行政处罚决定法制审核的工作人员，应通过国家统一法律职业资格考试并取得法律职业资格。行政处罚决定由行政机关{{b1410}}作出；对复杂、重大的处罚案件，决定  应由行政机关负责人{{b1411}}后作出。行政机关应当自行政处罚案件立案之日起{{b1412}}内作出行政处罚决定。行政处罚决定书应当在宣告后{{b1413}}当事人。送达当事人不在场的，应当在{{b1414}}内送达当事人。","blanks":[{"id":"b1406","answer":"两","source":""},{"id":"b1407","answer":"主动","source":""},{"id":"b1408","answer":"决定","source":""},{"id":"b1409","answer":"行政机关","source":""},{"id":"b1410","answer":"负责人","source":""},{"id":"b1411","answer":"集体讨论","source":""},{"id":"b1412","answer":"90日","source":""},{"id":"b1413","answer":"当场交付","source":""},{"id":"b1414","answer":"七日","source":""}]},{"id":"q0646","unit":"u110","page":0,"subtitle":"","text":"（2）简易程序违法事实确凿并有法定依据。适用  对公民处以{{b1415}}以下、对法人或其他组织处以{{b1416}}以下罚款或者警告。当场处罚：执法人员在当场查明事实后，无须报送机关负责人。规则  当场送达：执法人员不得少于{{b1417}}，执法人员当场作出处罚决定，并当场交付。","blanks":[{"id":"b1415","answer":"200元","source":""},{"id":"b1416","answer":"3000元","source":""},{"id":"b1417","answer":"两人","source":""}]},{"id":"q0647","unit":"u110","page":0,"subtitle":"","text":"（3）听证程序启动  被动启动，即{{b1418}}启动。较大数额{{b1419}}；{{b1420}}较大数额违法所得、没收较大价值非法范围财物；降低资质等级、{{b1421}}许可证件；责令停产停业、责令关闭。方式  除涉及{{b1422}}、{{b1423}}或个人隐私外，听证应当公开举行。申请人、利害关系人应在行政机关告知后{{b1424}}内，提出听证要求。程序  行政机关应当在举行听证的{{b1425}}前，将举行听证的时间、地点通知申请人。","blanks":[{"id":"b1418","answer":"依申请","source":""},{"id":"b1419","answer":"罚款","source":""},{"id":"b1420","answer":"没收","source":""},{"id":"b1421","answer":"吊销","source":""},{"id":"b1422","answer":"国家秘密","source":""},{"id":"b1423","answer":"商业秘密","source":""},{"id":"b1424","answer":"五日","source":""},{"id":"b1425","answer":"七日","source":""}]},{"id":"q0648","unit":"u111","page":0,"subtitle":"","text":"治安管理处罚是指{{b1426}}对违反治安管理处罚程序但尚未构成犯罪的公民、法人和其他组织实施行政制裁的行为。","blanks":[{"id":"b1426","answer":"公安机关","source":""}]},{"id":"q0649","unit":"u111","page":0,"subtitle":"","text":"（1）主罚：{{b1427}}、{{b1428}}、{{b1429}}和吊销公安机关发放的许可证。","blanks":[{"id":"b1427","answer":"警告","source":""},{"id":"b1428","answer":"罚款","source":""},{"id":"b1429","answer":"行政拘留","source":""}]},{"id":"q0650","unit":"u111","page":0,"subtitle":"","text":"（2）附加罚：针对{{b1430}}限期出境、驱逐出境。","blanks":[{"id":"b1430","answer":"外国人","source":""}]},{"id":"q0 /* ---------- 中文数字归一化（用于判分容错） ---------- */
const CN_DIGIT={'〇':0,'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function cn2num(str){
  if(!/[〇零一二两三四五六七八九十百千万亿]/.test(str)) return str;
  // 逐位简单数字串（如 二〇二〇 -> 2020）
  if(/^[〇零一二三四五六七八九]+$/.test(str)){
    return str.split('').map(c=>CN_DIGIT[c]).join('');
  }
  // 组合数字（三十一 / 三百 / 一万四 等）
  const secs={'亿':100000000,'万':10000,'千':1000,'百':100,'十':10};
  let total=0, section=0, num=0; let hit=false;
  for(const ch of str){
    if(CN_DIGIT[ch]!==undefined){ num=CN_DIGIT[ch]; hit=true; }
    else if(secs[ch]!==undefined){
      const unit=secs[ch];
      if(unit>=10000){ section=(section+num)*unit; total+=section; section=0; }
      else { if(num===0) num=1; section+=num*unit; }
      num=0; hit=true;
    }
  }
  if(hit) return String(total+section+num);
  return str;
}

/* ---------- 答案归一化：去标点空格、全半角、数字等价 ---------- */
function normalize(s){
  if(s==null) return '';
  let t=String(s);
  // 全角转半角
  t=t.replace(/[\uFF01-\uFF5E]/g,m=>String.fromCharCode(m.charCodeAt(0)-0xFEE0));
  t=t.replace(/\u3000/g,' ');
  t=t.toLowerCase();
  // 统一百分号
  t=t.replace(/%/g,'％');
  // 提取中文/数字/字母 token，逐段转中文数字
  let out='';
  let buf='';
  const flush=()=>{ if(buf){ out+=cn2num(buf); buf=''; } };
  for(const ch of t){
    if(/[一-龥]/.test(ch)){ buf+=ch; }
    else { flush(); if(/[0-9a-z％]/.test(ch)) out+=ch; }
  }
  flush();
  // 去掉结构助词，增强容错
  out=out.replace(/[的地得了]/g,'');
  return out.trim();
}
function isCorrect(input, answer){
  const a=normalize(answer), u=normalize(input);
  if(!u) return false;
  if(u===a) return true;
  // 支持答案中以 / 或 ; 分隔的多个可接受写法
  const alts=String(answer).split(/[/；;]/).map(x=>normalize(x)).filter(Boolean);
  return alts.includes(u);
}

const LS_KEY='zzll_fill_state_v1';
let state={ blanks:{}, view:'home', unit:null, mode:'quiz' };
function loadState(){
  try{ const s=JSON.parse(localStorage.getItem(LS_KEY)); if(s&&s.blanks){ state.blanks=s.blanks; } }catch(e){}
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({blanks:state.blanks})); }catch(e){} }
function blankState(id){ return state.blanks[id]||null; } // {s:'ok'|'no', w:次数}
function setBlank(id, ok){
  const prev=state.blanks[id]||{s:null,w:0};
  prev.s=ok?'ok':'no';
  if(!ok) prev.w=(prev.w||0)+1;
  state.blanks[id]=prev;
  saveState();
}
function resetUnit(uid){
  itemsByUnit[uid].forEach(it=>it.blanks.forEach(b=>{ delete state.blanks[b.id]; }));
  saveState();
}
/* 统计 */
function unitStats(uid){
  let total=0, ok=0;
  itemsByUnit[uid].forEach(it=>it.blanks.forEach(b=>{
    if(b.pending) return;
    total++;
    const st=blankState(b.id); if(st&&st.s==='ok') ok++;
  }));
  return {total, ok, pct:total?Math.round(ok/total*100):0};
}
function globalStats(){
  let total=0, ok=0, wrong=0;
  ITEMS.forEach(it=>it.blanks.forEach(b=>{
    if(b.pending) return;
    total++; const st=blankState(b.id);
    if(st){ if(st.s==='ok') ok++; else wrong++; }
  }));
  return {total, ok, wrong, pct:total?Math.round(ok/total*100):0, done:ok+wrong};
}
function wrongIds(){
  const set=new Set();
  ITEMS.forEach(it=>it.blanks.forEach(b=>{ const st=blankState(b.id); if(st&&st.s==='no') set.add(b.id); }));
  return set;
}

  let nextUnit=null;
  for(const u of UNITS){ const s=unitStats(u.id); if(s.ok<s.total){ nextUnit=u.id; break; } }
  const pians=[]; UNITS.forEach(u=>{ if(!pians.some(x=>x.name===u.pian)) pians.push({name:u.pian,common:u.scope==='common'}); });

  let h=`<div class="hero">
    <h1>政治理论 & 常识判断 · 挖空记忆</h1>
    <p>${DATA.meta.source||''}　共 ${ITEMS.reduce((a,it)=>a+it.blanks.length,0)} 个填空，按篇/章/知识点逐个攻克。</p>
    <div class="ring-row">
      <div class="ring" style="--p:${g.pct}"><div class="ring-txt"><b>${g.pct}%</b><span>总掌握</span></div></div>
      <div class="hero-stats">
        <div class="hs"><b>${g.ok}</b><span>已掌握</span></div>
        <div class="hs"><b>${g.done}</b><span>已练习</span></div>
        <div class="hs"><b>${wn}</b><span>待巩固错题</span></div>
      </div>
    </div>
  </div>`;

  h+=`<div class="toolbar" style="margin-top:18px">
    <button class="btn btn-primary" id="btnContinue">${nextUnit?'继续学习':'从头开始'}</button>
    <button class="btn btn-ghost" id="btnWrong">错题本复习${wn?`（${wn}）`:''}</button>
  </div>`;

  h+=`<div class="section-title">学习板块</div><div class="pian-grid">`;
  pians.forEach(p=>{
    const s=pianStats(p.name);
    const tag=p.common?'常识':(p.name.indexOf('时事')>=0?'时政':'理论');
    h+=`<button class="pian-card" data-pianunit="${s.first.id}">
      <div class="pc-top"><span class="pc-name">${p.name}</span><span class="pc-tag">${tag} · ${s.units}个知识点</span></div>
      <div class="pc-desc">${PIAN_DESC[p.name]||''}</div>
      <div class="pbar"><i style="width:${s.pct}%"></i></div>
      <div class="pc-meta"><span>${s.ok}/${s.total} 空</span><span>${s.pct}%</span></div>
    </button>`;
  });  h+='</div>';

  h+=`<div class="section-title">学习数据</div><div class="stat-grid">
    <div class="stat-card"><b>${g.total}</b><span>可判分填空</span></div>
    <div class="stat-card good"><b>${g.ok}</b><span>已掌握</span></div>
    <div class="stat-card warn"><b>${wn}</b><span>错题待巩固</span></div>
    <div class="stat-card"><b>${g.total-g.done}</b><span>未练习</span></div>
  </div>`;

  $('#content').innerHTML=h;
  $('#btnContinue').onclick=()=>go('learn', nextUnit||UNITS[0].id);
  $('#btnWrong').onclick=()=>go('wrong');
  $$('#content [data-pianunit]').forEach(b=>b.onclick=()=>go('learn',b.dataset.pianunit));
}

/* ===================== 视图：错题本 ===================== */
function renderWrong(){
  const ids=wrongIds();
  let h=`<div class="crumb">错题本 · 只收集最近一次答错的空，答对后自动移出</div>`;
  if(!ids.size){
    h+=`<div class="empty-state">
      <svg class="es-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
      <h3>暂无错题</h3><p>在学习中答错的填空会汇集到这里，方便集中攻克。</p>
      <button class="btn btn-primary" onclick="go('home')">返回总览</button>
    </div>`;
    $('#content').innerHTML=h; return;
  }
  h+=`<div class="toolbar"><span class="score" style="font-size:14px;color:var(--ink-2)">共 <b style="color:var(--wrong)">${ids.size}</b> 个待巩固填空</span><div class="spacer"></div>
    <button class="btn btn-ghost" id="btnClearWrong">清空错题记录</button></div>`;

  // 按单元分组
  const groups=[];
  UNITS.forEach(u=>{
    const its=itemsByUnit[u.id].filter(it=>it.blanks.some(b=>ids.has(b.id)));
    if(its.length) groups.push({u,its});
  });
  groups.forEach(g=>{
    h+=`<div class="wrong-group"><h3>${g.u.pian.replace(/^第[一二三四]篇/,'').replace(/[《》]/g,'')} · ${g.u.title}</h3>`;
    g.its.forEach(it=>{
      if(!it.blanks.some(b=>ids.has(b.id))) return;
      h+=`<div class="wrong-item">${qTextHTML(it,true)}<div class="wi-meta">答错后可在此重做，答对即移出错题本</div></div>`;
    });
    h+=`</div>`;
  });
  $('#content').innerHTML=h;
  bindBlanks();
  $('#btnClearWrong').onclick=()=>{
    Object.keys(state.blanks).forEach(k=>{ if(state.blanks[k]&&state.blanks[k].s==='no') delete state.blanks[k]; });
    saveState(); renderNav(); renderWrong(); toast('已清空错题记录');
  };
}

/* ===================== 题目文本 → 填空渲染 ===================== */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function blankWidth(ans){
  const n=Math.max(2, String(ans).length);
  return `width:${Math.min(n+1.4,18)}ch`;
}
function qTextHTML(item, inWrong){
  const parts=item.text.split(/\{\{(b\d+)\}\}/g);
  let html='';
  for(let i=0;i<parts.length;i++){
    if(i%2===0){ html+=esc(parts[i]); }
    else{
      const bid=parts[i];
      const b=item.blanks.find(x=>x.id===bid);
      const ans=b?b.answer:'';
      const st=blankState(bid);
      if(b&&b.pending){
        html+=`<span class="blank pending" title="该空法条原文表述待核实，不参与判分">待核实</span>`;
      }else if(state.mode==='read'){
        const cls=(st&&st.s==='ok')?'reveal answered':'reveal';
        html+=`<span class="blank ${cls}"><span class="reveal">${esc(ans)}</span></span>`;
      }else if(state.mode==='match'){
        const done=st&&st.s==='ok';
        html+=`<span class="blank match-blank ${done?'match-ok':''}" data-bid="${bid}" data-ans="${esc(ans)}">
          <span class="match-slot">${done?esc(ans):'　　'}</span>
        </span>`;
      }else{
        let cls='';
        if(st&&st.s==='ok') cls='ok';
        else if(st&&st.s==='no') cls='no';
        const val=(st&&st.v!=null)?st.v:'';
        html+=`<span class="blank ${cls}" data-bid="${bid}" data-ans="${esc(ans)}">
          <input type="text" autocomplete="off" style="${blankWidth(ans)}" value="${esc(val)}" placeholder="${'　'.repeat(Math.max(2,String(ans).length))}">
          <button class="eye" tabindex="-1" title="显示答案"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <span class="ans-tip">答案：${esc(ans)}</span>
        </span>`;
      }
    }
  }
  return html;
}
function sourceHTML(item){
  const srcs=[...new Set(item.blanks.map(b=>b.source).filter(Boolean))];
  if(!srcs.length) return '';
  return srcs.map(s=>{
    const m=s.match(/^https?:\/\//);
    if(m) return `<a class="src-link" href="${esc(s)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>答案来源</a>`;
    return `<div class="src-link">来源：${esc(s)}</div>`;
  }).join('');
}

/* ===================== 视图：学习 ===================== */
function renderLearn(){
  const u=UNITS.find(x=>x.id===state.unit); if(!u){ return go('home'); }
  const list=itemsByUnit[u.id];
  const idx=UNITS.findIndex(x=>x.id===u.id);
  const prev=UNITS[idx-1], next=UNITS[idx+1];
  const stt=unitStats(u.id);

  let h=`<div class="crumb">${esc(u.pian)}　›　${u.chapter?esc(u.chapter)+'　›　':''}<b>${esc(u.title)}</b></div>`;
  h+=`<div class="unit-head"><h2>${esc(u.title)}</h2>
    <div class="unit-progress"><div class="pbar"><i id="unitBar" style="width:${stt.pct}%"></i></div>
    <span class="up-txt" id="unitTxt">${stt.ok}/${stt.total} 已掌握</span></div></div>`;

  h+=`<div class="toolbar">
    <div class="seg" id="modeSeg">
      <button data-mode="quiz" class="${state.mode==='quiz'?'on':''}">默写测验</button>
      <button data-mode="match" class="${state.mode==='match'?'on':''}">选词填空</button>
      <button data-mode="read" class="${state.mode==='read'?'on':''}">对照背诵</button>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-ghost" id="btnReset">重置本单元</button>
  </div>`;

  document.body.classList.toggle('mode-read', state.mode==='read');

  list.forEach((it,i)=>{
    const qn=list.slice(0,i).reduce((a,x)=>a+x.blanks.length,0); // 起始空序
    h+=`<div class="q-card">`;
    if(it.subtitle) h+=`<div class="q-sub"><span class="q-idx">${esc(it.subtitle)}</span></div>`;
    h+=`<div class="q-text">${qTextHTML(it)}</div>`;
    h+=sourceHTML(it);
    h+=`</div>`;
  });

  // 选词填空：底部答案词库（打乱）
  if(state.mode==='match'){
    const pool=[];
    list.forEach(it=>it.blanks.forEach(b=>{
      if(b.pending) return;
      // 已掌握的空不再进词库
      if(!(blankState(b.id)&&blankState(b.id).s==='ok')) pool.push({bid:b.id, ans:b.answer});
    }));
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    h+=`<div class="bank collapsed">
      <div class="bank-title" id="bankTitle"><span class="dot"></span>答案词库<span class="bank-remain" id="bankRemain"></span><svg class="bank-fold" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
      <div class="bank-chips">`;
    pool.forEach((a,i)=>{
      h+=`<button class="chip" data-bid="${a.bid}" data-ans="${esc(a.ans)}">${esc(a.ans)}</button>`;
    });
    h+=`</div></div>`;
  }

  h+=`<div class="unit-foot">
    <div class="score">本单元 <b id="scoreNum">${stt.ok}</b>/${stt.total} 空</div>
    <div class="nav-pager">
      ${prev?`<button class="btn btn-ghost" data-goto="${prev.id}">‹ 上一节</button>`:''}
      ${next?`<button class="btn btn-primary" data-goto="${next.id}">下一节 ›</button>`:''}
    </div></div>`;

  $('#content').innerHTML=h;

  $('#modeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.mode=b.dataset.mode; renderLearn(); window.scrollTo({top:0}); });
  $('#btnReset').onclick=()=>{ resetUnit(u.id); renderLearn(); renderNav(); toast('已重置本单元作答记录'); };
  $$('#content [data-goto]').forEach(b=>b.onclick=()=>go('learn',b.dataset.goto));
  if(state.mode==='match') bindMatch(); else bindBlanks();
}

/* 选词填空交互 */
function bindMatch(){
  let picked=null;
  const bank=$('#content .bank');
  const bt=$('#bankTitle');
  if(bt&&bank) bt.onclick=()=>bank.classList.toggle('collapsed');
  const updateRemain=()=>{
    const el=$('#bankRemain'); if(!el) return;
    const remain=$$('#content .chip').filter(c=>!c.classList.contains('used')).length;
    el.textContent=' · 剩余 '+remain+' 词';
  };
  updateRemain();
  $$('#content .chip').forEach(chip=>{
    chip.onclick=()=>{
      if(chip.classList.contains('used')) return;
      if(picked===chip){ chip.classList.remove('picked'); picked=null; return; }
      if(picked) picked.classList.remove('picked');
      picked=chip; chip.classList.add('picked');
    };
  });
  $$('#content .match-blank').forEach(slot=>{
    slot.onclick=()=>{
      if(slot.classList.contains('match-ok')) return;
      if(!picked){
        $$('#content .match-selected').forEach(s=>s.classList.remove('match-selected'));
        slot.classList.add('match-selected');
        return;
      }
      const word=picked.textContent.trim();
      const ans=slot.dataset.ans;
      const bid=slot.dataset.bid;
      const ok=isCorrect(word,ans);
      const slotEl=slot.querySelector('.match-slot');
      if(ok){
        slotEl.textContent=word;
        slot.classList.remove('match-selected');
        slot.classList.add('match-ok');
        picked.classList.add('used');
        picked.classList.remove('picked');
        picked=null;
        setBlank(bid,true);
        afterJudge(true);
        updateRemain();
      }else{
        slotEl.textContent=word;
        slot.classList.add('match-no');
        picked.classList.add('shake');
        setTimeout(()=>{
          slotEl.textContent='　　';
          slot.classList.remove('match-no','match-selected');
          if(picked) picked.classList.remove('shake');
        },850);
      }
    };
  });
}

/* 判分交互 */
function bindBlanks(){
  $$('#content .blank').forEach(wrap=>{
    const input=wrap.querySelector('input'); if(!input) return;
    const bid=wrap.dataset.bid, ans=wrap.dataset.ans;
    const judge=()=>{
      const val=input.value;
      if(!val.trim()){ wrap.classList.remove('ok','no'); const st=blankState(bid); if(st&&st.s==='no'){/*keep*/} return; }
      const ok=isCorrect(val,ans);
      wrap.classList.toggle('ok',ok);
      wrap.classList.toggle('no',!ok);
      setBlank(bid,ok);
      state.blanks[bid].v=val; saveState();
      afterJudge(ok);
    };
    input.addEventListener('blur',judge);
    input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const n=$$('#content .blank input'); const i=n.indexOf(input); (n[i+1]||n[i]).focus(); } });
    input.addEventListener('input',()=>{ if(wrap.classList.contains('no')) wrap.classList.remove('no'); });
    const eye=wrap.querySelector('.eye');
    eye.onclick=(e)=>{ e.preventDefault();
      const tip=wrap.querySelector('.ans-tip');
      wrap.classList.add('peek'); tip.style.display=tip.style.display==='block'?'none':'block';
    };
  });
}
function afterJudge(ok){
  renderNav();
  if(state.view==='learn'){
    const stt=unitStats(state.unit);
    const bar=$('#unitBar'), txt=$('#unitTxt'), num=$('#scoreNum');
    if(bar){ bar.style.width=stt.pct+'%'; txt.textContent=`${stt.ok}/${stt.total} 已掌握`; if(num) num.textContent=stt.ok; }
  }else if(state.view==='wrong'){
    if(ok){ setTimeout(()=>{ renderWrong(); renderNav(); }, 550); }
  }
}

/* ===================== 路由 / 框架 ===================== */
function go(view, unit){
  state.view=view; if(unit) state.unit=unit;
  if(view==='learn'){ state.mode=state.mode||'quiz'; renderLearn(); }
  else if(view==='wrong'){ renderWrong(); }
  else { renderHome(); }
  setNavActive();
  window.scrollTo({top:0,behavior:'instant' in window?'instant':'auto'});
}
let toastTimer=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}
function openSidebar(){ $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }

/* ===================== 初始化 ===================== */
loadState();
renderNav();
go('home');
$('#menuBtn').onclick=openSidebar;
$('#sbClose').onclick=closeSidebar;
$('#overlay').onclick=closeSidebar;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSidebar(); });
</script>
