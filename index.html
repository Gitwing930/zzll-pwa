":"b0466","answer":"跨","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0258","unit":"u026","page":31,"subtitle":"（三）2026年政策取向","text":"1.继续实施更加积极的{{b0467}}政策。今年赤字率拟按{{b0468}}%左右安排，赤字规模比上年{{b0469}}2300亿元。今年财政支出继续保持相当规模，要持续用力优化支出结构，更加注重支持提振消费、投资于{{b0470}}、保障民生等方面，提高财政资金使用效益。中央财政{{b0471}}对地方财力性转移支付规模，开展整合统筹使用转移支付资金试点，增强地方自主财力和统筹能力。各级政府要更好“当家理财”，建立健全增收节支机制，强化预算约束，{{b0472}}一般性支出，坚决落实过紧日子的要求。","blanks":[{"id":"b0467","answer":"财政","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0468","answer":"4","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0469","answer":"增加","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0470","answer":"人","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0471","answer":"增加","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0472","answer":"严控","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0259","unit":"u026","page":31,"subtitle":"（三）2026年政策取向","text":"2.继续实施适度宽松的{{b0473}}政策。把促进经济稳定增长、物价合理{{b0474}}作为货币政策的重要考量，灵活高效运用{{b0475}}准{{b0476}}息等多种政策工具，保持流动性充裕，使社会融资规模、货币供应量增长同经济增长、价格总水平预期目标相匹配。畅通货币政策传导机制，引导金融机构加力支持扩大{{b0477}}、科技创新、{{b0478}}企业等重点领域。规范信贷市场经营行为，{{b0479}}融资中间费用，促进社会综合融资成本低位运行。","blanks":[{"id":"b0473","answer":"货币","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0474","answer":"回升","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0475","answer":"降","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0476","answer":"降","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0477","answer":"内需","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0478","answer":"中小微","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0479","answer":"降低","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0260","unit":"u026","page":32,"subtitle":"（三）2026年政策取向","text":"3.强化改革举措与宏观政策协同。增强宏观政策取向一致性和有效性，将各类经济政策和非经济政策、存量政策和增量政策纳入宏观政策取向{{b0480}}评估。","blanks":[{"id":"b0480","answer":"一致性","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0261","unit":"u026","page":32,"subtitle":"（四）2026年政府工作任务","text":"1.着力建设强大国内市场。坚持{{b0481}}主导，统筹促消费和扩投资，拓展内需增长新空间，更好发挥我国超大规模市场优势。","blanks":[{"id":"b0481","answer":"内需","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0262","unit":"u026","page":32,"subtitle":"（四）2026年政府工作任务","text":"（1）深入实施提振消费专项行动。制定实施城乡居民增收计划，在促进低收入群体增收、增加居民{{b0482}}收入、完善薪酬和社保制度等方面推出一批务实举措。促进{{b0483}}消费扩容升级，支持消费品以旧换新，优化政策实施机制。扩大个人消费贷款和服务业经营主体贷款{{b0484}}息政策支持领域，{{b0485}}贴息上限，延长实施期限。支持{{b0486}}的地方推广中小学春秋假，落实职工带薪错峰休假制度。","blanks":[{"id":"b0482","answer":"财产性","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0483","answer":"商品","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0484","answer":"贴","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0485","answer":"提高","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0486","answer":"有条件","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0263","unit":"u026","page":32,"subtitle":"（四）2026年政府工作任务","text":"（2）充分挖掘释放有效投资潜力。增强{{b0487}}主导的有效投资增长动力，提高{{b0488}}类政府投资比重。单列并提高用于{{b0489}}建设的地方政府专项债券额度，继续向投资项目准备充分、资金用得好的地方倾斜。","blanks":[{"id":"b0487","answer":"市场","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0488","answer":"民生","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0489","answer":"项目","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0264","unit":"u026","page":32,"subtitle":"（四）2026年政府工作任务","text":"2.加紧培育壮大新动能。坚持把发展经济的着力点放在{{b0490}}经济上，因地制宜发展新质生产力，建设现代化产业体系。","blanks":[{"id":"b0490","answer":"实体","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0265","unit":"u026","page":32,"subtitle":"（1）优化提升传统产业。","text":"（2）培育壮大新兴产业和未来产业。实施产业创新工程，鼓励{{b0491}}带头开放应用场景，打造集成电路、航空航天、生物医药、低空经济等{{b0492}}支柱产业。建立未来产业投入增长和风险分担机制，培育发展未来能源、量子科技、生物制造、{{b0493}}智能、脑机接口、6G等未来产业。高效用好国家创业投资引导基金，大力发展创业投资、天使投资，{{b0494}}投资基金要带头做耐心资本，推动更多初创企业加快成长为科技领军企业。","blanks":[{"id":"b0491","answer":"央企国企","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0492","answer":"新兴","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0493","answer":"具身","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0494","answer":"政府","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0266","unit":"u026","page":32,"subtitle":"3.加快高水平科技自立自强。","text":"（1）加强原始创新和关键核心技术攻关。继续{{b0495}}基础研究投入比重，加大长期{{b0496}}支持。","blanks":[{"id":"b0495","answer":"提高","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0496","answer":"稳定","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0267","unit":"u026","page":32,"subtitle":"3.加快高水平科技自立自强。","text":"（2）推动科技创新和产业创新深度融合。建设北京（京津冀）、上海（长三角）、粤港澳大湾区国际科技创新中心，打造世界级科技创新策源地。强化{{b0497}}创新主体地位，支持科技领军企业牵头组建创新联合体，提高承担国家重大科技项目比例。","blanks":[{"id":"b0497","answer":"企业","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0268","unit":"u026","page":32,"subtitle":"4.持续深化重点领域改革。","text":"（1）纵深推进全国统一大市场建设。完善统计、财税、考核等制度，规范地方政府经济促进行为，出台地方政府招商引资鼓励和禁止事项清单，{{b0498}}税收优惠、财政补贴政策。加强反垄断、反不正当竞争，强化公平竞争审查{{b0499}}约束，综合运用产能调控、标准引领、价格执法、质量监管等手段，深入{{b0500}}“内卷式”竞争，营造良好市场生态。深化要素{{b0501}}配置综合改革试点，将更多符合条件的地区纳入试点范围。","blanks":[{"id":"b0498","answer":"规范","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0499","answer":"刚性","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0500","answer":"整治","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0501","answer":"市场化","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0269","unit":"u026","page":33,"subtitle":"4.持续深化重点领域改革。","text":"（2）推进财税金融体制改革。加大财政资源和预算统筹力度，{{b0502}}国有资本收益收取比例。调整优化消费税征税范围、税率，并推进部分品目征收环节后移。规范金融机构竞争秩序，深入推进地方中小金融机构{{b0503}}量提质。持续深化资本市场投融资综合改革，进一步健全中长期资金入市机制，完善投资者保护制度，拓展私募股权和创投基金退出渠道，提高{{b0504}}融资、股权融资比重。","blanks":[{"id":"b0502","answer":"提高","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0503","answer":"减","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0504","answer":"直接","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0270","unit":"u026","page":33,"subtitle":"4.持续深化重点领域改革。","text":"5.进一步扩大高水平对外开放。坚持合作共赢，稳步扩大{{b0505}}开放，拓展国际循环，以开放促改革促发展。","blanks":[{"id":"b0505","answer":"制度型","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0271","unit":"u026","page":33,"subtitle":"4.持续深化重点领域改革。","text":"（1）积极扩大自主开放。以{{b0506}}为重点扩大市场准入和开放领域，进一步扩大增值电信、生物技术、外商独资医院等领域开放试点，有序扩大数字领域开放，{{b0507}}跨境服务贸易负面清单。优化自由贸易试验区布局范围、提升创新引领发展能级，扎实推进{{b0508}}自由贸易港建设。","blanks":[{"id":"b0506","answer":"服务业","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0507","answer":"压减","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0508","answer":"海南","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0272","unit":"u026","page":33,"subtitle":"（2）推动外贸稳规模优结构。引导企业优化全球市场布局，推进贸易投资一体化、内外贸一体化发展。","text":"（3）扩大双向投资合作。深化外商投资促进体制机制改革，保障外资企业国民待遇，实施新版鼓励外商投资产业目录，促进外资境内再投资、扩大{{b0509}}生产。","blanks":[{"id":"b0509","answer":"本地化","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0273","unit":"u026","page":33,"subtitle":"6.推动新型城镇化和区域协调发展。深入实施区域协调发展战略、区域重大战略、主体功能区战略和新型城镇化战略，构建优势互补、高质量发展的区域经济布局和国土空间体系。","text":"（1）深入推进以人为本的新型城镇化。科学有序推进农业转移人口市民化，因地制宜放宽在{{b0510}}参加中考报名条件，进一步完善“人地钱”挂钩政策。坚持城市内涵式发展，优化现代化城市体系。","blanks":[{"id":"b0510","answer":"流入地","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0274","unit":"u026","page":33,"subtitle":"6.推动新型城镇化和区域协调发展。深入实施区域协调发展战略、区域重大战略、主体功能区战略和新型城镇化战略，构建优势互补、高质量发展的区域经济布局和国土空间体系。","text":"（2）不断增强区域发展协调性。支持{{b0511}}、长三角、粤港澳大湾区打造世界级城市群。加大{{b0512}}政策支持力度，深入推进兴边富民行动，促进革命老区、民族地区、边疆地区、资源枯竭城市等振兴发展。","blanks":[{"id":"b0511","answer":"京津冀","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0512","answer":"差异化","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0275","unit":"u026","page":33,"subtitle":"7.更大力度保障和改善民生。坚持民生为大，加强普惠性、基础性、兜底性民生建设，努力为人民群众多办实事。","text":"（1）促进高质量充分就业。实施稳岗扩容提质行动，支持{{b0513}}密集型行业企业稳定岗位。","blanks":[{"id":"b0513","answer":"劳动","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0276","unit":"u026","page":34,"subtitle":"7.更大力度保障和改善民生。坚持民生为大，加强普惠性、基础性、兜底性民生建设，努力为人民群众多办实事。","text":"（2）推动教育公平与质量提升。推动基础教育扩优提质，统筹{{b0514}}教育优质均衡发展、{{b0515}}教育优质普惠发展，完善免费学前教育政策，增加{{b0516}}高中学位供给。","blanks":[{"id":"b0514","answer":"义务","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0515","answer":"学前","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0516","answer":"普通","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0277","unit":"u026","page":34,"subtitle":"7.更大力度保障和改善民生。坚持民生为大，加强普惠性、基础性、兜底性民生建设，努力为人民群众多办实事。","text":"（3）强化基本医疗卫生服务。健全医疗、医保、医药{{b0517}}发展和治理机制，深化以{{b0518}}为导向的公立医院改革，加强县区、基层医疗机构运行保障。健全多层次医疗保障体系，稳步推动基本医疗保险{{b0519}}统筹。","blanks":[{"id":"b0517","answer":"协同","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0518","answer":"公益性","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0519","answer":"省级","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0278","unit":"u026","page":34,"subtitle":"7.更大力度保障和改善民生。坚持民生为大，加强普惠性、基础性、兜底性民生建设，努力为人民群众多办实事。","text":"（4）加强社会保障和服务。完善并落实基本养老保险{{b0520}}统筹制度，扩大失业、工伤保险覆盖面，稳妥有序推进职业伤害保障试点扩围，健全社保关系转移接续政策。加强初婚初育家庭住房保障，支持多子女家庭{{b0521}}住房需求。","blanks":[{"id":"b0520","answer":"全国","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0521","answer":"改善性","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0279","unit":"u026","page":34,"subtitle":"8.加强重点领域风险防范化解和安全能力建设。","text":"（1）着力稳定房地产市场。因城施策控增量、去库存、优供给，探索多渠道盘活存量商品房，鼓励收购存量商品房重点用于{{b0522}}性住房等。进一步发挥“保交房”的{{b0523}}名单制度作用，防范债务违约风险。","blanks":[{"id":"b0522","answer":"保障","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0523","answer":"白","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0280","unit":"u027","page":34,"subtitle":"","text":"到{{b0524}}年建成健康中国，是中共中央作出的一项战略决策。“十五五”是实现这一目标的关键时期，我们必须统筹谋划、加紧推进，力求取得{{b0525}}进展。","blanks":[{"id":"b0524","answer":"2035","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"},{"id":"b0525","answer":"决定性","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"}]},{"id":"q0281","unit":"u027","page":34,"subtitle":"","text":"第一，坚持从我国国情出发推动卫生与健康事业发展。我国是社会主义国家，是人口规模巨大、城乡区域{{b0526}}仍然较大的发展中国家，这决定我们必须坚持党对卫生与健康工作的领导，坚持人民至上、生命至上，坚持健康优先发展战略，坚持基本医疗卫生事业的{{b0527}}，走中国特色卫生与健康发展道路。","blanks":[{"id":"b0526","answer":"差距","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"},{"id":"b0527","answer":"公益性","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"}]},{"id":"q0282","unit":"u027","page":34,"subtitle":"","text":"中共中央明确提出新时代卫生与健康工作方针，即以{{b0528}}为重点，以改革创新为动力，{{b0529}}为主，中西医并重，把健康融入所有政策，人民共建共享。","blanks":[{"id":"b0528","answer":"基层","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"},{"id":"b0529","answer":"预防","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"}]},{"id":"q0283","unit":"u027","page":35,"subtitle":"","text":"第二，突出重点推进健康中国建设。要继续优化体系布局，实施医疗卫生强基工程，促进{{b0530}}诊疗，加强县区和基层医疗卫生机构运行保障。","blanks":[{"id":"b0530","answer":"分级","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"}]},{"id":"q0284","unit":"u027","page":35,"subtitle":"","text":"第三，为健康中国建设提供有力保障。要健全党委统一领导、党政齐抓共管的工作格局，将健康理念融入公共政策制定实施的全过程。要深化公立医院改革和医保支付方式改革，健全药品价格形成机制、优化药品和医用耗材{{b0531}}采购政策，提高医保资金使用效率，完善医疗、医保、医药协同发展和治理机制。","blanks":[{"id":"b0531","answer":"集中","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"}]},{"id":"q0285","unit":"u028","page":35,"subtitle":"","text":"2025年，党中央深入推进党风廉政建设和反腐败斗争，取得显著成效。强化政治监督，深化政治巡视，有力保障党中央重大决策部署贯彻落实；扎实开展深入贯彻{{b0532}}精神学习教育，推动全党进一步改作风树新风；保持反腐败高压态势，推进风腐同查同治，深化整治群众身边不正之风和腐败问题，着力铲除腐败滋生的土壤和条件。","blanks":[{"id":"b0532","answer":"中央八项规定","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0286","unit":"u028","page":35,"subtitle":"1.深刻把握实现“十五五”时期目标任务对维护党的团结统一提出的更高要求，坚定不移推动全党拥护“两个确立”、做到“两个维护”；","text":"2.深刻把握实现“十五五”时期目标任务对把权力关进{{b0533}}笼子提出的更高要求，坚定不移强化制度治权、依规用权；","blanks":[{"id":"b0533","answer":"制度","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0287","unit":"u028","page":35,"subtitle":"4.深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业。","text":"第一，强化{{b0534}}监督，推动全党凝心聚力实现“十五五”时期目标任务。","blanks":[{"id":"b0534","answer":"政治","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0288","unit":"u028","page":35,"subtitle":"4.深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业。","text":"第二，强化正风肃纪，巩固拓展深入贯彻中央八项规定精神学习教育成果。持续狠刹{{b0535}}主义、{{b0536}}之风，对违规吃喝、违规收送礼品礼金等易发多发问题深化整治；对以调研考察、开展党建活动、培训的名义搞公款旅游，变相公款出国（境）旅游等问题严肃查处；对借民生项目违规建设楼堂馆所等新动向密切关注并纠治。持续整治{{b0537}}主义、{{b0538}}主义，坚决纠治临近换届等待观望不作为，换届后急功近利“翻烧饼”、搞“政绩工程”等突出问题，推动为基层减负。","blanks":[{"id":"b0535","answer":"享乐","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0536","answer":"奢靡","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0537","answer":"形式","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0538","answer":"官僚","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0289","unit":"u028","page":36,"subtitle":"4.深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业。","text":"第三，强化标本兼治，用好一体推进不敢腐、不能腐、不想腐战略抓手。以保持高压震慑强化{{b0539}}腐，坚持猛药去疴、重典治乱。以加强监督制约强化{{b0540}}腐，健全授权用权制权相统一、清晰透明可追溯的制度机制。以深化廉洁教育强化{{b0541}}腐，不断塑造清正廉洁的思想品格、廉洁奉公的政德修养、廉洁自律的道德操守、崇廉拒腐的社会风尚。以完善体制机制促进一体推进，健全党委统一领导下的反腐败工作机制。","blanks":[{"id":"b0539","answer":"不敢","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0540","answer":"不能","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0541","answer":"不想","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0290","unit":"u028","page":36,"subtitle":"4.深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业。","text":"第四，强化执纪执法为民，持续深化群众身边不正之风和腐败问题集中整治。推动{{b0542}}级主战场持续深化整治工作，发挥{{b0543}}监督作用，提升基层监督能力。","blanks":[{"id":"b0542","answer":"县","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0543","answer":"群众","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0291","unit":"u028","page":36,"subtitle":"4.深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业。","text":"第五，强化政治巡视，增强巡视监督震慑力、穿透力、推动力。深化巡视巡察上下联动，加强对省区市{{b0544}}、中央单位内部{{b0545}}、对村{{b0546}}工作指导督导。","blanks":[{"id":"b0544","answer":"巡视","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0545","answer":"巡视","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0546","answer":"巡察","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0292","unit":"u029","page":36,"subtitle":"","text":"党的十八大以来，以习近平同志为核心的党中央围绕建设什么样的长期{{b0547}}的{{b0548}}政党、怎样建设长期{{b0549}}的{{b0550}}政党的重大时代课题，提出一系列新理念新思想新战略，形成习近平党建思想。","blanks":[{"id":"b0547","answer":"执政","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"},{"id":"b0548","answer":"马克思主义","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"},{"id":"b0549","answer":"执政","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"},{"id":"b0550","answer":"马克思主义","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0293","unit":"u029","page":36,"subtitle":"1.习近平党建思想的重要地位","text":"习近平党建思想丰富和发展了马克思主义建党学说，是坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合推进党的理论创新的重大成果，是党和人民实践经验和集体智慧的结晶，是习近平新时代中国特色社会主义思想的重要组成部分，为深入推进新时代党的建设新的伟大{{b0551}}提供了根本遵循和行动指南。","blanks":[{"id":"b0551","answer":"工程","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0294","unit":"u029","page":36,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持{{b0552}}是中国特色社会主义最本质的特征；","blanks":[{"id":"b0552","answer":"党的领导","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0295","unit":"u029","page":36,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持不忘{{b0553}}、牢记{{b0554}}是党的宗旨立场和价值取向；","blanks":[{"id":"b0553","answer":"初心","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"},{"id":"b0554","answer":"使命","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0296","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持以党的{{b0555}}建设为统领是新时代党的建设的根本要求；","blanks":[{"id":"b0555","answer":"政治","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0297","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持用党的创新理论凝心铸魂是党的思想建设的{{b0556}}任务；","blanks":[{"id":"b0556","answer":"根本","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072807.htm"}]},{"id":"q0298","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持健全上下贯通、执行有力的{{b0557}}体系是党的优势所在、力量所在；","blanks":[{"id":"b0557","answer":"组织","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0299","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持建设堪当民族复兴重任的高素质{{b0558}}队伍是关系党和国家事业的关键性问题；","blanks":[{"id":"b0558","answer":"干部","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0300","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持推进{{b0559}}建设常态化长效化是保持党同人民群众血肉联系的有效途径；","blanks":[{"id":"b0559","answer":"作风","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0301","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持用严明的{{b0560}}管全党治全党是全面从严治党的治本之策；","blanks":[{"id":"b0560","answer":"纪律","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0302","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持{{b0561}}治党、依规治党是全面从严治党的长远和根本之策；","blanks":[{"id":"b0561","answer":"制度","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0303","unit":"u029","page":37,"subtitle":"4.习近平党建思想的实践基础和理论渊源","text":"习近平党建思想是对新时代全面{{b0562}}实践经验的概括和凝练；习近平党建思想是对马克思主义建党学说的继承和发展；习近平党建思想是对中华优秀传统文化的传承和转化；习近平党建思想是对马克思主义政党经验教训的总结和镜鉴。","blanks":[{"id":"b0562","answer":"从严治党","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0304","unit":"u030","page":38,"subtitle":"","text":"未来产业具有{{b0563}}、战略性、颠覆性等特点，需要科学谋划、全局统筹。","blanks":[{"id":"b0563","answer":"前瞻性","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0305","unit":"u030","page":38,"subtitle":"","text":"要综合考虑国家战略需求、技术成熟程度、要素支撑条件等因素，因地制宜、{{b0564}}发展。","blanks":[{"id":"b0564","answer":"错位","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0306","unit":"u030","page":38,"subtitle":"","text":"要充分发挥新型举国体制优势，坚持“{{b0565}}出题、{{b0566}}答题”，加大重点领域关键核心技术攻关力度，加强{{b0567}}研究战略性、前瞻性、体系化布局，加快科技成果转化应用。","blanks":[{"id":"b0565","answer":"产业","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"},{"id":"b0566","answer":"科技","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"},{"id":"b0567","answer":"基础","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0307","unit":"u030","page":38,"subtitle":"","text":"要发挥{{b0568}}主体作用，推动各类创新资源向企业集聚，大力培育核心技术领先、创新能力强的科技领军企业和高新技术企业，引领带动产业向前沿和高端领域迈进。","blanks":[{"id":"b0568","answer":"企业","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0308","unit":"u030","page":38,"subtitle":"","text":"要完善财税等政策，大力发展{{b0569}}金融，全方位做好人才培养、引进、使用工作，在全社会营造鼓励创新的浓厚氛围。","blanks":[{"id":"b0569","answer":"科技","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0309","unit":"u030","page":38,"subtitle":"","text":"要统筹发展和{{b0570}}，探索科学有效的监管方式，防范相关风险，确保既“放得活”又“管得好”。要深化国际合作，积极推动各方标准共建、规则共商、产业共促。","blanks":[{"id":"b0570","answer":"安全","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0310","unit":"u031","page":38,"subtitle":"","text":"要站在统筹高质量发展和高水平安全的战略高度，充分认识做好防灾减灾救灾工作的重要性。做好防灾减灾救灾工作必须坚持党的全面领导，坚持人民至上、{{b0571}}至上，坚持尊重自然规律，坚持{{b0572}}为主，坚持改革创新，坚持系统观念，坚持社会共治。","blanks":[{"id":"b0571","answer":"生命","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"},{"id":"b0572","answer":"预防","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"}]},{"id":"q0311","unit":"u031","page":39,"subtitle":"","text":"降低灾害风险，减轻灾害损失，重在事前{{b0573}}。要坚持{{b0574}}管控，将安全韧性要求贯穿国土空间规划及各类建设规划之中。强化工程治理，合理提高重要城市和灾害多发地区关键基础设施设防标准，加紧补齐相关短板。要树牢{{b0575}}思维、{{b0576}}思维，不断提升大灾巨灾应对处置能力。健全大安全大应急框架下应急指挥机制，推进国家综合性消防救援队伍和国家区域应急救援中心建设。","blanks":[{"id":"b0573","answer":"预防","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"},{"id":"b0574","answer":"源头","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"},{"id":"b0575","answer":"底线","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"},{"id":"b0576","answer":"极限","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"}]},{"id":"q0312","unit":"u031","page":39,"subtitle":"","text":"基层是抵御自然灾害的第一线，抓基层、强基础的工作始终不能放松。要完善基层应急救援力量体系，强化应急场所建设和物资装备保障，抓好群测群防群治。各地区各有关部门要守土尽责，坚持统分结合、{{b0577}}衔接、上下联动，推动形成齐抓共管、协同配合的工作格局。树立和践行正确政绩观，坚决纠正重发展轻安全、重救灾轻预防等倾向。","blanks":[{"id":"b0577","answer":"防救","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"}]},{"id":"q0313","unit":"u032","page":39,"subtitle":"","text":"高质量推进国防和军队现代化，是推进中国式现代化的应有之义。“十五五”时期，要深入贯彻新时代强军思想，强化{{b0578}}引领，推动基本实现国防和军队现代化取得{{b0579}}进展。","blanks":[{"id":"b0578","answer":"政治","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"},{"id":"b0579","answer":"决定性","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"}]},{"id":"q0314","unit":"u032","page":39,"subtitle":"","text":"{{b0580}}建军是人民军队立军之本，关乎国防和军队现代化建设方向和底色。要坚持和加强党对军队的绝对领导，全面落实新时代政治建军方略，加强理论武装，深化思想整风，打牢官兵听党话、跟党走的思想根基，确保枪杆子永远听党指挥。要深入推进反腐败斗争，健全重大项目监管体系，确保各项建设质量托底、能力托底、廉洁托底。","blanks":[{"id":"b0580","answer":"政治","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"}]},{"id":"q0315","unit":"u032","page":39,"subtitle":"","text":"高质量推进国防和军队现代化，根本指向和检验标准始终是{{b0581}}。要加强作战能力体系集成，搞好{{b0582}}检验评估，扎实推进练兵备战，有效捍卫国家主权、安全、发展利益。巩固提高{{b0583}}国家战略体系和能力，是高质量推进国防和军队现代化的必由之路。","blanks":[{"id":"b0581","answer":"战斗力","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"},{"id":"b0582","answer":"实战化","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"},{"id":"b0583","answer":"一体化","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"}]},{"id":"q0316","unit":"u033","page":40,"subtitle":"1.充分认识制定和实施五年规划是我们的重要政治优势","text":"（1）制定和实施五年规划是我们党治国理政一条重要经验，是中国特色社会主义制度一个重要政治优势：有利于实现党的领导、有利于集中力量办大事、有利于前瞻性把握{{b0584}}问题、有利于保持事业{{b0585}}。","blanks":[{"id":"b0584","answer":"战略","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0585","answer":"连续性","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"}]},{"id":"q0317","unit":"u033","page":40,"subtitle":"（1）扎扎实实建设现代化产业体系","text":"《建议》把建设{{b0586}}摆在“十五五”时期各项战略任务的第一条。这些年我国经济顶风破浪、保持强大韧性和活力，战略依托就是完整的产业体系。各地区各行业要找准定位，坚持{{b0587}}、绿色化、融合化方向，发挥{{b0588}}优势，形成上下游产业相互衔接、各展其长、同向发力的生动局面。要保持{{b0589}}合理比重，大力发展先进制造业。发展新质生产力是建设现代化产业体系的必然要求。要坚持因地制宜，不能一哄而上、跟风冒进，更不能喜新厌旧、把{{b0590}}产业优势丢掉。","blanks":[{"id":"b0586","answer":"现代化产业体系","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0587","answer":"智能化","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0588","answer":"比较","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0589","answer":"制造业","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0590","answer":"传统","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"}]},{"id":"q0318","unit":"u033","page":40,"subtitle":"（2）以加快构建新发展格局赢得战略主动","text":"要坚持以{{b0591}}大循环为主体，正确处理消费和投资、需求和供给的关系，坚持惠民生和促消费、投资于物和投资于人紧密结合，努力提高国民经济循环质量和效率，让{{b0592}}成为经济发展的主动力。要以做强{{b0593}}循环提升扩大高水平对外开放的自主性，以拓展{{b0594}}循环增强国内改革发展的活力，努力实现内外联通、互促共进。","blanks":[{"id":"b0591","answer":"国内","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0592","answer":"内需","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0593","answer":"国内","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0594","answer":"国际","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"}]},{"id":"q0319","unit":"u033","page":40,"subtitle":"（3）推动经济和社会协调发展","text":"促进社会发展，{{b0595}}是重点，要把发展经济和改善民生有机统一起来。","blanks":[{"id":"b0595","answer":"改善民生","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"}]},{"id":"q0320","unit":"u033","page":40,"subtitle":"（3）推动经济和社会协调发展","text":"{{b0596}}是发展的前提。必须统筹发展和安全，深入贯彻总体国家安全观，全力维护国家安全和社会稳定。","blanks":[{"id":"b0596","answer":"安全","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"}]},{"id":"q0321","unit":"u034","page":41,"subtitle":"","text":"要牢牢把握雄安新区作为北京{{b0597}}功能疏解集中承载地的首要功能定位，保持战略定力和历史耐心，进一步解放思想、开拓思路、加强协调、凝聚合力，以改革创新为引领增强内生发展动力，以要素资源合理集聚为重点激发新区活力，努力建设新时代创新高地和推动高质量发展样板。","blanks":[{"id":"b0597","answer":"非首都","source":"https://www.gov.cn/yaowen/liebiao/202603/content_7063552.htm"}]},{"id":"q0322","unit":"u034","page":41,"subtitle":"","text":"深入推进雄安新区高质量建设和发展，必须坚持新区功能定位，更加有力有序推进北京非首都功能疏解和承接。要积极稳妥{{b0598}}推进央企、高校、医院疏解项目建设，有序推进金融机构、科研院所、事业单位疏解，支持疏解单位更好发展。","blanks":[{"id":"b0598","answer":"分批","source":"https://www.gov.cn/yaowen/liebiao/202603/content_7063552.htm"}]},{"id":"q0323","unit":"u034","page":41,"subtitle":"","text":"雄安新区要以{{b0599}}为动力，推动科技创新与产业创新深度融合，因地制宜发展新质生产力，培育符合新区实际的现代化产业体系。要高水平建设雄安中关村科技园，推动更多科创成果转化落地。推动新兴产业和未来产业集群式发展，积极发展{{b0600}}服务业，支持{{b0601}}产业改造升级。","blanks":[{"id":"b0599","answer":"改革创新","source":"https://www.gov.cn/yaowen/liebiao/202603/content_7063552.htm"},{"id":"b0600","answer":"生产性","source":"https://www.gov.cn/yaowen/liebiao/202603/content_7063552.htm"},{"id":"b0601","answer":"传统","source":"https://www.gov.cn/yaowen/liebiao/202603/content_7063552.htm"}]},{"id":"q0324","unit":"u035","page":41,"subtitle":"","text":"第二，坚持以和平发展守护共同家园。两岸同胞要守护好、建设好这个共同家园，根本在于坚持“{{b0602}}”、反对“台独”，核心是认同两岸同属一个中国。","blanks":[{"id":"b0602","answer":"九二共识","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7065151.htm"}]},{"id":"q0325","unit":"u036","page":42,"subtitle":"","text":"基础研究是整个科学体系的{{b0603}}，是所有技术问题的总机关。要以更大力度、更实举措加强基础研究，提升我国{{b0604}}创新能力，进一步打牢科技强国建设根基。","blanks":[{"id":"b0603","answer":"源头","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"},{"id":"b0604","answer":"原始","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"}]},{"id":"q0326","unit":"u036","page":42,"subtitle":"","text":"要加强统筹谋划和顶层设计，优化基础研究系统布局。坚持“{{b0605}}”战略导向，进一步明确基础研究的主攻方向和重点领域。强化国家科研机构、高水平研究型大学等引领作用，鼓励和规范发展新型研发机构，推动{{b0606}}主导的产学研用深度融合，打通基础研究、应用开发、成果转化的创新链条。加强基础学科建设，促进应用学科与基础学科协调发展。","blanks":[{"id":"b0605","answer":"四个面向","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"},{"id":"b0606","answer":"企业","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"}]},{"id":"q0327","unit":"u036","page":42,"subtitle":"","text":"要一体推进教育科技人才发展，全方位做好培养、引进、使用工作，壮大基础研究人才队伍。遵循人才成长规律，提高教育质量，源源不断培养基础研究后备力量。优化科教{{b0607}}育人机制，注重在科研一线发现和培养人才。坚持任务牵引、以老带新，大力扶持青年人才。弘扬科学家精神，加强科普宣传，激发青少年的想象力和探求欲，让投身基础研究成为更多青少年的人生追求。","blanks":[{"id":"b0607","answer":"协同","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"}]},{"id":"q0328","unit":"u036","page":42,"subtitle":"","text":"要加强对基础研究的支持保障。逐步提高基础研究经费占比，形成{{b0608}}化投入格局。体系化布局建设重大科技基础设施，建设智能化科研平台系统。健全符合基础研究特点的{{b0609}}评价体系，改善基础研究人员的工作和生活条件，营造开放包容、{{b0610}}失败的创新环境。","blanks":[{"id":"b0608","answer":"多元","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"},{"id":"b0609","answer":"分类","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"},{"id":"b0610","answer":"宽容","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"}]},{"id":"q0329","unit":"u037","page":42,"subtitle":"","text":"105年来，我们党团结带领全国各族人民不懈奋斗，创造了新民主主义革命、社会主义革命和建设、改革开放和社会主义现代化建设、{{b0611}}的伟大成就。105年不懈奋斗，从根本上改变了中国人民的前途命运，开辟了实现中华民族伟大复兴的正确道路，展示了马克思主义的强大生命力，深刻影响了世界历史进程，锻造了强大的中国共产党。","blanks":[{"id":"b0611","answer":"新时代中国特色社会主义","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0330","unit":"u037","page":43,"subtitle":"","text":"必须紧紧依靠{{b0612}}创造历史伟业，践行以{{b0613}}为中心的发展思想，充分激发亿万人民的积极性主动性创造性，统筹推进“五位一体”总体布局、协调推进“四个全面”战略布局，完整准确全面贯彻新发展理念，加快构建新发展格局，扎实推动高质量发展。","blanks":[{"id":"b0612","answer":"人民","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"},{"id":"b0613","answer":"人民","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0331","unit":"u037","page":43,"subtitle":"","text":"必须积极应对前进道路上的风险挑战，强化忧患意识、坚持{{b0614}}思维，发扬斗争精神、增强斗争本领，更好统筹国内国际两个大局，统筹发展和安全。","blanks":[{"id":"b0614","answer":"底线","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0332","unit":"u037","page":43,"subtitle":"","text":"必须持续推动构建人类命运共同体，高举和平、发展、合作、共赢旗帜，弘扬全人类共同价值，推动落实全球{{b0615}}倡议、全球安全倡议、全球文明倡议、全球{{b0616}}倡议，为世界和平与发展注入更多正能量。","blanks":[{"id":"b0615","answer":"发展","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"},{"id":"b0616","answer":"治理","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0333","unit":"u037","page":43,"subtitle":"","text":"必须持之以恒推进全面从严治党，全面贯彻新时代党建思想，健全全面从严治党体系，以党的{{b0617}}建设为统领加强党的各方面建设，坚决打好反腐败斗争攻坚战持久战总体战，不断增强党的政治领导力、思想引领力、群众组织力、社会号召力。","blanks":[{"id":"b0617","answer":"政治","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0334","unit":"u037","page":43,"subtitle":"","text":"{{b0618}}：30多年坚守在服务群众、化解矛盾的第一线，累计接待服务群众2万余人次，调解各类矛盾纠纷2500余件；总结形成“老马三十六策”等基层群众工作法，为加强和改进基层思想政治工作提供有益经验。","blanks":[{"id":"b0618","answer":"马善祥","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0335","unit":"u037","page":44,"subtitle":"","text":"{{b0619}}：担任村党支部书记多年，坚持发展为民、产业强村，开创“户户有股、人人劳动、家家分红”的集体经济发展模式，带领西辛庄村从贫困落后的黄河半滩区村发展为全国文明村、乡村振兴样板村。","blanks":[{"id":"b0619","answer":"李连成","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0336","unit":"u037","page":44,"subtitle":"","text":"{{b0620}}：30年来扎根基层治理一线，践行新时代“枫桥经验”，探索实行“四步议事”、“社区工作36法”等社区治理先进做法，调解各类纠纷1000余件；建立“吴亚琴工作站”，开发《社区治理与基层党建》等10余类培训课程，培训基层治理骨干近3万名。","blanks":[{"id":"b0620","answer":"吴亚琴","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0337","unit":"u037","page":44,"subtitle":"","text":"{{b0621}}：扎根丘陵山区发展现代农业60余载，奋战在乡村振兴一线，把论文写在大地上、把成果留在农民家；探索出“党支部+合作社+农户”的戴庄经验，累计推广农业新品种新技术350多万亩，帮助农民增收超300亿元。","blanks":[{"id":"b0621","answer":"赵亚夫","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0338","unit":"u038","page":44,"subtitle":"","text":"党的十八大以来，我国正从全球科技{{b0622}}、贡献者向开拓者、{{b0623}}加速转变，成为创新力上升最快的国家之一。{{b0624}}是人类文明进步的不竭动力，新一轮科技革命和产业变革深刻改变人类生产生活方式和世界发展格局，科技实力和创新能力越来越成为国家的核心竞争力。当前，人工智能蓬勃兴起，以数据、算力、算法等为关键要素，以神经科学、认知科学、计算科学、数学等理论突破和学科交叉为基础，以智能前沿技术群体性突破和广泛渗透赋能为标志，呈现数据驱动、万物互联、人机协同、跨界融合等显著特征。","blanks":[{"id":"b0622","answer":"参与者","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0623","answer":"引领者","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0624","answer":"科技创新","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0339","unit":"u038","page":45,"subtitle":"","text":"第一，增强科技创新体系化攻关能力。要坚持“四个面向”战略导向，进一步加强科技战略规划、政策措施、重大任务、科研力量、资源平台、区域创新等方面统筹，{{b0625}}科技攻关组织化程度，提升国家创新体系整体效能。","blanks":[{"id":"b0625","answer":"提高","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0340","unit":"u038","page":45,"subtitle":"","text":"第二，推动科技创新和产业创新深度融合。这是以高水平科技自立自强引领发展新质生产力的关键。要突出科技创新{{b0626}}和产业{{b0627}}牵引，推动产学研融通创新，打通科技加速向现实生产力转化的通道。科技创新要突出{{b0628}}导向，支持高校、科研院所对接企业开展科研攻关和人才培养，以高质量科技供给赋能产业创新。产业创新要提出科学问题，强化{{b0629}}创新主体地位，支持企业与高校、科研院所共建平台、共克难题，以高端化、绿色化、智能化产业需求牵引科技创新。","blanks":[{"id":"b0626","answer":"供给","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0627","answer":"需求","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0628","answer":"应用","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0629","answer":"企业","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0341","unit":"u038","page":45,"subtitle":"","text":"第三，大力培养优秀青年科技人才。{{b0630}}推进教育科技人才发展，是我们在实践中摸索总结的成功经验。要优化科教{{b0631}}育人机制，坚持在培养中使用、在使用中培养，注重在科研一线发现和培养更多优秀青年科技人才。加大对科研人员职业早期和长周期稳定支持力度，完善科技奖励、收入分配等制度，帮助解决实际困难，让他们潜心钻研、安身安心安业。要抓住全球人才流动窗口期，积极引进海外优秀青年人才和团队。","blanks":[{"id":"b0630","answer":"一体","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0631","answer":"协同","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0342","unit":"u038","page":45,"subtitle":"","text":"第四，提高科技创新投入效能。“十四五”时期，我国全社会研发经费投入保持年均10%的增长，投入强度2025年达到2.8%、首次超过{{b0632}}国家平均水平。要完善中央财政科技经费分配和管理使用机制，重点向战略性、关键性领域倾斜；健全重大科技任务央地投入共担机制，合理配置中央和地方财政资金，引导地方聚焦{{b0633}}战略需求加大研发投入。要引导{{b0634}}增加研发投入，调动更多社会力量支持科技创新。","blanks":[{"id":"b0632","answer":"经合组织","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0633","answer":"国家","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0634","answer":"企业","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0343","unit":"u038","page":45,"subtitle":"","text":"第五，用好科技评价指挥棒。项目评审、机构评估、人才评价都要强化创新能力、质量、实效、贡献导向，体现不同类别的{{b0635}}，不能评价指标权重模糊甚至本末倒置，不能搞“一刀切”、“一锅煮”。要持续深化科教界“帽子”治理，防止简单以称号头衔确定薪酬待遇、配置创新资源。","blanks":[{"id":"b0635","answer":"差异性","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0344","unit":"u039","page":45,"subtitle":"","text":"我们要学习江泽民同志坚定如磐的政治信仰。江泽民同志说：“我们共产党人的根本政治信仰是社会主义和{{b0636}}主义，世界观是马克思主义的{{b0637}}唯物主义和{{b0638}}唯物主义，这是任何时候都丝毫不能动摇的。”他提出我们党始终是中国{{b0639}}阶级的先锋队，同时是中国人民和中华民族的先锋队，强调领导干部要讲学习、讲政治、讲正气，推动着力解决提高领导水平和执政水平、增强拒腐防变和抵御风险能力两大历史性课题，保持党的先进性和纯洁性，扎实推进了党的建设新的伟大工程。","blanks":[{"id":"b0636","answer":"共产","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0637","answer":"辩证","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0638","answer":"历史","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0639","answer":"工人","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"}]},{"id":"q0345","unit":"u039","page":46,"subtitle":"","text":"我们要学习江泽民同志真挚深厚的为民情怀。江泽民同志强调：“全心全意为人民服务，立党为公，执政为民，是我们党同一切剥削阶级政党的根本区别。”他深刻指出，发展经济的根本目的是提高全国人民生活水平和质量，强调要全面建设惠及十几亿人口的更高水平的小康社会。他领导实施{{b0640}}大开发战略、国家八七扶贫攻坚计划，出台增加农民收入、关心国有企业下岗职工生活和再就业等政策举措，有力推动了新时期实现人民生活从温饱不足到{{b0641}}小康、奔向全面小康的历史性跨越。","blanks":[{"id":"b0640","answer":"西部","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0641","answer":"总体","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"}]},{"id":"q0346","unit":"u039","page":46,"subtitle":"","text":"我们要学习江泽民同志与时俱进的创新精神。江泽民同志强调：“创新是一个民族进步的灵魂，是一个国家兴旺发达的不竭动力，也是一个政党永葆生机的源泉。”他提出党的全部理论和工作要体现时代性、把握规律性、富于创造性，集中全党智慧创立“三个代表”重要思想，强调我们党始终代表中国先进{{b0642}}的发展要求、代表中国先进{{b0643}}的前进方向、代表中国最广大人民的根本利益，进一步回答了什么是社会主义、怎样建设社会主义的问题，创造性回答了建设{{b0644}}、怎样{{b0645}}的问题，深化了我们对新的时代条件下推进中国特色社会主义事业、加强党的建设规律的认识。他领导我们确定党在社会主义初级阶段的基本{{b0646}}，确立社会主义{{b0647}}经济体制的改革目标和基本框架，确立{{b0648}}为主体、多种所有制经济共同发展的基本经济制度和{{b0649}}分配为主体、多种分配方式并存的分配制度，推动经济体制、政治体制、文化体制等各方面改革。他提出坚持“引进来”和“走出去”相结合，以开放促改革促发展，领导我们成功加入{{b0650}}组织，形成对外开放新格局。","blanks":[{"id":"b0642","answer":"生产力","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0643","answer":"文化","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0644","answer":"什么样的党","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0645","answer":"建设党","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0646","answer":"纲领","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0647","answer":"市场","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0648","answer":"公有制","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0649","answer":"按劳","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0650","answer":"世界贸易","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"}]},{"id":"q0347","unit":"u039","page":46,"subtitle":"","text":"我们要学习江泽民同志深谋远虑的战略思维。江泽民同志从二十一世纪头20年是我国必须紧紧抓住并且可以大有作为的重要战略机遇期这一重大判断出发，对全面{{b0651}}小康社会、实现第三步战略目标进行前瞻性谋划；坚持把{{b0652}}作为党执政兴国的第一要务，引领全党全国各族人民聚精会神搞建设、一心一意谋发展；领导我们积极发展社会主义民主政治，实施{{b0653}}基本方略，发展社会主义先进文化；领导实现香港、澳门顺利回归，推动两岸双方达成体现一个中国原则的“{{b0654}}共识”，有力开展反分裂、反“台独”重大斗争；提出一系列外交和国际战略思想，推动世界多极化和经济全球化朝着正确方向发展。","blanks":[{"id":"b0651","answer":"建设","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0652","answer":"发展","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0653","answer":"依法治国","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0654","answer":"九二","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"}]},{"id":"q0348","unit":"u040","page":47,"subtitle":"","text":"人类不得不直面时代之问：当机器开始思考，人类如何与之相处？当算法参与决策，安全如何保障？当技术挑战伦理，治理如何跟上？当鸿沟不断拉大，普惠如何实现？中方认为，各国应当秉持{{b0655}}、{{b0656}}理念，让人工智能成为促进共同繁荣、维护共同安全的一个重要动力源，携手构建公正合理的全球人工智能治理体系。","blanks":[{"id":"b0655","answer":"以人为本","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"},{"id":"b0656","answer":"向上向善","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"}]},{"id":"q0349","unit":"u040","page":47,"subtitle":"","text":"第一，坚持开放共赢，驱动创新{{b0657}}。抓住难得的历史性机遇，鼓励{{b0658}}、合作共享，全面促进人工智能科技创新、产业发展、场景应用，协同推进传统产业改造升级、新兴产业培育壮大、未来产业前瞻布局，让人工智能赋能千行百业。","blanks":[{"id":"b0657","answer":"发展","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"},{"id":"b0658","answer":"开源开放","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"}]},{"id":"q0350","unit":"u040","page":47,"subtitle":"","text":"第二，强化风险意识，确保{{b0659}}可控。共同反对在人工智能领域泛化国家安全概念、把本国安全凌驾于他国安全之上的做法。","blanks":[{"id":"b0659","answer":"安全","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"}]},{"id":"q0351","unit":"u040","page":47,"subtitle":"","text":"第三，鼓励包容并蓄，促进文明互鉴。用{{b0660}}塑造人工智能的价值观，善用人工智能技术增进不同文明的理解和包容，促进不同文明交流互鉴，精心培育各美其美、美美与共的文明百花园。","blanks":[{"id":"b0660","answer":"全人类共同价值","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"}]},{"id":"q0352","unit":"u040","page":47,"subtitle":"","text":"第四，倡导和衷共济，完善全球治理。践行真正的多边主义，切实发挥{{b0661}}的重要作用，加强人工智能发展战略、治理规则、技术标准的对接协调，早日形成具有广泛共识的全球治理框架，让这一前沿技术更好造福人类社会。","blanks":[{"id":"b0661","answer":"联合国","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"}]},{"id":"q0353","unit":"u041","page":47,"subtitle":"","text":"今年是上海合作组织成立25周年。25年来，上海合作组织走过不平凡历程。最重大的发展成就是一步步成为世界上{{b0662}}最广、{{b0663}}最多、发展潜力巨大的新型区域合作组织；最宝贵的精神财富是开创性提出和始终遵循{{b0664}}、{{b0665}}、平等、协商、尊重多样文明、谋求共同发展的“上海精神”；最重要的合作经验是找到{{b0666}}、不对抗、不针对第三方的正确共处之道，推动地区国家携手建设共同家园。","blanks":[{"id":"b0662","answer":"幅员","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":"b0663","answer":"人口","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":"b0664","answer":"互信","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":"b0665","answer":"互利","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":"b0666","answer":"不结盟","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"}]},{"id":"q0354","unit":"u041","page":48,"subtitle":"","text":"第一，坚持{{b0667}}优先，开创共同繁荣的前景。我们要倡导普惠包容的{{b0668}}，巩固贸易投资、互联互通、能源资源等传统领域合作，拓展人工智能、数字经济、绿色产业、绿色矿产等新兴领域合作，推动区域合作走深走实、提质升级。中方将上海合作组织视为高质量共建“一带一路”、践行全球发展倡议的优先区域。","blanks":[{"id":"b0667","answer":"发展","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":"b0668","answer":"经济全球化","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"}]},{"id":"q0355","unit":"u041","page":48,"subtitle":"","text":"第二，坚持{{b0669}}为要，营造普遍安全的环境。中方愿同各方践行共同、综合、合作、可持续的安全观，将上海合作组织打造成践行全球安全倡议的重要平台。","blanks":[{"id":"b0669","answer":"安全","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"}]},{"id":"q0356","unit":"u041","page":48,"subtitle":"","text":"第三，坚持以人为本，厚植世代友好的根基。{{b0670}}文明、{{b0671}}文化是本地区鲜明特征。中方愿同各方一道落实全球文明倡议，支持上海合作组织睦邻友好合作委员会等民间友好机构发挥更大作用。","blanks":[{"id":"b0670","answer":"多样","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":"b0671","answer":"多元","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"}]},{"id":"q0357","unit":"u041","page":48,"subtitle":"","text":"第四，坚持对话协商，完善公平有序的{{b0672}}。我们要坚持大小国家一律平等，坚持地区事务共商共议、聚同化异，以对话协商妥处矛盾分歧，以多边协作应对共同挑战。中方支持上海合作组织就践行全球治理倡议开展示范性合作。","blanks":[{"id":"b0672","answer":"治理","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"}]},{"id":"q0358","unit":"u042","page":48,"subtitle":"","text":"近年来，全球南方卓然壮大，推动国际力量对比深刻调整，世界多极化大势不可逆转。世界需要怎样的多极化？各国如何参与和推动多极化？国际社会应当凝聚共识，作出经得起实践和历史检验的正确抉择。中国作为负责任大国，积极倡导{{b0673}}的世界多极化。","blanks":[{"id":"b0673","answer":"平等有序","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0359","unit":"u042","page":48,"subtitle":"1.主权平等、相互尊重是根本原则。世界历史由各国人民共同书写，世界多极化、发展道路自主化、国际关系民主化是人间正道。","text":"2.均衡有序、遵守法治是必然要求。{{b0674}}宪章宗旨和原则确立了国际关系基本准则，是战后国际秩序的基石。","blanks":[{"id":"b0674","answer":"联合国","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0360","unit":"u042","page":48,"subtitle":"1.主权平等、相互尊重是根本原则。世界历史由各国人民共同书写，世界多极化、发展道路自主化、国际关系民主化是人间正道。","text":"3.{{b0675}}主义、对话协商是关键路径。世界上的事应该由{{b0676}}商量着办，国际规则要由{{b0677}}共同制定。联合国权威和活力需要重振，各类全球和区域多边机制需要更加协同高效。","blanks":[{"id":"b0675","answer":"多边","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"},{"id":"b0676","answer":"各国","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"},{"id":"b0677","answer":"各国","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0361","unit":"u042","page":48,"subtitle":"1.主权平等、相互尊重是根本原则。世界历史由各国人民共同书写，世界多极化、发展道路自主化、国际关系民主化是人间正道。","text":"4.互利共赢、普惠包容是发展方向。我们要聚焦{{b0678}}议题，坚持开放合作，弥合数字和智能鸿沟，让技术革命和发展成果惠及各国人民。","blanks":[{"id":"b0678","answer":"发展","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0362","unit":"u042","page":49,"subtitle":"1.主权平等、相互尊重是根本原则。世界历史由各国人民共同书写，世界多极化、发展道路自主化、国际关系民主化是人间正道。","text":"第一，以“上合力量”驱动{{b0679}}大陆繁荣共兴。要继续发挥优势、挖掘潜能，以高质量共建“一带一路”联通亚欧大陆多个增长极，相互赋能、彼此成就，共创机遇、共享繁荣。","blanks":[{"id":"b0679","answer":"亚欧","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0363","unit":"u042","page":49,"subtitle":"1.主权平等、相互尊重是根本原则。世界历史由各国人民共同书写，世界多极化、发展道路自主化、国际关系民主化是人间正道。","text":"第三，以“上合行动”引领全球治理改革完善。要坚持结伴不结盟、对话不对抗，坚持{{b0680}}共建共享，推动各国在全球治理中平等参与、普遍受益。","blanks":[{"id":"b0680","answer":"共商","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0364","unit":"u043","page":49,"subtitle":"","text":"今年是金砖国家合作20周年。20年来，金砖合作机制不断发展壮大，展现出蓬勃生机活力，成为当今世界最具影响力的{{b0681}}市场和{{b0682}}国家合作平台。","blanks":[{"id":"b0681","answer":"新兴","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7080898.htm"},{"id":"b0682","answer":"发展中","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7080898.htm"}]},{"id":"q0365","unit":"u043","page":49,"subtitle":"","text":"第四，金砖国家要做改革完善全球治理的先锋。金砖国家要顺应国际关系民主化大势，推动构建更加公正合理的全球治理体系，维护联合国权威。支持以{{b0683}}为核心的多边贸易体制，推动世界贸易组织{{b0684}}，反对滥施关税，抵制一切形式的{{b0685}}主义措施。","blanks":[{"id":"b0683","answer":"世界贸易组织","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7080898.htm"},{"id":"b0684","answer":"改革","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7080898.htm"},{"id":"b0685","answer":"保护","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7080898.htm"}]},{"id":"q0366","unit":"u044","page":50,"subtitle":"","text":"新征程上，各级党校（行政学院）要坚持以新时代中国特色社会主义思想为指导，坚持党校姓党，牢记党校初心，更好为党育才、为党献策。要深化教学改革，突出党的理论教育、党性教育和履职能力培训，增强教育培训的针对性实效性。要加强党的{{b0686}}理论体系化学理化研究阐释，发挥好{{b0687}}作用。要坚持从严治校、质量立校，加强干部和教师队伍建设，加强对学员的管理监督，着力提高办学治校水平。各级党委要加强组织领导，整合资源力量，强化支持保障，推动新时代党校（行政学院）事业高质量发展。","blanks":[{"id":"b0686","answer":"创新","source":"https://www.gov.cn/yaowen/liebiao/202509/content_7042668.htm"},{"id":"b0687","answer":"智库","source":"https://www.gov.cn/yaowen/liebiao/202509/content_7042668.htm"}]},{"id":"q0367","unit":"u045","page":50,"subtitle":"","text":"党的十八大以来，党中央把全面依法治国纳入“四个全面”{{b0688}}布局予以有力推进，全面依法治国总体格局{{b0689}}形成，中国特色社会主义法治体系不断完善，中国特色社会主义法治道路越走越宽广。","blanks":[{"id":"b0688","answer":"战略","source":"https://www.gov.cn/yaowen/liebiao/202511/content_7048876.htm"},{"id":"b0689","answer":"基本","source":"https://www.gov.cn/yaowen/liebiao/202511/content_7048876.htm"}]},{"id":"q0368","unit":"u045","page":50,"subtitle":"","text":"新征程上，要全面贯彻新时代中国特色社会主义法治思想，坚持党的领导、人民当家作主、依法治国有机统一，聚焦建设更加完善的中国特色社会主义法治体系、建设更高水平的社会主义法治国家，更加注重法治与{{b0690}}、发展、稳定相协同，更加注重保障和促进社会公平正义，全面推进科学{{b0691}}、严格执法、公正{{b0692}}、全民守法，全面推进国家各方面工作法治化，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力法治保障。","blanks":[{"id":"b0690","answer":"改革","source":"https://www.gov.cn/yaowen/liebiao/202511/content_7048876.htm"},{"id":"b0691","answer":"立法","source":"https://www.gov.cn/yaowen/liebiao/202511/content_7048876.htm"},{"id":"b0692","answer":"司法","source":"https://www.gov.cn/yaowen/liebiao/202511/content_7048876.htm"}]},{"id":"q0369","unit":"u046","page":50,"subtitle":"","text":"党的十八大以来，中央企业认真贯彻党中央决策部署，积极服务国家战略，在国民经济中发挥了骨干和{{b0693}}作用。","blanks":[{"id":"b0693","answer":"支柱","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7052493.htm"}]},{"id":"q0370","unit":"u046","page":50,"subtitle":"","text":"新征程上，中央企业要充分认识肩负的职责使命，更好服务党和国家工作大局，服务经济社会高质量发展，服务保障和改善民生，勇担社会责任，为中国式现代化建设贡献更大力量。要聚焦主责主业，持续优化{{b0694}}经济布局，切实增强核心功能、提升核心竞争力。要立足{{b0695}}经济，强化关键核心技术攻关，推动科技创新和产业创新深度融合。要进一步深化改革，完善中国特色现代企业制度，健全公司治理结构，着力解决制约企业发展的深层次问题，努力建设世界一流企业。要统筹发展和安全，有效防范化解风险，不断夯实企业安全发展的基础。","blanks":[{"id":"b0694","answer":"国有","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7052493.htm"},{"id":"b0695","answer":"实体","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7052493.htm"}]},{"id":"q0371","unit":"u046","page":51,"subtitle":"","text":"要坚持和加强党的全面领导，加强企业领导班子建设，压实管党治党责任，推动{{b0696}}融入公司治理各环节，促进{{b0697}}工作与生产经营深度融合。要完善制度、强化监督，坚决惩治腐败，锲而不舍纠治“四风”，着力营造风清气正的政治生态。","blanks":[{"id":"b0696","answer":"党的领导","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7052493.htm"},{"id":"b0697","answer":"党建","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7052493.htm"}]},{"id":"q0372","unit":"u047","page":51,"subtitle":"","text":"要提高强农惠农富农政策效能，促进粮食等农产品价格{{b0698}}，促进农民增收。","blanks":[{"id":"b0698","answer":"保持在合理水平","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7053093.htm"}]},{"id":"q0373","unit":"u047","page":51,"subtitle":"","text":"要持续巩固拓展脱贫攻坚成果，把{{b0699}}帮扶纳入乡村振兴战略统筹实施，守牢不发生{{b0700}}返贫致贫底线。","blanks":[{"id":"b0699","answer":"常态化","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7053093.htm"},{"id":"b0700","answer":"规模性","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7053093.htm"}]},{"id":"q0374","unit":"u047","page":51,"subtitle":"","text":"要学习运用“{{b0701}}”经验，因地制宜推进宜居宜业和美乡村建设，提升乡村治理和文明乡风建设水平。","blanks":[{"id":"b0701","answer":"千万工程","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7053093.htm"}]},{"id":"q0375","unit":"u047","page":51,"subtitle":"","text":"要坚持把解决好“三农”问题作为重中之重，坚持{{b0702}}书记抓乡村振兴，努力把农业建成现代化大产业、使农村基本具备现代生活条件、让农民生活更加富裕美好。","blanks":[{"id":"b0702","answer":"五级","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7053093.htm"}]},{"id":"q0376","unit":"u048","page":51,"subtitle":"","text":"新征程上，要坚持以新时代中国特色社会主义思想为指导，完整准确全面贯彻新发展理念，突出{{b0703}}牵引、改革攻坚、科技赋能、开放合作，深入实施服务业扩能提质行动，推进{{b0704}}服务业向专业化和价值链高端延伸，促进{{b0705}}服务业高品质多样化便利化发展，培育更多“中国服务”品牌，努力开创服务业高质量发展新局面。","blanks":[{"id":"b0703","answer":"需求","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7064901.htm"},{"id":"b0704","answer":"生产性","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7064901.htm"},{"id":"b0705","answer":"生活性","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7064901.htm"}]},{"id":"q0377","unit":"u049","page":52,"subtitle":"","text":"2026年4月，习近平作出重要指示指出，义乌小商品闯出大市场、做成大产业，形成“义乌发展经验”，这是因地制宜发展{{b0706}}经济的成功实践。","blanks":[{"id":"b0706","answer":"县域","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7066680.htm"}]},{"id":"q0378","unit":"u050","page":52,"subtitle":"","text":"今年是“十五五”开局之年，也是开展{{b0707}}帮扶第一年。要总结运用{{b0708}}协作等有益经验，进一步完善协作机制，优化协作方式，拓展协作领域，推动东西部产业互补、人员互动、技术互学、观念互通、作风互鉴，实现互利共赢、共同发展。各级党委和政府要认真落实常态化帮扶责任，坚决守牢不发生规模性返贫致贫底线，扎实推进乡村全面振兴，不断增强区域发展协调性，推动全体人民共同富裕迈出坚实步伐。","blanks":[{"id":"b0707","answer":"常态化","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072506.htm"},{"id":"b0708","answer":"闽宁","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072506.htm"}]},{"id":"q0379","unit":"u051","page":52,"subtitle":"","text":"党的十八大以来，党中央把基础教育作为基础性、{{b0709}}工作来抓，多措并举推动基础教育实现长足发展，为建设教育强国提供了有力支撑。","blanks":[{"id":"b0709","answer":"先导性","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7076265.htm"}]},{"id":"q0380","unit":"u051","page":52,"subtitle":"","text":"新征程上，要以新时代中国特色社会主义思想为指导，全面贯彻党的教育方针，落实{{b0710}}根本任务，坚持不懈用党的创新理论铸魂育人，培养德智体美劳全面发展的社会主义建设者和接班人。要遵循教育规律，落实{{b0711}}第一教育理念，提升教育教学质量，促进广大学生身心健康、成长成才。要适应人民群众新期盼，推进基础教育扩优提质，牢牢守住教育{{b0712}}底线。要弘扬教育家精神，加强师德师风建设，培养造就高素质专业化教师队伍。各级党委和政府要切实扛起政治责任，优化办学资源配置，深化教育综合改革，推动学校、家庭、社会{{b0713}}发力，不断开创基础教育高质量发展新局面。","blanks":[{"id":"b0710","answer":"立德树人","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7076265.htm"},{"id":"b0711","answer":"健康","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7076265.htm"},{"id":"b0712","answer":"公平","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7076265.htm"},{"id":"b0713","answer":"同向","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7076265.htm"}]},{"id":"q0381","unit":"u052","page":53,"subtitle":"","text":"树立和践行正确政绩观是一项长期任务，必须久久为功，不断巩固拓展学习教育成果，持续推动各级党组织和广大党员、干部立党为公、{{b0714}}、{{b0715}}、真抓实干，努力创造经得起实践、人民、历史检验的实绩。","blanks":[{"id":"b0714","answer":"为民造福","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078989.htm"},{"id":"b0715","answer":"科学决策","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078989.htm"}]},{"id":"q0382","unit":"u052","page":53,"subtitle":"","text":"要经常性开展政绩观教育，重点抓好对地方党政正职、新提拔干部、年轻干部、关键岗位干部的教育培训，强化示范引领和反面警示，引导党员、干部始终以正确政绩观担当作为、履职尽责。要坚持{{b0716}}查改问题，对需要长期整改的政绩观偏差突出问题盯紧不放、跟踪问效，深化新官不理旧账整改整治。结合巡视巡察、审计监督、统计监督等精准发现问题，增强针对性和穿透力，扎实推动整改。要用好考核指挥棒，完善{{b0717}}考核评价体系，树立重实干重实绩的选人用人导向，让敢于负责、勇于担当、善于作为、实绩突出的干部受到重用。要加强政绩观行为的管理监督，严格执行民主集中制，对领导干部定期谈话提醒，及时发现并纠正苗头性倾向性问题。","blanks":[{"id":"b0716","answer":"常态化","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078989.htm"},{"id":"b0717","answer":"差异化","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078989.htm"}]},{"id":"q0383","unit":"u053","page":53,"subtitle":"","text":"新征程上，要以新时代中国特色社会主义思想为指导，完整准确全面贯彻新发展理念，统筹高质量发展和高水平安全，坚持智能化、绿色化、{{b0718}}方向，持续做大做强先进制造业，提升产业链自主可控水平，加快构建以先进{{b0719}}为骨干的现代化产业体系，巩固壮大{{b0720}}经济根基，为推进中国式现代化提供有力支撑。","blanks":[{"id":"b0718","answer":"融合化","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081344.htm"},{"id":"b0719","answer":"制造业","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081344.htm"},{"id":"b0720","answer":"实体","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081344.htm"}]},{"id":"q0384","unit":"u054","page":54,"subtitle":"","text":"学习教育以县处级以上领导班子和领导干部特别是“一把手”为重点，于2026年春节假期后启动、7月底基本结束。要以立党为公、为民造福、科学决策、真抓实干为总要求，以一体推进{{b0721}}为抓手，教育引导各级党组织和党员、干部坚持实事求是、求真务实，为{{b0722}}出政绩、以{{b0723}}出政绩，有效防范和纠治政绩观偏差。","blanks":[{"id":"b0721","answer":"学查改","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0722","answer":"人民","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0723","answer":"实干","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"}]},{"id":"q0385","unit":"u054","page":54,"subtitle":"","text":"学习教育要坚持聚焦主题、简约务实，{{b0724}}批次、{{b0725}}阶段，认真落实学习研讨、查摆问题、整改整治、建章立制、开门教育等工作安排。县处级以上领导班子及其成员通过督促检查、调查研究、了解群众反映等途径，深入查找政绩观方面存在的问题，从{{b0726}}上找差距、查根源、强修养。要坚持与中央巡{{b0727}}整改、深入贯彻中央八项规定精神学习教育整改、“十五五”规划编制实施、生态环保督察整改等相结合，边查边改、立行立改，对突出问题开展集中整治，持续推动整改落实。要坚持{{b0728}}教育，查摆问题听取群众意见，整改整治接受群众监督，检验成效接受群众评判；坚持民生为大，为群众多办实事，让群众可感可及。","blanks":[{"id":"b0724","answer":"不分","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0725","answer":"不划","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0726","answer":"党性","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0727","answer":"视","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0728","answer":"开门","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"}]},{"id":"q0386","unit":"u054","page":54,"subtitle":"","text":"1.{{b0729}}路线教育实践活动（2013）","blanks":[{"id":"b0729","answer":"党的群众","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"}]},{"id":"q0387","unit":"u054","page":54,"subtitle":"4.“不忘初心、牢记使命”主题教育（2019年）","text":"5.{{b0730}}学习教育（2021年）","blanks":[{"id":"b0730","answer":"党史","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"}]},{"id":"q0388","unit":"u054","page":55,"subtitle":"7.党纪学习教育（2024年）","text":"8.深入贯彻{{b0731}}精神学习教育（2025年）","blanks":[{"id":"b0731","answer":"中央八项规定","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"}]},{"id":"q0389","unit":"u055","page":55,"subtitle":"","text":"对经过{{b0732}}年以上培养教育和考察、基本具备党员条件的入党积极分子，在听取党小组、培养联系人、党员和群众等意见的基础上，党支部委员会会议研究讨论并报上级党委同意拟列为发展对象的，在工作、学习单位或者居住地进行公示，公示期不少于五个工作日。拟列为发展对象的流动人员，应当在{{b0733}}和{{b0734}}公示。发展对象应当有{{b0735}}名正式党员作入党介绍人。","blanks":[{"id":"b0732","answer":"一","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0733","answer":"流出地","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0734","answer":"流入地同时","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0735","answer":"两","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"}]},{"id":"q0390","unit":"u055","page":55,"subtitle":"","text":"发展对象未来{{b0736}}个月内将离开工作、学习单位的，一般不办理接收预备党员的手续。经基层党委预审合格的发展对象，应当在一个月内提交党支部党员大会讨论。召开讨论接收预备党员的党支部党员大会，实际到会有表决权的党员人数必须超过应到会有表决权的党员人数的{{b0737}}。赞成人数超过应到会有表决权的党员人数的{{b0738}}，才能通过接收预备党员的决议。党支部党员大会讨论两个以上的发展对象入党时，必须{{b0739}}讨论和表决。","blanks":[{"id":"b0736","answer":"三","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0737","answer":"半数","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0738","answer":"半数","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0739","answer":"逐个","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"}]},{"id":"q0391","unit":"u055","page":55,"subtitle":"","text":"预备党员的预备期为{{b0740}}年。预备期从党支部党员大会通过其为预备党员之日算起。预备党员预备期满，党支部应当及时讨论其能否转为正式党员。认真履行党员义务、具备党员条件的，应当按期转为正式党员；需要继续考察和教育的，可以延长一次预备期，延长时间不能少于{{b0741}}年，最长不超过{{b0742}}年；不履行党员义务、不具备党员条件的，应当取消其预备党员资格。预备党员转为正式党员、延长预备期或者取消预备党员资格，应当经党支部党员大会讨论通过和{{b0743}}批准。","blanks":[{"id":"b0740","answer":"一","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0741","answer":"半","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0742","answer":"一","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0743","answer":"上级党组织","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"}]},{"id":"q0392","unit":"u056","page":56,"subtitle":"1.确立统筹城乡的政策制度","text":"（1）统筹城乡制度安排。用人单位（包括企业、事业单位、机关、社会组织）以及单位职工、退休人员、灵活就业人员和未就业城乡居民等按照{{b0744}}管理原则，参加长期护理保险。各地建立长期护理保险制度可先从覆盖单位职工、退休人员、灵活就业人员等人群起步，逐步将{{b0745}}城乡居民纳入保障范围。","blanks":[{"id":"b0744","answer":"属地","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0745","answer":"未就业","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0393","unit":"u056","page":56,"subtitle":"1.确立统筹城乡的政策制度","text":"（2）统一保险统筹层次。长期护理保险从{{b0746}}级统筹起步。有条件的省份可探索按照政策统一规范、基金调剂平衡、完善分级管理、强化预算考核、优化管理服务的要求推动{{b0747}}统筹。坚持制度的{{b0748}}和规范性，确保统筹地区间在参保缴费、待遇支付、失能等级评估、基金管理、经办管理、信息化建设等方面相对均衡。","blanks":[{"id":"b0746","answer":"市地","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0747","answer":"省级","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0748","answer":"统一性","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0394","unit":"u056","page":56,"subtitle":"2.建立稳定可持续的筹资机制","text":"（1）长期护理保险费率统一控制在{{b0749}}%左右。","blanks":[{"id":"b0749","answer":"0.3","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0395","unit":"u056","page":56,"subtitle":"2.建立稳定可持续的筹资机制","text":"（2）单位职工费率由用人单位和个人按{{b0750}}比例分担，用人单位缴费基数为职工工资总额，个人缴费基数为本人工资收入，用人单位和个人共同缴费。","blanks":[{"id":"b0750","answer":"同","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0396","unit":"u056","page":56,"subtitle":"2.建立稳定可持续的筹资机制","text":"（3）退休人员费率与单位职工个人费率相同，缴费基数与养老金水平挂钩，由个人缴费，原用人单位{{b0751}}缴费。","blanks":[{"id":"b0751","answer":"不","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0397","unit":"u056","page":56,"subtitle":"3.实施公平适度的待遇保障","text":"（1）合理确定保障对象。按规定参保缴费且失能状态长期持续（一般为{{b0752}}个月以上），经申请通过评估认定的失能人员，可按规定享受相关待遇。长期护理保险制度起步阶段保障{{b0753}}度失能人员。","blanks":[{"id":"b0752","answer":"6","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0753","answer":"重","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0398","unit":"u056","page":56,"subtitle":"3.实施公平适度的待遇保障","text":"（2）合理确定待遇保障标准。符合规定的长期护理服务费用，按未就业城乡居民参保政策参保的，基金支付比例为{{b0754}}%左右；按单位职工参保政策参保的，基金支付比例为{{b0755}}%左右，退休人员享受单位职工参保待遇；灵活就业人员依据选择的参保政策类型享受相应待遇。根据失能等级、服务提供方式等实行{{b0756}}待遇保障政策。","blanks":[{"id":"b0754","answer":"50","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0755","answer":"70","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0756","answer":"差别化","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0399","unit":"u056","page":56,"subtitle":"3.实施公平适度的待遇保障","text":"（3）规范待遇享受。基金主要用于支付符合规定的长期护理服务机构和人员提供长期护理基本服务所发生的费用，原则上不直接向失能人员发放{{b0757}}。探索建立缴费时长和待遇水平相挂钩的连续参保激励机制，对连续参保的按规定适当{{b0758}}支付比例。","blanks":[{"id":"b0757","answer":"现金","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0758","answer":"提高","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0400","unit":"u057","page":57,"subtitle":"1.总体要求","text":"以满足群众{{b0759}}看病就医需求为出发点，以实施医疗卫生{{b0760}}工程为支撑，推进医疗卫生人员、服务下沉和基层能力提升，推动医疗卫生服务资源高效配置，加快建设分级诊疗体系。","blanks":[{"id":"b0759","answer":"就近就便","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"},{"id":"b0760","answer":"强基","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"}]},{"id":"q0401","unit":"u057","page":57,"subtitle":"（1）以紧密型医联体为抓手完善分级诊疗协同机制","text":"{{b0761}}级医院要稳定设置、优化功能，加强常见病专业建设，拓展康复、护理、安宁疗护、医养结合等服务，强化在三级医院和基层医疗卫生机构之间的桥梁纽带作用。{{b0762}}级医院要聚焦急危重症和疑难复杂疾病，加强转诊会诊和住院服务，逐步酌减常见病复诊和诊断明确、病情稳定的慢性病等普通门诊。国家医学中心、国家区域医疗中心、省级区域医疗中心、省级及以上医院要发挥专科优势，以区域死亡率高、外转率高的疾病为重点，提升区域医疗卫生服务能力整体水平，进一步{{b0763}}跨省跨区域就医。到2030年，以紧密型医联体为抓手的分级诊疗协同机制基本建立，医疗卫生服务{{b0764}}水平和便利性、可及性进一步提高，就医秩序更加合理规范。","blanks":[{"id":"b0761","answer":"二","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"},{"id":"b0762","answer":"三","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"},{"id":"b0763","answer":"减少","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"},{"id":"b0764","answer":"同质化","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"}]},{"id":"q0402","unit":"u057","page":57,"subtitle":"（1）以紧密型医联体为抓手完善分级诊疗协同机制","text":"（2）以{{b0765}}、{{b0766}}为重点引导群众基层首诊","blanks":[{"id":"b0765","answer":"常见病","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"},{"id":"b0766","answer":"慢性病","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"}]},{"id":"q0403","unit":"u057","page":57,"subtitle":"（1）以紧密型医联体为抓手完善分级诊疗协同机制","text":"（3）以提升就医{{b0767}}为导向加强转诊服务管理","blanks":[{"id":"b0767","answer":"连续性","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"}]},{"id":"q0404","unit":"u058","page":57,"subtitle":"","text":"1.加强随迁子女教育保障。学龄人口流入多的城市政府做好存量学位资源挖潜和整合利用，按需新增学位，巩固提升义务教育阶段随迁子女就读{{b0768}}学位比例。九年一贯制学校校内直升政策对随迁子女、当地户籍学生{{b0769}}对待。落实符合条件的随迁子女在常住地参加升学考试政策。","blanks":[{"id":"b0768","answer":"公办","source":"https://www.gov.cn/zhengce/content/202605/content_7069960.htm"},{"id":"b0769","answer":"同等","source":"https://www.gov.cn/zhengce/content/202605/content_7069960.htm"}]},{"id":"q0405","unit":"u058","page":57,"subtitle":"","text":"2.扩大公租房保障范围。推动更多城市将稳定就业居住的{{b0770}}常住人口家庭纳入公租房保障范围，推行按就业居住年限、住房困难程度确定保障对象、保障方式、保障标准、准入条件和退出机制。","blanks":[{"id":"b0770","answer":"未落户","source":"https://www.gov.cn/zhengce/content/202605/content_7069960.htm"}]},{"id":"q0406","unit":"u058","page":57,"subtitle":"","text":"3.健全就业地参加职工社会保险制度。{{b0771}}在就业地参加职工社会保险的户籍限制，大力推进全民参保计划。","blanks":[{"id":"b0771","answer":"全面取消","source":"https://www.gov.cn/zhengce/content/202605/content_7069960.htm"}]},{"id":"q0407","unit":"u058","page":57,"subtitle":"","text":"4.加强常住地基本医疗保障。加力落实持{{b0772}}参加城乡居民基本医疗保险政策。加强异地就医直接结算管理服务，提升异地就医备案管理和结算报销可及性、便利性。","blanks":[{"id":"b0772","answer":"居住证","source":"https://www.gov.cn/zhengce/content/202605/content_7069960.htm"}]},{"id":"q0408","unit":"u059","page":58,"subtitle":"1.职工有下列情形之一的，可以提取职工住房公积金账户内的存储余额：","text":"（1）支付{{b0773}}的；","blanks":[{"id":"b0773","answer":"房租","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"}]},{"id":"q0409","unit":"u059","page":58,"subtitle":"（4）装修自住住房的；","text":"（5）支付自住住房{{b0774}}费的；","blanks":[{"id":"b0774","answer":"物业","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"}]},{"id":"q0410","unit":"u059","page":58,"subtitle":"（9）国务院批准的其他住房消费情形。","text":"依照前款第六、七、八项规定提取职工住房公积金的，可以同时注销职工住房公积金账户。职工死亡或者被宣告死亡的，职工的继承人、受遗赠人{{b0775}}提取职工住房公积金账户内的存储余额；无继承人也无受遗赠人的，职工住房公积金账户内的存储余额纳入住房公积金的增值收益。","blanks":[{"id":"b0775","answer":"可以","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"}]},{"id":"q0411","unit":"u059","page":58,"subtitle":"（9）国务院批准的其他住房消费情形。","text":"2.住房公积金管理中心在保证住房公积金提取和贷款的前提下，经住房公积金管理委员会批准，可以将住房公积金用于购买{{b0776}}和政策性{{b0777}}。","blanks":[{"id":"b0776","answer":"国债","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"},{"id":"b0777","answer":"金融债","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"}]},{"id":"q0412","unit":"u059","page":58,"subtitle":"（9）国务院批准的其他住房消费情形。","text":"3.以欺诈、伪造证明材料或者其他手段违法提取住房公积金的，由住房公积金管理中心责令限期退回违法提取的住房公积金，{{b0778}}年内不得提取住房公积金或者使用住房公积金贷款。以欺诈、伪造证明材料或者其他手段违法获得住房公积金贷款的，由住房公积金管理中心责令限期返还贷款资金，{{b0779}}年内不得提取住房公积金或者使用住房公积金贷款。","blanks":[{"id":"b0778","answer":"3","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"},{"id":"b0779","answer":"5","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"}]},{"id":"q0413","unit":"u060","page":58,"subtitle":"","text":"2026年8月15日，《中华人民共和国生态环境法典》（以下简称《法典》）正式施行。《法典》包括总则、污染防治、生态保护、绿色低碳发展以及法律责任和附则五编内容，其中“{{b0780}}”单独成编，为世界环境法典体例之首创。","blanks":[{"id":"b0780","answer":"绿色低碳发展","source":"https://cpc.people.com.cn/n1/2026/0316/c64387-40682609.html"}]},{"id":"q0414","unit":"u060","page":58,"subtitle":"1.重要意义","text":"（1）《法典》是中国继民法典之后第{{b0781}}部以“法典”命名的法律，也是全球首部专门以“生态环境法典”命名的法律。","blanks":[{"id":"b0781","answer":"二","source":"http://www.npc.gov.cn/npc/c2/c30834/202603/t20260312_453172.html"}]},{"id":"q0415","unit":"u060","page":59,"subtitle":"1.重要意义","text":"（2）《法典》以“{{b0782}}法典化”的编纂模式，形成法典统领、单行法配套衔接的分层立法格局，开创性地探索出一条兼具体系性与开放性、稳定性与适应性的编纂新路。","blanks":[{"id":"b0782","answer":"适度","source":"https://www.news.cn/politics/20260305/80eb45310616404c84a08cd0e1e44e80/c.html"}]},{"id":"q0416","unit":"u060","page":59,"subtitle":"1.重要意义","text":"（3）《法典》将中国生态文明建设的成功实践、制度创新和治理经验上升为法律制度，是习近平{{b0783}}思想和习近平{{b0784}}思想贯通融合、交相辉映的重要结晶。","blanks":[{"id":"b0783","answer":"生态文明","source":"https://www.news.cn/20260815/ebe0dee125a644009491f8bd8fce4e36/c.html"},{"id":"b0784","answer":"法治","source":"https://www.news.cn/20260815/ebe0dee125a644009491f8bd8fce4e36/c.html"}]},{"id":"q0417","unit":"u060","page":59,"subtitle":"2.重要表述","text":"生态环境保护坚持{{b0785}}为主、系统治理、生态优先、绿色发展、公众参与、损害担责的原则。国家加强生态的保护与修复，坚持山水林田湖草沙一体化保护与修复，实行{{b0786}}为主、自然恢复与人工修复相结合的系统治理。","blanks":[{"id":"b0785","answer":"预防","source":"https://epaper.gmw.cn/gmrb/html/content/202603/16/content_8558.html"},{"id":"b0786","answer":"自然恢复","source":"https://epaper.gmw.cn/gmrb/html/content/202603/16/content_8558.html"}]},{"id":"q0418","unit":"u060","page":59,"subtitle":"2.重要表述","text":"国家建立健全生态保护补偿制度，通过财政{{b0787}}补偿、地区间{{b0788}}补偿、市场机制补偿等机制，对按照规定或者约定开展生态环境保护的地区、单位和个人予以补偿，按照生态系统的整体性、系统性及其内在规律，建立健全{{b0789}}主导、企业和社会参与、市场化运作、可持续的生态保护补偿机制，促进对生态环境的整体保护。","blanks":[{"id":"b0787","answer":"纵向","source":"https://epaper.gmw.cn/gmrb/html/content/202603/16/content_8558.html"},{"id":"b0788","answer":"横向","source":"https://epaper.gmw.cn/gmrb/html/content/202603/16/content_8558.html"},{"id":"b0789","answer":"政府","source":"https://epaper.gmw.cn/gmrb/html/content/202603/16/content_8558.html"}]},{"id":"q0419","unit":"u061","page":59,"subtitle":"一、总体要求","text":"坚持把解决好“三农”问题作为全党工作重中之重，坚持农业农村优先发展，坚持城乡融合发展，锚定农业农村现代化，以推进乡村全面振兴为{{b0790}}，以学习运用“{{b0791}}”经验为引领，以{{b0792}}为根本动力，提高强农惠农富农政策效能，守牢国家{{b0793}}安全底线，持续巩固拓展脱贫攻坚成果，提升乡村{{b0794}}发展水平、乡村建设水平、乡村治理水平，努力把农业建成现代化大产业、使农村基本具备现代生活条件、让农民生活更加富裕美好，为推进中国式现代化提供基础支撑。","blanks":[{"id":"b0790","answer":"总抓手","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0791","answer":"千万工程","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0792","answer":"改革创新","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0793","answer":"粮食","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0794","answer":"产业","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0420","unit":"u061","page":59,"subtitle":"1.提升农业综合生产能力和质量效益","text":"（1）稳定发展粮油生产。粮食产量稳定在{{b0795}}万亿斤左右。坚持产量产能、生产生态、增产增收一起抓，加力实施新一轮{{b0796}}亿斤粮食产能提升行动，促进良田良种良机良法集成增效，推进粮油作物大面积提单产。","blanks":[{"id":"b0795","answer":"1.4","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0796","answer":"千","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0421","unit":"u061","page":60,"subtitle":"1.提升农业综合生产能力和质量效益","text":"（2）促进“菜篮子”产业提质增效。坚持农林牧渔并举，推动构建{{b0797}}食物供给体系。","blanks":[{"id":"b0797","answer":"多元化","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0422","unit":"u061","page":60,"subtitle":"1.提升农业综合生产能力和质量效益","text":"（3）加强耕地保护和质量提升。分区分类高质量推进高标准农田建设，完善立项、建设、验收和管护机制，强化资金监管，加大土壤改良和地力提升力度。在确保{{b0798}}内耕地保护任务不降低前提下，稳妥有序退出河道湖区影响行洪安全等的不稳定耕地。","blanks":[{"id":"b0798","answer":"省域","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0423","unit":"u061","page":60,"subtitle":"1.提升农业综合生产能力和质量效益","text":"（4）提升农业科技创新效能。深化涉农高校教育教学改革，以{{b0799}}为导向加快新农科建设，推动涉农专业人才定向培养。","blanks":[{"id":"b0799","answer":"需求","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0424","unit":"u061","page":60,"subtitle":"2.实施常态化精准帮扶","text":"（1）健全常态化帮扶政策体系。落实常态化帮扶责任，稳步提升“三保障”和饮水安全保障水平，守牢不发生规模性返贫致贫底线。强化{{b0800}}帮扶，增强内生动力，发挥{{b0801}}兜底保障作用，推动帮扶政策协同集成。保持中央财政常态化帮扶资金规模及{{b0802}}两级投入资金规模稳定，{{b0803}}可根据帮扶任务合理安排资金。","blanks":[{"id":"b0800","answer":"开发式","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0801","answer":"社会救助","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0802","answer":"省市","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0803","answer":"县级","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0425","unit":"u061","page":60,"subtitle":"2.实施常态化精准帮扶","text":"（2）提高监测帮扶精准性时效性。扎实做好{{b0804}}两级常态化监测，健全精准识别和快速响应机制，确保早发现、早干预、早帮扶。","blanks":[{"id":"b0804","answer":"乡村","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0426","unit":"u061","page":60,"subtitle":"2.实施常态化精准帮扶","text":"（3）提升产业和就业帮扶实效。优化产业帮扶方式，{{b0805}}推进现有产业巩固、升级、盘活、调整，发展具有市场竞争力的帮扶产业。中央财政常态化帮扶资金用于产业发展的比例，在{{b0806}}级保持基本稳定，{{b0807}}级可实行差别化要求。","blanks":[{"id":"b0805","answer":"分类","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0806","answer":"省","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0807","answer":"县","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0427","unit":"u061","page":60,"subtitle":"3.积极促进农民稳定增收","text":"（1）保护和调动农民务农种粮积极性。加强农产品市场监测预警和信息发布，统筹做好市场化收购和政策性收储，促进粮食等重要农产品价格保持在合理水平。引导农业企业在粮食{{b0808}}统筹布局加工产能。落实好粮食产销区省际{{b0809}}利益补偿政策，支持粮食{{b0810}}补充财力、发展粮食产业。","blanks":[{"id":"b0808","answer":"主产区","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0809","answer":"横向","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0810","answer":"主产区","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0428","unit":"u061","page":60,"subtitle":"3.积极促进农民稳定增收","text":"（2）培育壮大县域富民产业。统筹发展科技农业、绿色农业、质量农业、品牌农业，开发农业多种功能，推动农村一二三产业深度融合。发展各具特色的{{b0811}}经济，培育中小企业特色产业集群，推动兴业、强县、富民一体发展。","blanks":[{"id":"b0811","answer":"县域","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0429","unit":"u061","page":60,"subtitle":"3.积极促进农民稳定增收","text":"（3）促进农民工稳岗就业。扩大以{{b0812}}代{{b0813}}项目覆盖范围、建设领域和劳务报酬发放规模，鼓励采用灵活发包方式由农村基层自主实施项目。","blanks":[{"id":"b0812","answer":"工","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0813","answer":"赈","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0430","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（1）因地制宜完善乡村建设实施机制，分类有序、{{b0814}}化推进乡村振兴。","blanks":[{"id":"b0814","answer":"片区","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0431","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（2）支持紧密型{{b0815}}医共体提升综合服务能力，合理扩大基层医疗卫生机构药品采购、配备、使用范围。","blanks":[{"id":"b0815","answer":"县域","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0432","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（3）以{{b0816}}养老为基础，鼓励有条件的地方发展助餐服务、日间照料、康复护理等养老服务。","blanks":[{"id":"b0816","answer":"居家","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0433","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（4）有序推进农村集体经营性{{b0817}}入市，支持入市土地优先用于发展集体经济和乡村产业，严禁用于建设{{b0818}}。","blanks":[{"id":"b0817","answer":"建设用地","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0818","answer":"商品住房","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0434","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（5）依法维护进城落户农民土地{{b0819}}权、宅基地{{b0820}}权、集体收益{{b0821}}权，探索建立自愿有偿退出的办法。","blanks":[{"id":"b0819","answer":"承包","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0820","answer":"使用","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0821","answer":"分配","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0435","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（6）充实和稳定农村基层一线力量，公务员招录计划向{{b0822}}基层机关倾斜，原则上不得从{{b0823}}借调工作人员。","blanks":[{"id":"b0822","answer":"县乡","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0823","answer":"县乡","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0436","unit":"u062","page":61,"subtitle":"1.总体要求","text":"牢牢把住处理好{{b0824}}这条主线，锚定加快建设农业强国目标，坚持把依法维护农民权益作为出发点和落脚点，把强化{{b0825}}所有制根基、保障和实现农民集体成员权利同激活资源要素统一起来，充分运用农村承包地确权登记颁证成果，通过细致工作有序推进，确保第{{b0826}}轮土地承包到期后再延长{{b0827}}年政策扎实落实到位，不断完善农村承包地所有权、{{b0828}}权、{{b0829}}权分置政策体系，进一步巩固和完善农村基本经营制度。","blanks":[{"id":"b0824","answer":"农民和土地关系","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0825","answer":"集体","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0826","answer":"二","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0827","answer":"30","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0828","answer":"承包","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0829","answer":"经营","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]},{"id":"q0437","unit":"u062","page":61,"subtitle":"2.工作中要做到","text":"（1）坚持集体所有制不动摇，{{b0830}}打破原集体土地所有权的界限在全村范围内搞平均承包，充分维护农民集体对承包地发包、调整、监督、收回等各项权能，探索和丰富农村土地集体所有制的有效实现形式。","blanks":[{"id":"b0830","answer":"严禁","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]},{"id":"q0438","unit":"u062","page":61,"subtitle":"2.工作中要做到","text":"（2）坚持农户{{b0831}}承包经营，农村集体土地由本集体经济组织内农民家庭承包，农户承包地要保持稳定，发包方及其他组织、个人不得违法调整和收回农户承包地。","blanks":[{"id":"b0831","answer":"家庭","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]},{"id":"q0439","unit":"u062","page":61,"subtitle":"2.工作中要做到","text":"（3）坚持{{b0832}}主体地位，充分发挥农民主动性和创造性，鼓励农民集体在法律和政策范围内因地制宜探索延包具体路径和办法。","blanks":[{"id":"b0832","answer":"农民","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]},{"id":"q0440","unit":"u062","page":62,"subtitle":"（1）坚持延包原则。以户为单位开展延包，确保绝大多数农户原有承包地继续保持稳定，不能推倒重来、打乱重分，不能借机违法调整或收回农户承包地。","text":"（2）依法依规从严掌握“小调整”。坚持“大稳定、小调整”，“{{b0833}}”的前提是“{{b0834}}”。“小调整”是指在农村集体经济组织个别农户之间进行承包地小范围适当调整，仅限于少数存在承包地因{{b0835}}毁损等特殊情形且群众普遍要求调地的村组。","blanks":[{"id":"b0833","answer":"小调整","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0834","answer":"大稳定","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0835","answer":"自然灾害","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]},{"id":"q0441","unit":"u062","page":62,"subtitle":"（1）坚持延包原则。以户为单位开展延包，确保绝大多数农户原有承包地继续保持稳定，不能推倒重来、打乱重分，不能借机违法调整或收回农户承包地。","text":"（3）规范延包程序。延包工作小组由本集体经济组织成员大会或成员代表大会依法{{b0836}}产生。县级以上地方政府农业农村主管部门、乡（镇）政府要加强对延包方案制定和实施的指导监督，发现问题的，应当及时予以纠正。","blanks":[{"id":"b0836","answer":"选举","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]}]};

/* ---------- 中文数字归一化（用于判分容错） ---------- */
const CN_DIGIT={'〇':0,'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function cn2num(str){
  if(!/[〇零一二两三四五六七八九十百千万亿]/.test(str)) return str;
  // 逐位简单数字串（如 二〇二〇 -> 2020）
  if(/^[〇零一二三四五六七八九]+$/.test(str)){
    return str.split('').map(c=>CN_DIGIT[c]).join('');
  }
  // 组合数字（三十一 / 三百 / 一万四 等）
  const secs={'亿':100000000,'万':10000,'千':1000,'百':100,'十':10};
  let total=0, section=0, num=0; let hit=false;
  for(const ch of str){
    if(CN_DIGIT[ch]!==undefined){ num=CN_DIGIT[ch]; hit=true; }
    else if(secs[ch]!==undefined){
      const unit=secs[ch];
      if(unit>=10000){ section=(section+num)*unit; total+=section; section=0; }
      else { if(num===0) num=1; section+=num*unit; }
      num=0; hit=true;
    }
  }
  if(hit) return String(total+section+num);
  return str;
}

/* ---------- 答案归一化：去标点空格、全半角、数字等价 ---------- */
function normalize(s){
  if(s==null) return '';
  let t=String(s);
  // 全角转半角
  t=t.replace(/[\uFF01-\uFF5E]/g,m=>String.fromCharCode(m.charCodeAt(0)-0xFEE0));
  t=t.replace(/\u3000/g,' ');
  t=t.toLowerCase();
  // 统一百分号
  t=t.replace(/%/g,'％');
  // 提取中文/数字/字母 token，逐段转中文数字
  let out='';
  let buf='';
  const flush=()=>{ if(buf){ out+=cn2num(buf); buf=''; } };
  for(const ch of t){
    if(/[一-龥]/.test(ch)){ buf+=ch; }
    else { flush(); if(/[0-9a-z％]/.test(ch)) out+=ch; }
  }
  flush();
  // 去掉结构助词，增强容错
  out=out.replace(/[的地得了]/g,'');
  return out.trim();
}
function isCorrect(input, answer){
  const a=normalize(answer), u=normalize(input);
  if(!u) return false;
  if(u===a) return true;
  // 支持答案中以 / 或 ; 分隔的多个可接受写法
  const alts=String(answer).split(/[/；;]/).map(x=>normalize(x)).filter(Boolean);
  return alts.includes(u);
}

const LS_KEY='zzll_fill_state_v1';
let state={ blanks:{}, view:'home', unit:null, mode:'quiz' };
function loadState(){
  try{ const s=JSON.parse(localStorage.getItem(LS_KEY)); if(s&&s.blanks){ state.blanks=s.blanks; } }catch(e){}
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({blanks:state.blanks})); }catch(e){} }
function blankState(id){ return state.blanks[id]||null; } // {s:'ok'|'no', w:次数}
function setBlank(id, ok){
  const prev=state.blanks[id]||{s:null,w:0};
  prev.s=ok?'ok':'no';
  if(!ok) prev.w=(prev.w||0)+1;
  state.blanks[id]=prev;
  saveState();
}
function resetUnit(uid){
  itemsByUnit[uid].forEach(it=>it.blanks.forEach(b=>{ delete state.blanks[b.id]; }));
  saveState();
}
/* 统计 */
function unitStats(uid){
  let total=0, ok=0;
  itemsByUnit[uid].forEach(it=>it.blanks.forEach(b=>{
    total++;
    const st=blankState(b.id); if(st&&st.s==='ok') ok++;
  }));
  return {total, ok, pct:total?Math.round(ok/total*100):0};
}
function globalStats(){
  let total=0, ok=0, wrong=0;
  ITEMS.forEach(it=>it.blanks.forEach(b=>{
    total++; const st=blankState(b.id);
    if(st){ if(st.s==='ok') ok++; else wrong++; }
  }));
  return {total, ok, wrong, pct:Math.round(ok/total*100), done:ok+wrong};
}
function wrongIds(){
  const set=new Set();
  ITEMS.forEach(it=>it.blanks.forEach(b=>{ const st=blankState(b.id); if(st&&st.s==='no') set.add(b.id); }));
  return set;
}
