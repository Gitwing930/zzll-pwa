/* ===================== 题目文本 → 填空渲染 ===================== */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function blankWidth(ans){
  const n=Math.max(2, String(ans).length);
  return `width:${Math.min(n+1.4,18)}ch`;
}
function qTextHTML(item, inWrong){
  const parts=item.text.split(/\{\{(b\d+)\}\}/g);
  let html='';
  for(let i=0;i<parts.length;i++){
    if(i%2===0){ html+=esc(parts[i]); }
    else{
      const bid=parts[i];
      const b=item.blanks.find(x=>x.id===bid);
      const ans=b?b.answer:'';
      const st=blankState(bid);
      if(state.mode==='read'){
        const cls=(st&&st.s==='ok')?'reveal answered':'reveal';
        html+=`<span class="blank ${cls}"><span class="reveal">${esc(ans)}</span></span>`;
      }else if(state.mode==='match'){
        const done=st&&st.s==='ok';
        html+=`<span class="blank match-blank ${done?'match-ok':''}" data-bid="${bid}" data-ans="${esc(ans)}">
          <span class="match-slot">${done?esc(ans):'　　'}</span>
        </span>`;
      }else{
        let cls='';
        if(st&&st.s==='ok') cls='ok';
        else if(st&&st.s==='no') cls='no';
        const val=(st&&st.v!=null)?st.v:'';
        html+=`<span class="blank ${cls}" data-bid="${bid}" data-ans="${esc(ans)}">
          <input type="text" autocomplete="off" style="${blankWidth(ans)}" value="${esc(val)}" placeholder="${'　'.repeat(Math.max(2,String(ans).length))}">
          <button class="eye" tabindex="-1" title="显示答案"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <span class="ans-tip">答案：${esc(ans)}</span>
        </span>`;
      }
    }
  }
  return html;
}
function sourceHTML(item){
  const srcs=[...new Set(item.blanks.map(b=>b.source).filter(Boolean))];
  if(!srcs.length) return '';
  return srcs.map(s=>{
    const m=s.match(/^https?:\/\//);
    if(m) return `<a class="src-link" href="${esc(s)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>答案来源</a>`;
    return `<div class="src-link">来源：${esc(s)}</div>`;
  }).join('');
}

/* 选词填空交互 */
function bindMatch(){
  let picked=null;
  $$('#content .chip').forEach(chip=>{
    chip.onclick=()=>{
      if(chip.classList.contains('used')) return;
      if(picked===chip){ chip.classList.remove('picked'); picked=null; return; }
      if(picked) picked.classList.remove('picked');
      picked=chip; chip.classList.add('picked');
    };
  });
  $$('#content .match-blank').forEach(slot=>{
    slot.onclick=()=>{
      if(slot.classList.contains('match-ok')) return;
      if(!picked){
        $$('#content .match-selected').forEach(s=>s.classList.remove('match-selected'));
        slot.classList.add('match-selected');
        return;
      }
      const word=picked.textContent.trim();
      const ans=slot.dataset.ans;
      const bid=slot.dataset.bid;
      const ok=isCorrect(word,ans);
      const slotEl=slot.querySelector('.match-slot');
      if(ok){
        slotEl.textContent=word;
        slot.classList.remove('match-selected');
        slot.classList.add('match-ok');
        picked.classList.add('used');
        picked.classList.remove('picked');
        picked=null;
        setBlank(bid,true);
        afterJudge(true);
      }else{
        slotEl.textContent=word;
        slot.classList.add('match-no');
        picked.classList.add('shake');
        setTimeout(()=>{
          slotEl.textContent='　　';
          slot.classList.remove('match-no','match-selected');
          if(picked) picked.classList.remove('shake');
        },850);
      }
    };
  });
}

/* 判分交互 */
function bindBlanks(){
  $$('#content .blank').forEach(wrap=>{
    const input=wrap.querySelector('input'); if(!input) return;
    const bid=wrap.dataset.bid, ans=wrap.dataset.ans;
    const judge=()=>{
      const val=input.value;
      if(!val.trim()){ wrap.classList.remove('ok','no'); const st=blankState(bid); if(st&&st.s==='no'){/*keep*/} return; }
      const ok=isCorrect(val,ans);
      wrap.classList.toggle('ok',ok);
      wrap.classList.toggle('no',!ok);
      setBlank(bid,ok);
      state.blanks[bid].v=val; saveState();
      afterJudge(ok);
    };
    input.addEventListener('blur',judge);
    input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const n=$$('#content .blank input'); const i=n.indexOf(input); (n[i+1]||n[i]).focus(); } });
    input.addEventListener('input',()=>{ if(wrap.classList.contains('no')) wrap.classList.remove('no'); });
    const eye=wrap.querySelector('.eye');
    eye.onclick=(e)=>{ e.preventDefault();
      const tip=wrap.querySelector('.ans-tip');
      wrap.classList.add('peek'); tip.style.display=tip.style.display==='block'?'none':'block';
    };
  });
}
function afterJudge(ok){
  renderNav();
  if(state.view==='learn'){
    const stt=unitStats(state.unit);
    const bar=$('#unitBar'), txt=$('#unitTxt'), num=$('#scoreNum');
    if(bar){ bar.style.width=stt.pct+'%'; txt.textContent=`${stt.ok}/${stt.total} 已掌握`; if(num) num.textContent=stt.ok; }
  }else if(state.view==='wrong'){
    if(ok){ setTimeout(()=>{ renderWrong(); renderNav(); }, 550); }
  }
}

/* ===================== 路由 / 框架 ===================== */
function go(view, unit){
  state.view=view; if(unit) state.unit=unit;
  if(view==='learn'){ state.mode=state.mode||'quiz'; renderLearn(); }
  else if(view==='wrong'){ renderWrong(); }
  else { renderHome(); }
  setNavActive();
  window.scrollTo({top:0,behavior:'instant' in window?'instant':'auto'});
}
let toastTimer=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}
function openSidebar(){ $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }

/* ===================== 初始化 ===================== */
loadState();
renderNav();
go('home');
$('#menuBtn').onclick=openSidebar;
$('#sbClose').onclick=closeSidebar;
$('#overlay').onclick=closeSidebar;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSidebar(); });
</script>
</body>
</html>
