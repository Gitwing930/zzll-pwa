"b0666","answer":"不结盟","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"}]},{"id":"q0354","unit":"u041","page":48,"subtitle":"","text":"第一，坚持{{b0667}}优先，开创共同繁荣的前景。我们要倡导普惠包容的{{b0668}}，巩固贸易投资、互联互通、能源资源等传统领域合作，拓展人工智能、数字经济、绿色产业、绿色矿产等新兴领域合作，推动区域合作走深走实、提质升级。中方将上海合作组织视为高质量共建“一带一路”、践行全球发展倡议的优先区域。","blanks":[{"id":"b0667","answer":"发展","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":"b0668","answer":"经济全球化","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"}]},{"id":"q0355","unit":"u041","page":48,"subtitle":"","text":"第二，坚持{{b0669}}为要，营造普遍安全的环境。中方愿同各方践行共同、综合、合作、可持续的安全观，将上海合作组织打造成践行全球安全倡议的重要平台。","blanks":[{"id":"b0669","answer":"安全","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"}]},{"id":"q0356","unit":"u041","page":48,"subtitle":"","text":"第三，坚持以人为本，厚植世代友好的根基。{{b0670}}文明、{{b0671}}文化是本地区鲜明特征。中方愿同各方一道落实全球文明倡议，支持上海合作组织睦邻友好合作委员会等民间友好机构发挥更大作用。","blanks":[{"id":"b0670","answer":"多样","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":"b0671","answer":"多元","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"}]},{"id":"q0357","unit":"u041","page":48,"subtitle":"","text":"第四，坚持对话协商，完善公平有序的{{b0672}}。我们要坚持大小国家一律平等，坚持地区事务共商共议、聚同化异，以对话协商妥处矛盾分歧，以多边协作应对共同挑战。中方支持上海合作组织就践行全球治理倡议开展示范性合作。","blanks":[{"id":"b0672","answer":"治理","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"}]},{"id":"q0358","unit":"u042","page":48,"subtitle":"","text":"近年来，全球南方卓然壮大，推动国际力量对比深刻调整，世界多极化大势不可逆转。世界需要怎样的多极化？各国如何参与和推动多极化？国际社会应当凝聚共识，作出经得起实践和历史检验的正确抉择。中国作为负责任大国，积极倡导{{b0673}}的世界多极化。","blanks":[{"id":"b0673","answer":"平等有序","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0359","unit":"u042","page":48,"subtitle":"1.主权平等、相互尊重是根本原则。世界历史由各国人民共同书写，世界多极化、发展道路自主化、国际关系民主化是人间正道。","text":"2.均衡有序、遵守法治是必然要求。{{b0674}}宪章宗旨和原则确立了国际关系基本准则，是战后国际秩序的基石。","blanks":[{"id":"b0674","answer":"联合国","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0360","unit":"u042","page":48,"subtitle":"1.主权平等、相互尊重是根本原则。世界历史由各国人民共同书写，世界多极化、发展道路自主化、国际关系民主化是人间正道。","text":"3.{{b0675}}主义、对话协商是关键路径。世界上的事应该由{{b0676}}商量着办，国际规则要由{{b0677}}共同制定。联合国权威和活力需要重振，各类全球和区域多边机制需要更加协同高效。","blanks":[{"id":"b0675","answer":"多边","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"},{"id":"b0676","answer":"各国","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"},{"id":"b0677","answer":"各国","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0361","unit":"u042","page":48,"subtitle":"1.主权平等、相互尊重是根本原则。世界历史由各国人民共同书写，世界多极化、发展道路自主化、国际关系民主化是人间正道。","text":"4.互利共赢、普惠包容是发展方向。我们要聚焦{{b0678}}议题，坚持开放合作，弥合数字和智能鸿沟，让技术革命和发展成果惠及各国人民。","blanks":[{"id":"b0678","answer":"发展","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0362","unit":"u042","page":49,"subtitle":"1.主权平等、相互尊重是根本原则。世界历史由各国人民共同书写，世界多极化、发展道路自主化、国际关系民主化是人间正道。","text":"第一，以“上合力量”驱动{{b0679}}大陆繁荣共兴。要继续发挥优势、挖掘潜能，以高质量共建“一带一路”联通亚欧大陆多个增长极，相互赋能、彼此成就，共创机遇、共享繁荣。","blanks":[{"id":"b0679","answer":"亚欧","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0363","unit":"u042","page":49,"subtitle":"1.主权平等、相互尊重是根本原则。世界历史由各国人民共同书写，世界多极化、发展道路自主化、国际关系民主化是人间正道。","text":"第三，以“上合行动”引领全球治理改革完善。要坚持结伴不结盟、对话不对抗，坚持{{b0680}}共建共享，推动各国在全球治理中平等参与、普遍受益。","blanks":[{"id":"b0680","answer":"共商","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079852.htm"}]},{"id":"q0364","unit":"u043","page":49,"subtitle":"","text":"今年是金砖国家合作20周年。20年来，金砖合作机制不断发展壮大，展现出蓬勃生机活力，成为当今世界最具影响力的{{b0681}}市场和{{b0682}}国家合作平台。","blanks":[{"id":"b0681","answer":"新兴","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7080898.htm"},{"id":"b0682","answer":"发展中","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7080898.htm"}]},{"id":"q0365","unit":"u043","page":49,"subtitle":"","text":"第四，金砖国家要做改革完善全球治理的先锋。金砖国家要顺应国际关系民主化大势，推动构建更加公正合理的全球治理体系，维护联合国权威。支持以{{b0683}}为核心的多边贸易体制，推动世界贸易组织{{b0684}}，反对滥施关税，抵制一切形式的{{b0685}}主义措施。","blanks":[{"id":"b0683","answer":"世界贸易组织","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7080898.htm"},{"id":"b0684","answer":"改革","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7080898.htm"},{"id":"b0685","answer":"保护","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7080898.htm"}]},{"id":"q0366","unit":"u044","page":50,"subtitle":"","text":"新征程上，各级党校（行政学院）要坚持以新时代中国特色社会主义思想为指导，坚持党校姓党，牢记党校初心，更好为党育才、为党献策。要深化教学改革，突出党的理论教育、党性教育和履职能力培训，增强教育培训的针对性实效性。要加强党的{{b0686}}理论体系化学理化研究阐释，发挥好{{b0687}}作用。要坚持从严治校、质量立校，加强干部和教师队伍建设，加强对学员的管理监督，着力提高办学治校水平。各级党委要加强组织领导，整合资源力量，强化支持保障，推动新时代党校（行政学院）事业高质量发展。","blanks":[{"id":"b0686","answer":"创新","source":"https://www.gov.cn/yaowen/liebiao/202509/content_7042668.htm"},{"id":"b0687","answer":"智库","source":"https://www.gov.cn/yaowen/liebiao/202509/content_7042668.htm"}]},{"id":"q0367","unit":"u045","page":50,"subtitle":"","text":"党的十八大以来，党中央把全面依法治国纳入“四个全面”{{b0688}}布局予以有力推进，全面依法治国总体格局{{b0689}}形成，中国特色社会主义法治体系不断完善，中国特色社会主义法治道路越走越宽广。","blanks":[{"id":"b0688","answer":"战略","source":"https://www.gov.cn/yaowen/liebiao/202511/content_7048876.htm"},{"id":"b0689","answer":"基本","source":"https://www.gov.cn/yaowen/liebiao/202511/content_7048876.htm"}]},{"id":"q0368","unit":"u045","page":50,"subtitle":"","text":"新征程上，要全面贯彻新时代中国特色社会主义法治思想，坚持党的领导、人民当家作主、依法治国有机统一，聚焦建设更加完善的中国特色社会主义法治体系、建设更高水平的社会主义法治国家，更加注重法治与{{b0690}}、发展、稳定相协同，更加注重保障和促进社会公平正义，全面推进科学{{b0691}}、严格执法、公正{{b0692}}、全民守法，全面推进国家各方面工作法治化，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力法治保障。","blanks":[{"id":"b0690","answer":"改革","source":"https://www.gov.cn/yaowen/liebiao/202511/content_7048876.htm"},{"id":"b0691","answer":"立法","source":"https://www.gov.cn/yaowen/liebiao/202511/content_7048876.htm"},{"id":"b0692","answer":"司法","source":"https://www.gov.cn/yaowen/liebiao/202511/content_7048876.htm"}]},{"id":"q0369","unit":"u046","page":50,"subtitle":"","text":"党的十八大以来，中央企业认真贯彻党中央决策部署，积极服务国家战略，在国民经济中发挥了骨干和{{b0693}}作用。","blanks":[{"id":"b0693","answer":"支柱","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7052493.htm"}]},{"id":"q0370","unit":"u046","page":50,"subtitle":"","text":"新征程上，中央企业要充分认识肩负的职责使命，更好服务党和国家工作大局，服务经济社会高质量发展，服务保障和改善民生，勇担社会责任，为中国式现代化建设贡献更大力量。要聚焦主责主业，持续优化{{b0694}}经济布局，切实增强核心功能、提升核心竞争力。要立足{{b0695}}经济，强化关键核心技术攻关，推动科技创新和产业创新深度融合。要进一步深化改革，完善中国特色现代企业制度，健全公司治理结构，着力解决制约企业发展的深层次问题，努力建设世界一流企业。要统筹发展和安全，有效防范化解风险，不断夯实企业安全发展的基础。","blanks":[{"id":"b0694","answer":"国有","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7052493.htm"},{"id":"b0695","answer":"实体","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7052493.htm"}]},{"id":"q0371","unit":"u046","page":51,"subtitle":"","text":"要坚持和加强党的全面领导，加强企业领导班子建设，压实管党治党责任，推动{{b0696}}融入公司治理各环节，促进{{b0697}}工作与生产经营深度融合。要完善制度、强化监督，坚决惩治腐败，锲而不舍纠治“四风”，着力营造风清气正的政治生态。","blanks":[{"id":"b0696","answer":"党的领导","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7052493.htm"},{"id":"b0697","answer":"党建","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7052493.htm"}]},{"id":"q0372","unit":"u047","page":51,"subtitle":"","text":"要提高强农惠农富农政策效能，促进粮食等农产品价格{{b0698}}，促进农民增收。","blanks":[{"id":"b0698","answer":"保持在合理水平","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7053093.htm"}]},{"id":"q0373","unit":"u047","page":51,"subtitle":"","text":"要持续巩固拓展脱贫攻坚成果，把{{b0699}}帮扶纳入乡村振兴战略统筹实施，守牢不发生{{b0700}}返贫致贫底线。","blanks":[{"id":"b0699","answer":"常态化","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7053093.htm"},{"id":"b0700","answer":"规模性","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7053093.htm"}]},{"id":"q0374","unit":"u047","page":51,"subtitle":"","text":"要学习运用“{{b0701}}”经验，因地制宜推进宜居宜业和美乡村建设，提升乡村治理和文明乡风建设水平。","blanks":[{"id":"b0701","answer":"千万工程","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7053093.htm"}]},{"id":"q0375","unit":"u047","page":51,"subtitle":"","text":"要坚持把解决好“三农”问题作为重中之重，坚持{{b0702}}书记抓乡村振兴，努力把农业建成现代化大产业、使农村基本具备现代生活条件、让农民生活更加富裕美好。","blanks":[{"id":"b0702","answer":"五级","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7053093.htm"}]},{"id":"q0376","unit":"u048","page":51,"subtitle":"","text":"新征程上，要坚持以新时代中国特色社会主义思想为指导，完整准确全面贯彻新发展理念，突出{{b0703}}牵引、改革攻坚、科技赋能、开放合作，深入实施服务业扩能提质行动，推进{{b0704}}服务业向专业化和价值链高端延伸，促进{{b0705}}服务业高品质多样化便利化发展，培育更多“中国服务”品牌，努力开创服务业高质量发展新局面。","blanks":[{"id":"b0703","answer":"需求","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7064901.htm"},{"id":"b0704","answer":"生产性","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7064901.htm"},{"id":"b0705","answer":"生活性","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7064901.htm"}]},{"id":"q0377","unit":"u049","page":52,"subtitle":"","text":"2026年4月，习近平作出重要指示指出，义乌小商品闯出大市场、做成大产业，形成“义乌发展经验”，这是因地制宜发展{{b0706}}经济的成功实践。","blanks":[{"id":"b0706","answer":"县域","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7066680.htm"}]},{"id":"q0378","unit":"u050","page":52,"subtitle":"","text":"今年是“十五五”开局之年，也是开展{{b0707}}帮扶第一年。要总结运用{{b0708}}协作等有益经验，进一步完善协作机制，优化协作方式，拓展协作领域，推动东西部产业互补、人员互动、技术互学、观念互通、作风互鉴，实现互利共赢、共同发展。各级党委和政府要认真落实常态化帮扶责任，坚决守牢不发生规模性返贫致贫底线，扎实推进乡村全面振兴，不断增强区域发展协调性，推动全体人民共同富裕迈出坚实步伐。","blanks":[{"id":"b0707","answer":"常态化","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072506.htm"},{"id":"b0708","answer":"闽宁","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072506.htm"}]},{"id":"q0379","unit":"u051","page":52,"subtitle":"","text":"党的十八大以来，党中央把基础教育作为基础性、{{b0709}}工作来抓，多措并举推动基础教育实现长足发展，为建设教育强国提供了有力支撑。","blanks":[{"id":"b0709","answer":"先导性","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7076265.htm"}]},{"id":"q0380","unit":"u051","page":52,"subtitle":"","text":"新征程上，要以新时代中国特色社会主义思想为指导，全面贯彻党的教育方针，落实{{b0710}}根本任务，坚持不懈用党的创新理论铸魂育人，培养德智体美劳全面发展的社会主义建设者和接班人。要遵循教育规律，落实{{b0711}}第一教育理念，提升教育教学质量，促进广大学生身心健康、成长成才。要适应人民群众新期盼，推进基础教育扩优提质，牢牢守住教育{{b0712}}底线。要弘扬教育家精神，加强师德师风建设，培养造就高素质专业化教师队伍。各级党委和政府要切实扛起政治责任，优化办学资源配置，深化教育综合改革，推动学校、家庭、社会{{b0713}}发力，不断开创基础教育高质量发展新局面。","blanks":[{"id":"b0710","answer":"立德树人","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7076265.htm"},{"id":"b0711","answer":"健康","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7076265.htm"},{"id":"b0712","answer":"公平","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7076265.htm"},{"id":"b0713","answer":"同向","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7076265.htm"}]},{"id":"q0381","unit":"u052","page":53,"subtitle":"","text":"树立和践行正确政绩观是一项长期任务，必须久久为功，不断巩固拓展学习教育成果，持续推动各级党组织和广大党员、干部立党为公、{{b0714}}、{{b0715}}、真抓实干，努力创造经得起实践、人民、历史检验的实绩。","blanks":[{"id":"b0714","answer":"为民造福","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078989.htm"},{"id":"b0715","answer":"科学决策","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078989.htm"}]},{"id":"q0382","unit":"u052","page":53,"subtitle":"","text":"要经常性开展政绩观教育，重点抓好对地方党政正职、新提拔干部、年轻干部、关键岗位干部的教育培训，强化示范引领和反面警示，引导党员、干部始终以正确政绩观担当作为、履职尽责。要坚持{{b0716}}查改问题，对需要长期整改的政绩观偏差突出问题盯紧不放、跟踪问效，深化新官不理旧账整改整治。结合巡视巡察、审计监督、统计监督等精准发现问题，增强针对性和穿透力，扎实推动整改。要用好考核指挥棒，完善{{b0717}}考核评价体系，树立重实干重实绩的选人用人导向，让敢于负责、勇于担当、善于作为、实绩突出的干部受到重用。要加强政绩观行为的管理监督，严格执行民主集中制，对领导干部定期谈话提醒，及时发现并纠正苗头性倾向性问题。","blanks":[{"id":"b0716","answer":"常态化","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078989.htm"},{"id":"b0717","answer":"差异化","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078989.htm"}]},{"id":"q0383","unit":"u053","page":53,"subtitle":"","text":"新征程上，要以新时代中国特色社会主义思想为指导，完整准确全面贯彻新发展理念，统筹高质量发展和高水平安全，坚持智能化、绿色化、{{b0718}}方向，持续做大做强先进制造业，提升产业链自主可控水平，加快构建以先进{{b0719}}为骨干的现代化产业体系，巩固壮大{{b0720}}经济根基，为推进中国式现代化提供有力支撑。","blanks":[{"id":"b0718","answer":"融合化","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081344.htm"},{"id":"b0719","answer":"制造业","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081344.htm"},{"id":"b0720","answer":"实体","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081344.htm"}]},{"id":"q0384","unit":"u054","page":54,"subtitle":"","text":"学习教育以县处级以上领导班子和领导干部特别是“一把手”为重点，于2026年春节假期后启动、7月底基本结束。要以立党为公、为民造福、科学决策、真抓实干为总要求，以一体推进{{b0721}}为抓手，教育引导各级党组织和党员、干部坚持实事求是、求真务实，为{{b0722}}出政绩、以{{b0723}}出政绩，有效防范和纠治政绩观偏差。","blanks":[{"id":"b0721","answer":"学查改","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0722","answer":"人民","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0723","answer":"实干","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"}]},{"id":"q0385","unit":"u054","page":54,"subtitle":"","text":"学习教育要坚持聚焦主题、简约务实，{{b0724}}批次、{{b0725}}阶段，认真落实学习研讨、查摆问题、整改整治、建章立制、开门教育等工作安排。县处级以上领导班子及其成员通过督促检查、调查研究、了解群众反映等途径，深入查找政绩观方面存在的问题，从{{b0726}}上找差距、查根源、强修养。要坚持与中央巡{{b0727}}整改、深入贯彻中央八项规定精神学习教育整改、“十五五”规划编制实施、生态环保督察整改等相结合，边查边改、立行立改，对突出问题开展集中整治，持续推动整改落实。要坚持{{b0728}}教育，查摆问题听取群众意见，整改整治接受群众监督，检验成效接受群众评判；坚持民生为大，为群众多办实事，让群众可感可及。","blanks":[{"id":"b0724","answer":"不分","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0725","answer":"不划","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0726","answer":"党性","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0727","answer":"视","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"},{"id":"b0728","answer":"开门","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"}]},{"id":"q0386","unit":"u054","page":54,"subtitle":"","text":"1.{{b0729}}路线教育实践活动（2013）","blanks":[{"id":"b0729","answer":"党的群众","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"}]},{"id":"q0387","unit":"u054","page":54,"subtitle":"4.“不忘初心、牢记使命”主题教育（2019年）","text":"5.{{b0730}}学习教育（2021年）","blanks":[{"id":"b0730","answer":"党史","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"}]},{"id":"q0388","unit":"u054","page":55,"subtitle":"7.党纪学习教育（2024年）","text":"8.深入贯彻{{b0731}}精神学习教育（2025年）","blanks":[{"id":"b0731","answer":"中央八项规定","source":"https://www.gov.cn/zhengce/202602/content_7058350.htm"}]},{"id":"q0389","unit":"u055","page":55,"subtitle":"","text":"对经过{{b0732}}年以上培养教育和考察、基本具备党员条件的入党积极分子，在听取党小组、培养联系人、党员和群众等意见的基础上，党支部委员会会议研究讨论并报上级党委同意拟列为发展对象的，在工作、学习单位或者居住地进行公示，公示期不少于五个工作日。拟列为发展对象的流动人员，应当在{{b0733}}和{{b0734}}公示。发展对象应当有{{b0735}}名正式党员作入党介绍人。","blanks":[{"id":"b0732","answer":"一","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0733","answer":"流出地","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0734","answer":"流入地同时","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0735","answer":"两","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"}]},{"id":"q0390","unit":"u055","page":55,"subtitle":"","text":"发展对象未来{{b0736}}个月内将离开工作、学习单位的，一般不办理接收预备党员的手续。经基层党委预审合格的发展对象，应当在一个月内提交党支部党员大会讨论。召开讨论接收预备党员的党支部党员大会，实际到会有表决权的党员人数必须超过应到会有表决权的党员人数的{{b0737}}。赞成人数超过应到会有表决权的党员人数的{{b0738}}，才能通过接收预备党员的决议。党支部党员大会讨论两个以上的发展对象入党时，必须{{b0739}}讨论和表决。","blanks":[{"id":"b0736","answer":"三","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0737","answer":"半数","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0738","answer":"半数","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0739","answer":"逐个","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"}]},{"id":"q0391","unit":"u055","page":55,"subtitle":"","text":"预备党员的预备期为{{b0740}}年。预备期从党支部党员大会通过其为预备党员之日算起。预备党员预备期满，党支部应当及时讨论其能否转为正式党员。认真履行党员义务、具备党员条件的，应当按期转为正式党员；需要继续考察和教育的，可以延长一次预备期，延长时间不能少于{{b0741}}年，最长不超过{{b0742}}年；不履行党员义务、不具备党员条件的，应当取消其预备党员资格。预备党员转为正式党员、延长预备期或者取消预备党员资格，应当经党支部党员大会讨论通过和{{b0743}}批准。","blanks":[{"id":"b0740","answer":"一","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0741","answer":"半","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0742","answer":"一","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"},{"id":"b0743","answer":"上级党组织","source":"https://www.gov.cn/zhengce/202605/content_7069304.htm"}]},{"id":"q0392","unit":"u056","page":56,"subtitle":"1.确立统筹城乡的政策制度","text":"（1）统筹城乡制度安排。用人单位（包括企业、事业单位、机关、社会组织）以及单位职工、退休人员、灵活就业人员和未就业城乡居民等按照{{b0744}}管理原则，参加长期护理保险。各地建立长期护理保险制度可先从覆盖单位职工、退休人员、灵活就业人员等人群起步，逐步将{{b0745}}城乡居民纳入保障范围。","blanks":[{"id":"b0744","answer":"属地","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0745","answer":"未就业","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0393","unit":"u056","page":56,"subtitle":"1.确立统筹城乡的政策制度","text":"（2）统一保险统筹层次。长期护理保险从{{b0746}}级统筹起步。有条件的省份可探索按照政策统一规范、基金调剂平衡、完善分级管理、强化预算考核、优化管理服务的要求推动{{b0747}}统筹。坚持制度的{{b0748}}和规范性，确保统筹地区间在参保缴费、待遇支付、失能等级评估、基金管理、经办管理、信息化建设等方面相对均衡。","blanks":[{"id":"b0746","answer":"市地","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0747","answer":"省级","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0748","answer":"统一性","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0394","unit":"u056","page":56,"subtitle":"2.建立稳定可持续的筹资机制","text":"（1）长期护理保险费率统一控制在{{b0749}}%左右。","blanks":[{"id":"b0749","answer":"0.3","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0395","unit":"u056","page":56,"subtitle":"2.建立稳定可持续的筹资机制","text":"（2）单位职工费率由用人单位和个人按{{b0750}}比例分担，用人单位缴费基数为职工工资总额，个人缴费基数为本人工资收入，用人单位和个人共同缴费。","blanks":[{"id":"b0750","answer":"同","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0396","unit":"u056","page":56,"subtitle":"2.建立稳定可持续的筹资机制","text":"（3）退休人员费率与单位职工个人费率相同，缴费基数与养老金水平挂钩，由个人缴费，原用人单位{{b0751}}缴费。","blanks":[{"id":"b0751","answer":"不","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0397","unit":"u056","page":56,"subtitle":"3.实施公平适度的待遇保障","text":"（1）合理确定保障对象。按规定参保缴费且失能状态长期持续（一般为{{b0752}}个月以上），经申请通过评估认定的失能人员，可按规定享受相关待遇。长期护理保险制度起步阶段保障{{b0753}}度失能人员。","blanks":[{"id":"b0752","answer":"6","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0753","answer":"重","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0398","unit":"u056","page":56,"subtitle":"3.实施公平适度的待遇保障","text":"（2）合理确定待遇保障标准。符合规定的长期护理服务费用，按未就业城乡居民参保政策参保的，基金支付比例为{{b0754}}%左右；按单位职工参保政策参保的，基金支付比例为{{b0755}}%左右，退休人员享受单位职工参保待遇；灵活就业人员依据选择的参保政策类型享受相应待遇。根据失能等级、服务提供方式等实行{{b0756}}待遇保障政策。","blanks":[{"id":"b0754","answer":"50","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0755","answer":"70","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0756","answer":"差别化","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0399","unit":"u056","page":56,"subtitle":"3.实施公平适度的待遇保障","text":"（3）规范待遇享受。基金主要用于支付符合规定的长期护理服务机构和人员提供长期护理基本服务所发生的费用，原则上不直接向失能人员发放{{b0757}}。探索建立缴费时长和待遇水平相挂钩的连续参保激励机制，对连续参保的按规定适当{{b0758}}支付比例。","blanks":[{"id":"b0757","answer":"现金","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"},{"id":"b0758","answer":"提高","source":"https://www.gov.cn/zhengce/202603/content_7063791.htm"}]},{"id":"q0400","unit":"u057","page":57,"subtitle":"1.总体要求","text":"以满足群众{{b0759}}看病就医需求为出发点，以实施医疗卫生{{b0760}}工程为支撑，推进医疗卫生人员、服务下沉和基层能力提升，推动医疗卫生服务资源高效配置，加快建设分级诊疗体系。","blanks":[{"id":"b0759","answer":"就近就便","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"},{"id":"b0760","answer":"强基","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"}]},{"id":"q0401","unit":"u057","page":57,"subtitle":"（1）以紧密型医联体为抓手完善分级诊疗协同机制","text":"{{b0761}}级医院要稳定设置、优化功能，加强常见病专业建设，拓展康复、护理、安宁疗护、医养结合等服务，强化在三级医院和基层医疗卫生机构之间的桥梁纽带作用。{{b0762}}级医院要聚焦急危重症和疑难复杂疾病，加强转诊会诊和住院服务，逐步酌减常见病复诊和诊断明确、病情稳定的慢性病等普通门诊。国家医学中心、国家区域医疗中心、省级区域医疗中心、省级及以上医院要发挥专科优势，以区域死亡率高、外转率高的疾病为重点，提升区域医疗卫生服务能力整体水平，进一步{{b0763}}跨省跨区域就医。到2030年，以紧密型医联体为抓手的分级诊疗协同机制基本建立，医疗卫生服务{{b0764}}水平和便利性、可及性进一步提高，就医秩序更加合理规范。","blanks":[{"id":"b0761","answer":"二","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"},{"id":"b0762","answer":"三","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"},{"id":"b0763","answer":"减少","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"},{"id":"b0764","answer":"同质化","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"}]},{"id":"q0402","unit":"u057","page":57,"subtitle":"（1）以紧密型医联体为抓手完善分级诊疗协同机制","text":"（2）以{{b0765}}、{{b0766}}为重点引导群众基层首诊","blanks":[{"id":"b0765","answer":"常见病","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"},{"id":"b0766","answer":"慢性病","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"}]},{"id":"q0403","unit":"u057","page":57,"subtitle":"（1）以紧密型医联体为抓手完善分级诊疗协同机制","text":"（3）以提升就医{{b0767}}为导向加强转诊服务管理","blanks":[{"id":"b0767","answer":"连续性","source":"https://www.gov.cn/zhengce/content/202604/content_7065030.htm"}]},{"id":"q0404","unit":"u058","page":57,"subtitle":"","text":"1.加强随迁子女教育保障。学龄人口流入多的城市政府做好存量学位资源挖潜和整合利用，按需新增学位，巩固提升义务教育阶段随迁子女就读{{b0768}}学位比例。九年一贯制学校校内直升政策对随迁子女、当地户籍学生{{b0769}}对待。落实符合条件的随迁子女在常住地参加升学考试政策。","blanks":[{"id":"b0768","answer":"公办","source":"https://www.gov.cn/zhengce/content/202605/content_7069960.htm"},{"id":"b0769","answer":"同等","source":"https://www.gov.cn/zhengce/content/202605/content_7069960.htm"}]},{"id":"q0405","unit":"u058","page":57,"subtitle":"","text":"2.扩大公租房保障范围。推动更多城市将稳定就业居住的{{b0770}}常住人口家庭纳入公租房保障范围，推行按就业居住年限、住房困难程度确定保障对象、保障方式、保障标准、准入条件和退出机制。","blanks":[{"id":"b0770","answer":"未落户","source":"https://www.gov.cn/zhengce/content/202605/content_7069960.htm"}]},{"id":"q0406","unit":"u058","page":57,"subtitle":"","text":"3.健全就业地参加职工社会保险制度。{{b0771}}在就业地参加职工社会保险的户籍限制，大力推进全民参保计划。","blanks":[{"id":"b0771","answer":"全面取消","source":"https://www.gov.cn/zhengce/content/202605/content_7069960.htm"}]},{"id":"q0407","unit":"u058","page":57,"subtitle":"","text":"4.加强常住地基本医疗保障。加力落实持{{b0772}}参加城乡居民基本医疗保险政策。加强异地就医直接结算管理服务，提升异地就医备案管理和结算报销可及性、便利性。","blanks":[{"id":"b0772","answer":"居住证","source":"https://www.gov.cn/zhengce/content/202605/content_7069960.htm"}]},{"id":"q0408","unit":"u059","page":58,"subtitle":"1.职工有下列情形之一的，可以提取职工住房公积金账户内的存储余额：","text":"（1）支付{{b0773}}的；","blanks":[{"id":"b0773","answer":"房租","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"}]},{"id":"q0409","unit":"u059","page":58,"subtitle":"（4）装修自住住房的；","text":"（5）支付自住住房{{b0774}}费的；","blanks":[{"id":"b0774","answer":"物业","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"}]},{"id":"q0410","unit":"u059","page":58,"subtitle":"（9）国务院批准的其他住房消费情形。","text":"依照前款第六、七、八项规定提取职工住房公积金的，可以同时注销职工住房公积金账户。职工死亡或者被宣告死亡的，职工的继承人、受遗赠人{{b0775}}提取职工住房公积金账户内的存储余额；无继承人也无受遗赠人的，职工住房公积金账户内的存储余额纳入住房公积金的增值收益。","blanks":[{"id":"b0775","answer":"可以","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"}]},{"id":"q0411","unit":"u059","page":58,"subtitle":"（9）国务院批准的其他住房消费情形。","text":"2.住房公积金管理中心在保证住房公积金提取和贷款的前提下，经住房公积金管理委员会批准，可以将住房公积金用于购买{{b0776}}和政策性{{b0777}}。","blanks":[{"id":"b0776","answer":"国债","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"},{"id":"b0777","answer":"金融债","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"}]},{"id":"q0412","unit":"u059","page":58,"subtitle":"（9）国务院批准的其他住房消费情形。","text":"3.以欺诈、伪造证明材料或者其他手段违法提取住房公积金的，由住房公积金管理中心责令限期退回违法提取的住房公积金，{{b0778}}年内不得提取住房公积金或者使用住房公积金贷款。以欺诈、伪造证明材料或者其他手段违法获得住房公积金贷款的，由住房公积金管理中心责令限期返还贷款资金，{{b0779}}年内不得提取住房公积金或者使用住房公积金贷款。","blanks":[{"id":"b0778","answer":"3","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"},{"id":"b0779","answer":"5","source":"https://www.gov.cn/zhengce/content/202608/content_7078477.htm"}]},{"id":"q0413","unit":"u060","page":58,"subtitle":"","text":"2026年8月15日，《中华人民共和国生态环境法典》（以下简称《法典》）正式施行。《法典》包括总则、污染防治、生态保护、绿色低碳发展以及法律责任和附则五编内容，其中“{{b0780}}”单独成编，为世界环境法典体例之首创。","blanks":[{"id":"b0780","answer":"绿色低碳发展","source":"https://cpc.people.com.cn/n1/2026/0316/c64387-40682609.html"}]},{"id":"q0414","unit":"u060","page":58,"subtitle":"1.重要意义","text":"（1）《法典》是中国继民法典之后第{{b0781}}部以“法典”命名的法律，也是全球首部专门以“生态环境法典”命名的法律。","blanks":[{"id":"b0781","answer":"二","source":"http://www.npc.gov.cn/npc/c2/c30834/202603/t20260312_453172.html"}]},{"id":"q0415","unit":"u060","page":59,"subtitle":"1.重要意义","text":"（2）《法典》以“{{b0782}}法典化”的编纂模式，形成法典统领、单行法配套衔接的分层立法格局，开创性地探索出一条兼具体系性与开放性、稳定性与适应性的编纂新路。","blanks":[{"id":"b0782","answer":"适度","source":"https://www.news.cn/politics/20260305/80eb45310616404c84a08cd0e1e44e80/c.html"}]},{"id":"q0416","unit":"u060","page":59,"subtitle":"1.重要意义","text":"（3）《法典》将中国生态文明建设的成功实践、制度创新和治理经验上升为法律制度，是习近平{{b0783}}思想和习近平{{b0784}}思想贯通融合、交相辉映的重要结晶。","blanks":[{"id":"b0783","answer":"生态文明","source":"https://www.news.cn/20260815/ebe0dee125a644009491f8bd8fce4e36/c.html"},{"id":"b0784","answer":"法治","source":"https://www.news.cn/20260815/ebe0dee125a644009491f8bd8fce4e36/c.html"}]},{"id":"q0417","unit":"u060","page":59,"subtitle":"2.重要表述","text":"生态环境保护坚持{{b0785}}为主、系统治理、生态优先、绿色发展、公众参与、损害担责的原则。国家加强生态的保护与修复，坚持山水林田湖草沙一体化保护与修复，实行{{b0786}}为主、自然恢复与人工修复相结合的系统治理。","blanks":[{"id":"b0785","answer":"预防","source":"https://epaper.gmw.cn/gmrb/html/content/202603/16/content_8558.html"},{"id":"b0786","answer":"自然恢复","source":"https://epaper.gmw.cn/gmrb/html/content/202603/16/content_8558.html"}]},{"id":"q0418","unit":"u060","page":59,"subtitle":"2.重要表述","text":"国家建立健全生态保护补偿制度，通过财政{{b0787}}补偿、地区间{{b0788}}补偿、市场机制补偿等机制，对按照规定或者约定开展生态环境保护的地区、单位和个人予以补偿，按照生态系统的整体性、系统性及其内在规律，建立健全{{b0789}}主导、企业和社会参与、市场化运作、可持续的生态保护补偿机制，促进对生态环境的整体保护。","blanks":[{"id":"b0787","answer":"纵向","source":"https://epaper.gmw.cn/gmrb/html/content/202603/16/content_8558.html"},{"id":"b0788","answer":"横向","source":"https://epaper.gmw.cn/gmrb/html/content/202603/16/content_8558.html"},{"id":"b0789","answer":"政府","source":"https://epaper.gmw.cn/gmrb/html/content/202603/16/content_8558.html"}]},{"id":"q0419","unit":"u061","page":59,"subtitle":"一、总体要求","text":"坚持把解决好“三农”问题作为全党工作重中之重，坚持农业农村优先发展，坚持城乡融合发展，锚定农业农村现代化，以推进乡村全面振兴为{{b0790}}，以学习运用“{{b0791}}”经验为引领，以{{b0792}}为根本动力，提高强农惠农富农政策效能，守牢国家{{b0793}}安全底线，持续巩固拓展脱贫攻坚成果，提升乡村{{b0794}}发展水平、乡村建设水平、乡村治理水平，努力把农业建成现代化大产业、使农村基本具备现代生活条件、让农民生活更加富裕美好，为推进中国式现代化提供基础支撑。","blanks":[{"id":"b0790","answer":"总抓手","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0791","answer":"千万工程","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0792","answer":"改革创新","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0793","answer":"粮食","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0794","answer":"产业","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0420","unit":"u061","page":59,"subtitle":"1.提升农业综合生产能力和质量效益","text":"（1）稳定发展粮油生产。粮食产量稳定在{{b0795}}万亿斤左右。坚持产量产能、生产生态、增产增收一起抓，加力实施新一轮{{b0796}}亿斤粮食产能提升行动，促进良田良种良机良法集成增效，推进粮油作物大面积提单产。","blanks":[{"id":"b0795","answer":"1.4","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0796","answer":"千","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0421","unit":"u061","page":60,"subtitle":"1.提升农业综合生产能力和质量效益","text":"（2）促进“菜篮子”产业提质增效。坚持农林牧渔并举，推动构建{{b0797}}食物供给体系。","blanks":[{"id":"b0797","answer":"多元化","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0422","unit":"u061","page":60,"subtitle":"1.提升农业综合生产能力和质量效益","text":"（3）加强耕地保护和质量提升。分区分类高质量推进高标准农田建设，完善立项、建设、验收和管护机制，强化资金监管，加大土壤改良和地力提升力度。在确保{{b0798}}内耕地保护任务不降低前提下，稳妥有序退出河道湖区影响行洪安全等的不稳定耕地。","blanks":[{"id":"b0798","answer":"省域","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0423","unit":"u061","page":60,"subtitle":"1.提升农业综合生产能力和质量效益","text":"（4）提升农业科技创新效能。深化涉农高校教育教学改革，以{{b0799}}为导向加快新农科建设，推动涉农专业人才定向培养。","blanks":[{"id":"b0799","answer":"需求","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0424","unit":"u061","page":60,"subtitle":"2.实施常态化精准帮扶","text":"（1）健全常态化帮扶政策体系。落实常态化帮扶责任，稳步提升“三保障”和饮水安全保障水平，守牢不发生规模性返贫致贫底线。强化{{b0800}}帮扶，增强内生动力，发挥{{b0801}}兜底保障作用，推动帮扶政策协同集成。保持中央财政常态化帮扶资金规模及{{b0802}}两级投入资金规模稳定，{{b0803}}可根据帮扶任务合理安排资金。","blanks":[{"id":"b0800","answer":"开发式","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0801","answer":"社会救助","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0802","answer":"省市","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0803","answer":"县级","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0425","unit":"u061","page":60,"subtitle":"2.实施常态化精准帮扶","text":"（2）提高监测帮扶精准性时效性。扎实做好{{b0804}}两级常态化监测，健全精准识别和快速响应机制，确保早发现、早干预、早帮扶。","blanks":[{"id":"b0804","answer":"乡村","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0426","unit":"u061","page":60,"subtitle":"2.实施常态化精准帮扶","text":"（3）提升产业和就业帮扶实效。优化产业帮扶方式，{{b0805}}推进现有产业巩固、升级、盘活、调整，发展具有市场竞争力的帮扶产业。中央财政常态化帮扶资金用于产业发展的比例，在{{b0806}}级保持基本稳定，{{b0807}}级可实行差别化要求。","blanks":[{"id":"b0805","answer":"分类","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0806","answer":"省","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0807","answer":"县","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0427","unit":"u061","page":60,"subtitle":"3.积极促进农民稳定增收","text":"（1）保护和调动农民务农种粮积极性。加强农产品市场监测预警和信息发布，统筹做好市场化收购和政策性收储，促进粮食等重要农产品价格保持在合理水平。引导农业企业在粮食{{b0808}}统筹布局加工产能。落实好粮食产销区省际{{b0809}}利益补偿政策，支持粮食{{b0810}}补充财力、发展粮食产业。","blanks":[{"id":"b0808","answer":"主产区","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0809","answer":"横向","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0810","answer":"主产区","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0428","unit":"u061","page":60,"subtitle":"3.积极促进农民稳定增收","text":"（2）培育壮大县域富民产业。统筹发展科技农业、绿色农业、质量农业、品牌农业，开发农业多种功能，推动农村一二三产业深度融合。发展各具特色的{{b0811}}经济，培育中小企业特色产业集群，推动兴业、强县、富民一体发展。","blanks":[{"id":"b0811","answer":"县域","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0429","unit":"u061","page":60,"subtitle":"3.积极促进农民稳定增收","text":"（3）促进农民工稳岗就业。扩大以{{b0812}}代{{b0813}}项目覆盖范围、建设领域和劳务报酬发放规模，鼓励采用灵活发包方式由农村基层自主实施项目。","blanks":[{"id":"b0812","answer":"工","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0813","answer":"赈","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0430","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（1）因地制宜完善乡村建设实施机制，分类有序、{{b0814}}化推进乡村振兴。","blanks":[{"id":"b0814","answer":"片区","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0431","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（2）支持紧密型{{b0815}}医共体提升综合服务能力，合理扩大基层医疗卫生机构药品采购、配备、使用范围。","blanks":[{"id":"b0815","answer":"县域","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0432","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（3）以{{b0816}}养老为基础，鼓励有条件的地方发展助餐服务、日间照料、康复护理等养老服务。","blanks":[{"id":"b0816","answer":"居家","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0433","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（4）有序推进农村集体经营性{{b0817}}入市，支持入市土地优先用于发展集体经济和乡村产业，严禁用于建设{{b0818}}。","blanks":[{"id":"b0817","answer":"建设用地","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0818","answer":"商品住房","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0434","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（5）依法维护进城落户农民土地{{b0819}}权、宅基地{{b0820}}权、集体收益{{b0821}}权，探索建立自愿有偿退出的办法。","blanks":[{"id":"b0819","answer":"承包","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0820","answer":"使用","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0821","answer":"分配","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0435","unit":"u061","page":61,"subtitle":"4.其他重要表述","text":"（6）充实和稳定农村基层一线力量，公务员招录计划向{{b0822}}基层机关倾斜，原则上不得从{{b0823}}借调工作人员。","blanks":[{"id":"b0822","answer":"县乡","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"},{"id":"b0823","answer":"县乡","source":"https://www.gov.cn/zhengce/202602/content_7056930.htm"}]},{"id":"q0436","unit":"u062","page":61,"subtitle":"1.总体要求","text":"牢牢把住处理好{{b0824}}这条主线，锚定加快建设农业强国目标，坚持把依法维护农民权益作为出发点和落脚点，把强化{{b0825}}所有制根基、保障和实现农民集体成员权利同激活资源要素统一起来，充分运用农村承包地确权登记颁证成果，通过细致工作有序推进，确保第{{b0826}}轮土地承包到期后再延长{{b0827}}年政策扎实落实到位，不断完善农村承包地所有权、{{b0828}}权、{{b0829}}权分置政策体系，进一步巩固和完善农村基本经营制度。","blanks":[{"id":"b0824","answer":"农民和土地关系","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0825","answer":"集体","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0826","answer":"二","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0827","answer":"30","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0828","answer":"承包","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0829","answer":"经营","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]},{"id":"q0437","unit":"u062","page":61,"subtitle":"2.工作中要做到","text":"（1）坚持集体所有制不动摇，{{b0830}}打破原集体土地所有权的界限在全村范围内搞平均承包，充分维护农民集体对承包地发包、调整、监督、收回等各项权能，探索和丰富农村土地集体所有制的有效实现形式。","blanks":[{"id":"b0830","answer":"严禁","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]},{"id":"q0438","unit":"u062","page":61,"subtitle":"2.工作中要做到","text":"（2）坚持农户{{b0831}}承包经营，农村集体土地由本集体经济组织内农民家庭承包，农户承包地要保持稳定，发包方及其他组织、个人不得违法调整和收回农户承包地。","blanks":[{"id":"b0831","answer":"家庭","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]},{"id":"q0439","unit":"u062","page":61,"subtitle":"2.工作中要做到","text":"（3）坚持{{b0832}}主体地位，充分发挥农民主动性和创造性，鼓励农民集体在法律和政策范围内因地制宜探索延包具体路径和办法。","blanks":[{"id":"b0832","answer":"农民","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]},{"id":"q0440","unit":"u062","page":62,"subtitle":"（1）坚持延包原则。以户为单位开展延包，确保绝大多数农户原有承包地继续保持稳定，不能推倒重来、打乱重分，不能借机违法调整或收回农户承包地。","text":"（2）依法依规从严掌握“小调整”。坚持“大稳定、小调整”，“{{b0833}}”的前提是“{{b0834}}”。“小调整”是指在农村集体经济组织个别农户之间进行承包地小范围适当调整，仅限于少数存在承包地因{{b0835}}毁损等特殊情形且群众普遍要求调地的村组。","blanks":[{"id":"b0833","answer":"小调整","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0834","answer":"大稳定","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"},{"id":"b0835","answer":"自然灾害","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]},{"id":"q0441","unit":"u062","page":62,"subtitle":"（1）坚持延包原则。以户为单位开展延包，确保绝大多数农户原有承包地继续保持稳定，不能推倒重来、打乱重分，不能借机违法调整或收回农户承包地。","text":"（3）规范延包程序。延包工作小组由本集体经济组织成员大会或成员代表大会依法{{b0836}}产生。县级以上地方政府农业农村主管部门、乡（镇）政府要加强对延包方案制定和实施的指导监督，发现问题的，应当及时予以纠正。","blanks":[{"id":"b0836","answer":"选举","source":"https://www.gov.cn/zhengce/202603/content_7063139.htm"}]},{"id":"q0442","unit":"u063","page":0,"subtitle":"","text":"1.秦朝：在中央实行三公九卿制。“三公”是指在中央设{{b0837}}（“百官之长”，帮助皇帝处理全国的政事）、太尉（主管军事）、{{b0838}}（执掌群臣奏章，下达皇帝诏令，兼理国家监察事务）三个最高官职。地方上，秦朝实行 {{b0839}}。","blanks":[{"id":"b0837","answer":"丞相","source":""},{"id":"b0838","answer":"御史大夫","source":""},{"id":"b0839","answer":"郡县制","source":""}]},{"id":"q0443","unit":"u063","page":0,"subtitle":"","text":"2.汉朝：西汉初期，地方上实行郡国并行制。汉武帝时期，正式颁布“{{b0840}}”，削弱诸侯势力，进一步加强中央集权。","blanks":[{"id":"b0840","answer":"推恩令","source":""}]},{"id":"q0444","unit":"u063","page":0,"subtitle":"","text":"3.隋唐：在中央实行三省六部制。唐朝“三省”是指{{b0841}}（负责草拟和颁布皇帝诏令）、{{b0842}}（负责审核政令）、尚书省（负责执行国家的政令）。{{b0843}}下设吏、户、礼、兵、刑、工六部。","blanks":[{"id":"b0841","answer":"中书省","source":""},{"id":"b0842","answer":"门下省","source":""},{"id":"b0843","answer":"尚书省","source":""}]},{"id":"q0445","unit":"u063","page":0,"subtitle":"","text":"4.宋朝：在中央实行二府三司制，即中书门下（最高{{b0844}}机构，设同平章事为宰相，设参知政事为副相）、枢密院（最高{{b0845}}机构）、三司（最高 {{b0846}}机构）。","blanks":[{"id":"b0844","answer":"行政","source":""},{"id":"b0845","answer":"军事","source":""},{"id":"b0846","answer":"财政","source":""}]},{"id":"q0446","unit":"u063","page":0,"subtitle":"","text":"5.元朝：中央设立中书省作为最高行政机构。地方设行中书省，简称“行省”。元朝的行省制是中国{{b0847}}的开端。","blanks":[{"id":"b0847","answer":"省制","source":""}]},{"id":"q0447","unit":"u063","page":0,"subtitle":"","text":"6.明朝：明太祖废除丞相制度。明成祖时，{{b0848}}制度正式确立。地方上，废行中书省，各省设立三司，即承宣布政使司、提刑按察使司、都指挥使司，分掌行政、司法和军政，都直属中央。","blanks":[{"id":"b0848","answer":"内阁","source":""}]},{"id":"q0448","unit":"u063","page":0,"subtitle":"","text":"7.清朝：雍正帝时设立{{b0849}}，标志着君主专制制度发展到顶峰。","blanks":[{"id":"b0849","answer":"军机处","source":""}]},{"id":"q0449","unit":"u064","page":0,"subtitle":"","text":"1.历代重要选官制度朝代              选官制度先秦   世卿世禄制战国    军功爵制（战国时期秦国，在{{b0850}}变法时确立）两汉     {{b0851}}制（自下而上）和{{b0852}}制（自上而下）魏晋南北朝  {{b0853}}制（后期形成“上品无寒门，下品无势族”的局面）科举制隋朝：{{b0854}}始建进士科，科举制度正式形成唐朝：武则天始创{{b0855}}和殿试隋唐至清末宋朝：开始实行誊录，并发展{{b0856}}使其成为定制明清：实行八股取士清朝：清末{{b0857}}年间（1905 年）正式废除","blanks":[{"id":"b0850","answer":"商鞅","source":""},{"id":"b0851","answer":"察举","source":""},{"id":"b0852","answer":"征辟","source":""},{"id":"b0853","answer":"九品中正","source":""},{"id":"b0854","answer":"隋炀帝","source":""},{"id":"b0855","answer":"武举","source":""},{"id":"b0856","answer":"糊名","source":""},{"id":"b0857","answer":"光绪","source":""}]},{"id":"q0450","unit":"u064","page":0,"subtitle":"","text":"2.科举考试程序（以清朝定制为例）明清时期科举的基本制度和考试程序大体一致，其中以进士科考试最为重要。考试层级              考试结果应试者不论年龄统称“童生”。县试、府试合格后方可参加院试。童试院试合格者称“{{b0858}}”，俗称“秀才”。（基层选拔）秀才获得功名，享免除徭役、见县官不跪等特权。乡试          合格者称“{{b0859}}”，榜首称“{{b0860}}”。（省级考试，又称“{{b0861}}”） 举人具备“做官资格”。会试（全国性考试，又称“{{b0862}}”）合格者称“{{b0863}}”，榜首称“会元”。按成绩分为三甲：","blanks":[{"id":"b0858","answer":"生员","source":""},{"id":"b0859","answer":"举人","source":""},{"id":"b0860","answer":"解元","source":""},{"id":"b0861","answer":"秋闱","source":""},{"id":"b0862","answer":"春闱","source":""},{"id":"b0863","answer":"贡士","source":""}]},{"id":"q0451","unit":"u064","page":0,"subtitle":"","text":"1.一甲：状元、榜眼、探花，赐“{{b0864}}”。殿试","blanks":[{"id":"b0864","answer":"进士及第","source":""}]},{"id":"q0452","unit":"u065","page":0,"subtitle":"","text":"1.初税亩：{{b0865}}时期，{{b0866}}率先实行，按照拥有土地数量的多少征收赋税。这是中国征收土地税的开端。","blanks":[{"id":"b0865","answer":"春秋","source":""},{"id":"b0866","answer":"鲁国","source":""}]},{"id":"q0453","unit":"u065","page":0,"subtitle":"","text":"2.租庸调制：始于{{b0867}}，唐朝前期趋于完善。{{b0868}}是田租，按人丁缴纳谷物；{{b0869}}是按人丁征收绢或布；{{b0870}}是按人丁服徭役，也可纳绢布代役。","blanks":[{"id":"b0867","answer":"北魏","source":""},{"id":"b0868","answer":"租","source":""},{"id":"b0869","answer":"调","source":""},{"id":"b0870","answer":"庸","source":""}]},{"id":"q0454","unit":"u065","page":0,"subtitle":"","text":"3.两税法：{{b0871}}后期，改革赋税制度，实施两税法。两税法将各种名目的赋税统一并到户税和地税中；每户按资产交纳户税，按田亩交纳地税；分为 {{b0872}}两季征收。两税法改变了以往“以人丁为主”的征税标准，转向“以财产、土地为核心”。","blanks":[{"id":"b0871","answer":"唐朝","source":""},{"id":"b0872","answer":"夏秋","source":""}]},{"id":"q0455","unit":"u065","page":0,"subtitle":"","text":"4.一条鞭法：{{b0873}}时期，由张居正主持改革。把各州县的田赋、徭役以及其他杂征总为一条，合并征收银两，按亩折算缴纳，推动实物税向{{b0874}}税转变，适应了商品经济的发展趋势。","blanks":[{"id":"b0873","answer":"明朝","source":""},{"id":"b0874","answer":"货币","source":""}]},{"id":"q0456","unit":"u065","page":0,"subtitle":"","text":"5.摊丁入亩：清朝时期，{{b0875}}初年开始实行摊丁入亩，即把丁银全部摊入地亩中征收。摊丁入亩的实行标志着延续了数千年的{{b0876}}的废除。","blanks":[{"id":"b0875","answer":"雍正","source":""},{"id":"b0876","answer":"人头税","source":""}]},{"id":"q0457","unit":"u066","page":0,"subtitle":"","text":"（2）主要内容：“叁其国而伍其鄙”“{{b0877}}”等。","blanks":[{"id":"b0877","answer":"尊王攘夷","source":""}]},{"id":"q0458","unit":"u066","page":0,"subtitle":"","text":"（2）主要内容：实施“平籴法”；编撰《{{b0878}}》（中国历史上第一部比较系统完整的成文法典）。","blanks":[{"id":"b0878","answer":"法经","source":""}]},{"id":"q0459","unit":"u066","page":0,"subtitle":"","text":"（2）主要内容：废井田，开阡陌，确立土地{{b0879}}；重农抑商，奖励耕织；实施分户令、推行连坐制；奖励军功，{{b0880}}；推行县制。","blanks":[{"id":"b0879","answer":"私有","source":""},{"id":"b0880","answer":"按军功授爵","source":""}]},{"id":"q0460","unit":"u066","page":0,"subtitle":"","text":"（2）主要内容：颁布{{b0881}}；迁都{{b0882}}；推行汉化政策，说汉话、改汉姓、穿汉服、通汉婚等。","blanks":[{"id":"b0881","answer":"均田令","source":""},{"id":"b0882","answer":"洛阳","source":""}]},{"id":"q0461","unit":"u066","page":0,"subtitle":"","text":"（2）主要内容：“富国”方面的{{b0883}}、募役法（免役法）、农田水利法、方田均税法等；“强兵”方面的{{b0884}}、保马法、将兵法等。","blanks":[{"id":"b0883","answer":"青苗法","source":""},{"id":"b0884","answer":"保甲法","source":""}]},{"id":"q0462","unit":"u066","page":0,"subtitle":"","text":"（2）主要内容：经济上推行“{{b0885}}”，吏治上推行考成法。","blanks":[{"id":"b0885","answer":"一条鞭法","source":""}]},{"id":"q0463","unit":"u067","page":0,"subtitle":"","text":"1.外来作物与技术 {{b0886}}：西域传入芝麻、茄子、黄瓜、香菜、大蒜、核桃、葡萄、石榴等。唐朝：胡椒、熬糖法等。宋朝：北宋时期，越南传入的{{b0887}}从福建推广到江浙和淮河流域，水稻在宋朝跃居粮食产量首位。{{b0888}}：玉米、甘薯、马铃薯、花生、番茄、辣椒、烟草传入我国，棉布成为人民主要衣料。","blanks":[{"id":"b0886","answer":"汉朝","source":""},{"id":"b0887","answer":"占城稻","source":""},{"id":"b0888","answer":"明朝","source":""}]},{"id":"q0464","unit":"u067","page":0,"subtitle":"","text":"2.重要水利工程芍陂：春秋时期，楚相孙叔敖修建，又名安丰塘，是中国最早的蓄水灌溉工程。都江堰：{{b0889}}时期，秦国李冰主持修建。都江堰","blanks":[{"id":"b0889","answer":"战国","source":""}]},{"id":"q0465","unit":"u067","page":0,"subtitle":"","text":"1.三大主体工程鱼嘴分水堤：形如鱼头的堤坝将岷江一分为二，形成内江和外江。它利用地形和水势，实现了“四六分水”的动态平衡：枯水期，约六成江水流入{{b0890}}，保证灌溉；洪水期，约六成江水排入{{b0891}}，实现泄洪。飞沙堰溢洪道：作为内江的“安全阀”，当水量过大时，多余的水会漫过这道低矮的堰坝，排入外江。更重要的是，它利用水流在弯道产生的离心力，形成漩涡，能将内江80%以上的泥沙和卵石“甩”出，有效防止了渠道淤积。宝瓶口引水口：人工在玉垒山凿开的一个形似瓶口的狭窄通道，是内江水进入成都平原的咽喉。它像一道天然闸门，精确控制进入灌区的水量，确保平原地区用水平稳。","blanks":[{"id":"b0890","answer":"内江","source":""},{"id":"b0891","answer":"外江","source":""}]},{"id":"q0466","unit":"u067","page":0,"subtitle":"","text":"2.历史地位都江堰是世界现存年代最久、唯一留存、{{b0892}}的{{b0893}}引水水利工程。2000 年列入世界文化遗产，2018 年列入世界灌溉工程遗产名录。灵渠：秦朝时期修建，沟通长江、{{b0894}}两大水系，促使秦始皇统一岭南。京杭大运河：{{b0895}}时期，吴王夫差开凿了连接长江与淮河的邗沟，这是有确切纪年的中国大运河最早的河段。隋朝时期，为加强都城洛阳与南方的联系，{{b0896}}下令大规模开凿运河。{{b0897}}时期，为缩短航程，对运河进行了“裁弯取直”，先后开凿了济州河、会通河、通惠河等新河道，使运河不再绕道洛阳。","blanks":[{"id":"b0892","answer":"仍在灌溉","source":""},{"id":"b0893","answer":"无坝","source":""},{"id":"b0894","answer":"珠江","source":""},{"id":"b0895","answer":"春秋","source":""},{"id":"b0896","answer":"隋炀帝","source":""},{"id":"b0897","answer":"元朝","source":""}]},{"id":"q0467","unit":"u067","page":0,"subtitle":"","text":"3.农业和手工业著作《氾胜之书》：{{b0898}}晚期重要农学著作，一般认为是我国最早的一部农书。《{{b0899}}》：北魏贾思勰著，是现存最早最完整的农书，被誉为“中国古代农业百科全书”。《王祯农书》：元朝王祯著，在介绍农业生产工具方面极具特色。《农政全书》：明末{{b0900}}著，提出了治国治民的“农政”思想。《{{b0901}}》：北宋沈括著，被称为“中国科学史上里程碑”。《{{b0902}}》：明末清初宋应星所著，被誉为“17 世纪中国工艺百科全书”。","blanks":[{"id":"b0898","answer":"西汉","source":""},{"id":"b0899","answer":"齐民要术","source":""},{"id":"b0900","answer":"徐光启","source":""},{"id":"b0901","answer":"梦溪笔谈","source":""},{"id":"b0902","answer":"天工开物","source":""}]},{"id":"q0468","unit":"u068","page":0,"subtitle":"","text":"1.医药学家扁鹊：战国时期，发明了{{b0903}}四诊法，著有《难经》，被称为“{{b0904}}”“医祖”。华佗：{{b0905}}末年，发明麻沸散，创编了五禽戏（模仿{{b0906}}），被誉为“外科鼻祖”“外科圣手”。张仲景：东汉末年，著有《{{b0907}}》，确立了中医“辨证论治”的基本原则，被称为“{{b0908}}”。{{b0909}}：唐朝时期，著有《千金方》，首次主张妇、儿疾病单独设科，被称为“药王”。宋慈：南宋时期，著有《洗冤集录》，开创了“法医鉴定学”，被称为“世界法医学鼻祖”。","blanks":[{"id":"b0903","answer":"望闻问切","source":""},{"id":"b0904","answer":"神医","source":""},{"id":"b0905","answer":"东汉","source":""},{"id":"b0906","answer":"虎鹿熊猿鸟","source":""},{"id":"b0907","answer":"伤寒杂病论","source":""},{"id":"b0908","answer":"医圣","source":""},{"id":"b0909","answer":"孙思邈","source":""}]},{"id":"q0469","unit":"u068","page":0,"subtitle":"","text":"2.医学名著传统医学四大经典：《{{b0910}}》《难经》《神农本草经》《伤寒杂病论》。《黄帝内经》：战国问世，是中国最早的医学典籍，由《{{b0911}}》和《灵枢》两部分组成，提出“{{b0912}}”的著名观点，奠定了中医的理论基础。《神农本草经》：东汉时期编修，是中国第一部完整的{{b0913}}著作。《{{b0914}}》：我国第一部临床治疗学方面的巨著，被誉为“万世宝典”。《{{b0915}}》：唐高宗时期编修，是世界上最早的由国家颁行的药典。《本草纲目》：明朝李时珍所著，全面总结了16 世纪以前的中国医药学，被誉为“{{b0916}}”。","blanks":[{"id":"b0910","answer":"黄帝内经","source":""},{"id":"b0911","answer":"素问","source":""},{"id":"b0912","answer":"治未病","source":""},{"id":"b0913","answer":"药物学","source":""},{"id":"b0914","answer":"伤寒杂病论","source":""},{"id":"b0915","answer":"唐本草","source":""},{"id":"b0916","answer":"东方医药巨典","source":""}]},{"id":"q0470","unit":"u069","page":0,"subtitle":"","text":"流派  代表人物  相关作品          主张/地位礼和{{b0917}}；孔子   《论语》创立私学，主张有教无类和因材施教儒家孟子   《孟子》       仁政、{{b0918}}、性善论荀子   《荀子》      礼法并用、{{b0919}}、性恶论老子  《道德经》   “{{b0920}}”是万物本源；无为而治道家庄子  《南华经》       逍遥、齐物论墨家   墨子   《墨子》     兼爱、非攻、尚贤、{{b0921}}等法家   韩非  《韩非子》   以法治国、建立中央集权专制统治兵家   孙武  《孙子兵法》   不战而屈人之兵，善之善者也名家  公孙龙 《公孙龙子》        白马非马","blanks":[{"id":"b0917","answer":"仁","source":""},{"id":"b0918","answer":"民贵君轻","source":""},{"id":"b0919","answer":"君舟民水","source":""},{"id":"b0920","answer":"道","source":""},{"id":"b0921","answer":"节用","source":""}]},{"id":"q0471","unit":"u070","page":0,"subtitle":"","text":"体裁    著作    作者         地位《{{b0922}}》   孔子      第一部编年体史书编年体   《左传》   左丘明   第一部叙事详细的编年体史书《{{b0923}}》  司马光      第一部编年体通史《史记》   司马迁      第一部纪传体{{b0924}} 纪传体《汉书》    班固       第一部纪传体{{b0925}} 国别体   《{{b0926}}》  左丘明      第一部国别体史书","blanks":[{"id":"b0922","answer":"春秋","source":""},{"id":"b0923","answer":"资治通鉴","source":""},{"id":"b0924","answer":"通史","source":""},{"id":"b0925","answer":"断代史","source":""},{"id":"b0926","answer":"国语","source":""}]},{"id":"q0472","unit":"u070","page":0,"subtitle":"","text":"1.《史记》 {{b0927}}司马迁编撰，是我国第一部纪传体通史、“二十四史”之首，记载了自黄帝到西汉武帝时代约三千年的历史，被鲁迅称为“{{b0928}}”。司马迁提出修史的宗旨是“究天人之际，通古今之变，成一家之言”。全书包括十二{{b0929}}（帝王言行政绩）、三十{{b0930}}（记述子孙世袭的王侯封国史迹和特别重要人物事迹）、七十{{b0931}}（除帝王诸侯以外其他重要人物传记）、十表（简列世系、人物和史事）、八书（记述制度发展），共一百三十篇。","blanks":[{"id":"b0927","answer":"西汉","source":""},{"id":"b0928","answer":"史家之绝唱，无韵之离骚","source":""},{"id":"b0929","answer":"本纪","source":""},{"id":"b0930","answer":"世家","source":""},{"id":"b0931","answer":"列传","source":""}]},{"id":"q0473","unit":"u070","page":0,"subtitle":"","text":"2.史学双璧：《史记》和《{{b0932}}》。","blanks":[{"id":"b0932","answer":"资治通鉴","source":""}]},{"id":"q0474","unit":"u070","page":0,"subtitle":"","text":"3.前四史：《史记》《汉书》《后汉书》《{{b0933}}》。","blanks":[{"id":"b0933","answer":"三国志","source":""}]},{"id":"q0475","unit":"u071","page":0,"subtitle":"","text":"1.中共一大1921 年7 月23 日，中共一大在上海（后转移至{{b0934}}嘉兴南湖）召开。会议确定党的名称为“中国共产党”，通过了党的第一个{{b0935}}，选举陈独秀为中央局书记。党的一大的召开标志着中国共产党的成立。","blanks":[{"id":"b0934","answer":"浙江","source":""},{"id":"b0935","answer":"纲领","source":""}]},{"id":"q0476","unit":"u071","page":0,"subtitle":"","text":"2.中共二大1922 年7 月，中共二大在上海召开。会议制定了党的{{b0936}}纲领（实现共产主义）和最低纲领（打倒军阀，推翻国际帝国主义的压迫，统一中国为真正的民主共和国），这是中国近代史上第一次明确地提出了彻底的反帝反封建的民主革命纲领。会议通过了第一部《{{b0937}}》。","blanks":[{"id":"b0936","answer":"最高","source":""},{"id":"b0937","answer":"中国共产党章程","source":""}]},{"id":"q0477","unit":"u071","page":0,"subtitle":"","text":"3.中共三大1923 年6 月，中共三大在{{b0938}}召开。会议决定共产党员以{{b0939}}加入国民党的形式实现国共合作，同时保持共产党在政治上、思想上和组织上的独立性。","blanks":[{"id":"b0938","answer":"广州","source":""},{"id":"b0939","answer":"个人身份","source":""}]},{"id":"q0478","unit":"u071","page":0,"subtitle":"","text":"4.国民党一大1924 年，国民党一大在广州召开。会议确立了“联俄、联共、扶助农工”三大政策，标志着第一次{{b0940}}正式形成。","blanks":[{"id":"b0940","answer":"国共合作","source":""}]},{"id":"q0479","unit":"u072","page":0,"subtitle":"","text":"1.南昌起义1927 年8 月1 日，周恩来等人领导南昌起义，打响武装反抗国民党反动派的第一枪。这是中国共产党独立领导革命战争、{{b0941}}和武装夺取政权的开端。","blanks":[{"id":"b0941","answer":"创建人民军队","source":""}]},{"id":"q0480","unit":"u072","page":0,"subtitle":"","text":"2.八七会议1927 年8 月7 日，中共中央在汉口秘密召开紧急会议，彻底清算了大革命后期陈独秀的{{b0942}}机会主义错误，确定了土地革命和武装斗争的总方针。毛泽东在会上提出“{{b0943}}”。","blanks":[{"id":"b0942","answer":"右倾","source":""},{"id":"b0943","answer":"政权是由枪杆子中取得的","source":""}]},{"id":"q0481","unit":"u072","page":0,"subtitle":"","text":"3.三湾改编1927 年9 月底，毛泽东领导三湾改编，确立了“{{b0944}}”的原则，从政治上组织上保证了党对军队的绝对领导，标志着毛泽东建设人民军队思想的开始形成。","blanks":[{"id":"b0944","answer":"支部建在连上","source":""}]},{"id":"q0482","unit":"u072","page":0,"subtitle":"","text":"4.古田会议1929 年12 月，在福建上杭古田召开，确立了{{b0945}}的原则，解决了如何把以农民为主要成分的军队建设成为无产阶级领导的新型人民军队的根本问题。","blanks":[{"id":"b0945","answer":"思想建党、政治建军","source":""}]},{"id":"q0483","unit":"u072","page":0,"subtitle":"","text":"5.红军长征王明等人的{{b0946}}机会主义错误，使红军在第五次反“围剿”中遭到失败，被迫开始长征。1934 年10 月10 日，红军从江西省瑞金等地出发。1936 年10 月9 日，红四方面军指挥部到达甘肃{{b0947}}，同红一方面军会师；10 月22 日，红二方面军指挥部到达甘肃将台堡（今属宁夏），同红一方面军胜利会师。红军三大主力会师，宣告红军二万五千里长征胜利结束。","blanks":[{"id":"b0946","answer":"左倾","source":""},{"id":"b0947","answer":"会宁","source":""}]},{"id":"q0484","unit":"u072","page":0,"subtitle":"","text":"6.遵义会议1935 年1 月，在贵州遵义召开中共中央政治局扩大会议。会议结束了“左”倾教条主义在军事上的错误指挥，会后成立了由毛泽东、{{b0948}}、王稼祥组成的三人军事领导小组，事实上确立了毛泽东在党中央和红军的领导地位。遵义会议是党的历史上一个生死攸关的转折点，是中国共产党第一次自主地运用 {{b0949}}解决中国革命的问题，标志着中国共产党在政治上开始走向成熟。","blanks":[{"id":"b0948","answer":"周恩来","source":""},{"id":"b0949","answer":"马克思列宁主义","source":""}]},{"id":"q0485","unit":"u073","page":0,"subtitle":"","text":"1.日本侵华战争的开始 {{b0950}}事变：1931 年9 月18 日，日本炸毁柳条湖附近的南满铁路，炮轰北大营。这是中国抗日战争的起点，揭开了世界反法西斯战争的序幕。{{b0951}}事变：1937 年7 月7 日，日军挑起卢沟桥事变。这是中国全民族抗战的开端，开辟了世界反法西斯战争的东方主战场。","blanks":[{"id":"b0950","answer":"九一八","source":""},{"id":"b0951","answer":"七七","source":""}]},{"id":"q0486","unit":"u073","page":0,"subtitle":"","text":"2.抗日民族统一战线的建立 {{b0952}}：1935 年底召开，确定了建立抗日民族统一战线的方针。西安事变：1936 年12 月12 日，张学良、杨虎城逼蒋抗日，又称双十二事变。西安事变的和平解决，标志着十年内战基本结束，抗日民族统一战线{{b0953}}。洛川会议：1937 年洛川会议通过《抗日救国十大纲领》，制定{{b0954}}路线。《中共中央为公布国共合作宣言》：1937 年9 月，国民党发表《中共中央为公布国共合作宣言》，标志着第二次国共合作开始，抗日民族统一战线{{b0955}}。","blanks":[{"id":"b0952","answer":"瓦窑堡会议","source":""},{"id":"b0953","answer":"初步形成","source":""},{"id":"b0954","answer":"全面抗战","source":""},{"id":"b0955","answer":"正式形成","source":""}]},{"id":"q0487","unit":"u073","page":0,"subtitle":"","text":"3.正面战场与敌后战场 {{b0956}}：1937 年8 月至11 月，是抗战初期规模最大、战斗最惨烈的战役，粉碎了日本“三个月灭亡中国”的狂妄计划。平型关大捷（属于太原会战范畴）：1937 年9 月，林彪率领八路军115 师取得平型关大捷。这是全民族抗战以来中国军队主动对日作战取得的第一个重大胜利，打破了“{{b0957}}”的神话。{{b0958}}（属于徐州会战范畴）：1938 年3 月至4 月，在李宗仁指挥下取得抗战以来正面战场的最大胜利。百团大战：1940 年8 月至1941 年1 月，彭德怀指挥八路军一百多个团对日作战。这是抗日战争时期，由中国共产党独立发动的规模最大、{{b0959}}、战果最丰富的战役。","blanks":[{"id":"b0956","answer":"淞沪会战","source":""},{"id":"b0957","answer":"日军不可战胜","source":""},{"id":"b0958","answer":"台儿庄战役","source":""},{"id":"b0959","answer":"持续时间最长","source":""}]},{"id":"q0488","unit":"u074","page":0,"subtitle":"","text":"2.内战爆发1946 年6 月26 日，国民党统治集团全面撕毁“双十协定”，向{{b0960}}解放区发动大规模进攻，全面内战爆发。","blanks":[{"id":"b0960","answer":"中原","source":""}]},{"id":"q0489","unit":"u074","page":0,"subtitle":"","text":"3.战略进攻1947 年6 月，{{b0961}}揭开了人民解放军战略进攻的序幕，是解放战争由战略防御转为战略进攻的历史转折点。","blanks":[{"id":"b0961","answer":"刘邓大军挺进大别山","source":""}]},{"id":"q0490","unit":"u074","page":0,"subtitle":"","text":"4.战略决战1948 年9 月至1949 年1 月，中国人民解放军同国民党军队进行了战略决战，包括{{b0962}}、淮海战役、平津战役三场战略性战役。{{b0963}} 1948 年11 月—1949 年1 月。被称为“小推车推出来的胜利”，是三大战役中解放军牺牲最重、歼敌数量最多、政治影响最大、战争样式最复杂的战役。","blanks":[{"id":"b0962","answer":"辽沈战役","source":""},{"id":"b0963","answer":"淮海战役","source":""}]},{"id":"q0491","unit":"u074","page":0,"subtitle":"","text":"5.七届二中全会1949 年3 月，党的七届二中全会在河北省西柏坡召开。会议指出工作重心应从{{b0964}}转向{{b0965}}，并以生产建设为中心；会议告诫全党在革命胜利后要警惕资产阶级“糖衣炮弹”的袭击，务必继续地保持谦虚、谨慎、不骄、不躁和 {{b0966}}的作风。","blanks":[{"id":"b0964","answer":"乡村","source":""},{"id":"b0965","answer":"城市","source":""},{"id":"b0966","answer":"艰苦奋斗","source":""}]},{"id":"q0492","unit":"u075","page":0,"subtitle":"","text":"1.空间站我国的载人空间站名为“天宫”，于2022 年底全面建成，标志着中国成为世界上{{b0967}}能够独立建造和长期运营空间站的国家。空间站由天和核心舱、{{b0968}}实验舱、梦天实验舱三个舱段构成。{{b0969}}是空间站的管理和控制中心，是发射入轨的第一个空间站舱段。天宫一号和天宫二号天宫一号（2011 年，酒泉）：中国首个目标飞行器、{{b0970}}空间实验室。先后与神舟八号、神舟九号、神舟十号完成了多次自动和手控交会对接。天宫二号（2016 年，酒泉）：中国第一个{{b0971}}的空间实验室。与神舟十一号、天舟一号对接。","blanks":[{"id":"b0967","answer":"第三个","source":""},{"id":"b0968","answer":"问天","source":""},{"id":"b0969","answer":"天和核心舱","source":""},{"id":"b0970","answer":"第一个","source":""},{"id":"b0971","answer":"真正意义","source":""}]},{"id":"q0493","unit":"u075","page":0,"subtitle":"","text":"2.货运飞船我国的货运飞船名为“天舟”，均在{{b0972}}发射，使用长征七号运载火箭。天舟一号（2017 年）：对接天宫二号空间实验室。完成首次在轨推进剂补加（太空加油），我国成为世界{{b0973}}掌握该技术的国家，标志着我国迈入{{b0974}} 时代。天舟二号（2021 年）：对接天和核心舱，是中国空间站第一次{{b0975}}应用性飞行。","blanks":[{"id":"b0972","answer":"文昌","source":""},{"id":"b0973","answer":"第三个","source":""},{"id":"b0974","answer":"空间站","source":""},{"id":"b0975","answer":"货运","source":""}]},{"id":"q0494","unit":"u075","page":0,"subtitle":"","text":"3.载人飞船我国的载人飞船名为“神舟”，均在{{b0976}}发射，使用长征二号F运载火箭。神舟五号（2003 年）：实现首次载人飞行，使中国成为世界{{b0977}}独立掌握载人航天技术的国家。神舟六号（2005 年）：实现首次多人多天的航天飞行。神舟七号（2008 年）：实现首次出舱活动，使中国成为{{b0978}}掌握出舱活动技术的国家。神舟八号（2011 年）：实现与“天宫一号”首次空间交会对接。神舟九号（2012 年）：实现与“天宫一号”首次载人交会对接。神舟十号（2013 年）：实现与“天宫一号”载人交会对接，进行中国首次 {{b0979}}。神舟十一号（2016 年）：实现与“天宫二号”载人交会对接。神舟十二号（2021 年）：实现空间站阶段的首次载人飞行任务，中国人首次进入自己的空间站。神舟十三号（2021 年）：实现中国空间站首次太空授课活动，首次实现在轨 {{b0980}}个月驻留。神舟十四号（2022 年）：实现空间站{{b0981}}阶段的首次载人飞行任务，配合完成问天、梦天实验舱对接与转位，空间站“T”字基本构型组装完成。神舟十五号（2022 年）：实现中国航天员乘组首次{{b0982}}。神舟十六号（2023 年）：实现空间站应用与发展阶段的首次载人飞行任务，首次包含了“航天驾驶员、航天飞行工程师、{{b0983}}”3 种航天员类型。神舟十七号（2023 年）：实现中国首次舱外试验性维修作业。神舟十八号（2024 年）：开展中国首次在轨水生生态研究项目。神舟十九号（2024 年）：实现了我国首次空间站果蝇实验。神舟二十号（2025 年）：开展中国首次涡虫再生实验项目。神舟二十一号（2025 年）：中国首次在轨实施{{b0984}}哺乳动物空间科学实验。神舟二十二号（2025 年）：中国历史上首次{{b0985}}的载人飞船，扮演着“太空救援车”的关键角色。{{b0986}}发射，载人状态返回。神舟二十三号（2026 年）：首次实现3.5 小时快速{{b0987}}交会对接。乘组内1 名航天员执行{{b0988}}年期在轨驻留，配套实施我国首个太空人体长期研究计划。首次在轨连续培养两代水稻。","blanks":[{"id":"b0976","answer":"酒泉","source":""},{"id":"b0977","answer":"第三个","source":""},{"id":"b0978","answer":"第三个","source":""},{"id":"b0979","answer":"太空授课","source":""},{"id":"b0980","answer":"6","source":""},{"id":"b0981","answer":"建造","source":""},{"id":"b0982","answer":"在轨轮换","source":""},{"id":"b0983","answer":"载荷专家","source":""},{"id":"b0984","answer":"啮齿类","source":""},{"id":"b0985","answer":"应急发射","source":""},{"id":"b0986","answer":"无人","source":""},{"id":"b0987","answer":"径向","source":""},{"id":"b0988","answer":"1","source":""}]},{"id":"q0495","unit":"u075","page":0,"subtitle":"","text":"4.中国航天员的“第一”中国第一位进入太空的航天员：杨利伟。中国第一位进入太空的女航天员：刘洋。中国第一位太空行走的航天员：{{b0989}}。中国第一位太空行走的女航天员：王亚平。中国第一位航天飞行工程师：{{b0990}}。中国第一位航天飞行女工程师：{{b0991}}。中国第一位飞行的载荷专家：{{b0992}}。中国第一位飞行的女载荷专家：{{b0993}}。中国进入太空次数最多的航天员（截至2026 年9 月）：{{b0994}}。中国出舱活动次数最多的航天员（截至2026 年9 月）：{{b0995}}。","blanks":[{"id":"b0989","answer":"翟志刚","source":""},{"id":"b0990","answer":"朱杨柱","source":""},{"id":"b0991","answer":"王浩泽","source":""},{"id":"b0992","answer":"桂海潮","source":""},{"id":"b0993","answer":"黎家盈","source":""},{"id":"b0994","answer":"景海鹏","source":""},{"id":"b0995","answer":"张陆","source":""}]},{"id":"q0496","unit":"u076","page":0,"subtitle":"","text":"1.概述2004 年，中国探月工程立项实施，确定了“绕、落、回”三步走战略规划。2023 年，中国载人月球探测工程登月阶段任务启动实施，计划在{{b0996}}年前实现中国人首次登陆月球，开展月球科学考察及相关技术试验，突破掌握载人地月往返、月面短期驻留、人机联合探测等关键技术，完成“登、巡、采、研、回”等多重任务，形成独立自主的载人月球探测能力。","blanks":[{"id":"b0996","answer":"2030","source":""}]},{"id":"q0497","unit":"u076","page":0,"subtitle":"","text":"2.已发射探测器嫦娥一号（2007 年，西昌）：中国首颗月球探测器，获取了我国首张120 米分辨率{{b0997}}。嫦娥二号（2010 年，西昌）：拍摄当时国际最高分辨率（7 米）的全月图，完成日地L2 点探测和图塔蒂斯小行星飞越，验证了深空探测能力，成为中国首个人造太阳系{{b0998}}。嫦娥三号（2013 年，西昌）：实现了中国首次在月球{{b0999}}软着陆。携带玉兔号月球车，使中国成为世界上{{b1000}}实现地外天体软着陆和巡视勘察的国家。嫦娥四号（2018 年，西昌）：实现了世界首次在月球{{b1001}}软着陆。携带玉兔二号月球车，通过{{b1002}}中继星实现地月背面通信。嫦娥五号（2020 年，{{b1003}}）：实现了中国首次月球正面{{b1004}}，标志中国探月工程“绕、落、回”三步走圆满收官。在月壤中发现了全新的矿物，并被命名为“{{b1005}}”。实现五星红旗首次在月球的动态展示，使用的是国产 {{b1006}}，被称为“织物版”国旗。嫦娥六号（2024 年，{{b1007}}）：实现了世界首次月球{{b1008}}取样返回。通过{{b1009}}中继星实现地月背面通信。实现五星红旗首次在月球背面的动态展示，使用{{b1010}}纤维，被誉为“石头版”国旗。鹊桥二号中继星鹊桥二号中继星（2024 年，文昌）：核心任务是为嫦娥六号、嫦娥七号、嫦娥八号等任务提供稳定可靠的中继通信服务，后期也将接替超期服役的初代“鹊桥”，继续支持{{b1011}}月背巡视。","blanks":[{"id":"b0997","answer":"全月影像图","source":""},{"id":"b0998","answer":"卫星","source":""},{"id":"b0999","answer":"正面","source":""},{"id":"b1000","answer":"第三个","source":""},{"id":"b1001","answer":"背面","source":""},{"id":"b1002","answer":"鹊桥","source":""},{"id":"b1003","answer":"文昌","source":""},{"id":"b1004","answer":"采样返回","source":""},{"id":"b1005","answer":"嫦娥石","source":""},{"id":"b1006","answer":"芳纶","source":""},{"id":"b1007","answer":"文昌","source":""},{"id":"b1008","answer":"背面","source":""},{"id":"b1009","answer":"鹊桥二号","source":""},{"id":"b1010","answer":"玄武岩","source":""},{"id":"b1011","answer":"玉兔二号","source":""}]},{"id":"q0498","unit":"u077","page":0,"subtitle":"","text":"2020 年4 月24 日，中国国家航天局宣布，中国行星探测任务命名为“{{b1012}} 系列”，首次{{b1013}}探测任务命名为“天问一号”，首辆火星车命名为“{{b1014}}”。2020 年7 月23 日，“天问一号”在{{b1015}}航天发射场由“长征五号”运载火箭发射成功。“天问一号”任务的顺利完成标志着我国成为世界上{{b1016}} 一次性完成火星“绕、着、巡”的国家。2025 年5 月29 日，“天问二号”在{{b1017}}卫星发射中心成功发射升空。“天问二号”的主要任务目标是对{{b1018}}2016HO3 进行探测、取样并返回地球，此后再对主带彗星311P开展科学探测。“天问二号”的发射成功标志着中国首次 {{b1019}}探测与采样返回之旅顺利迈出第一步。","blanks":[{"id":"b1012","answer":"天问","source":""},{"id":"b1013","answer":"火星","source":""},{"id":"b1014","answer":"祝融","source":""},{"id":"b1015","answer":"文昌","source":""},{"id":"b1016","answer":"第二个","source":""},{"id":"b1017","answer":"西昌","source":""},{"id":"b1018","answer":"小行星","source":""},{"id":"b1019","answer":"小行星","source":""}]},{"id":"q0499","unit":"u078","page":0,"subtitle":"","text":"{{b1020}}卫星发射场（甘肃）：是中国创建最早、规模最大的综合型导弹、卫星发射中心，也是中国{{b1021}}的载人航天发射场。{{b1022}}卫星发射场（山西）：具备多射向、多轨道、远射程和高精度测量的能力，担负太阳同步轨道气象、资源、通信等多种型号中、低轨道卫星发射任务。{{b1023}}卫星发射场（四川）：主要承担地球同步轨道卫星的发射任务，担负通信、广播、气象卫星等试验发射和应用发射任务。被誉为“北斗母港”和“探月母港”。{{b1024}}航天发射场（海南）：中国首个{{b1025}}发射基地，也是世界上为数不多的低纬度发射场之一。主要承担地球同步轨道卫星、大质量极轨卫星、大吨位空间站和深空探测卫星等航天器的发射任务。中国东方航天港（山东）：中国唯一的海上发射母港，具备全射向能力。","blanks":[{"id":"b1020","answer":"酒泉","source":""},{"id":"b1021","answer":"唯一","source":""},{"id":"b1022","answer":"太原","source":""},{"id":"b1023","answer":"西昌","source":""},{"id":"b1024","answer":"文昌","source":""},{"id":"b1025","answer":"滨海","source":""}]},{"id":"q0500","unit":"u079","page":0,"subtitle":"","text":"（1）按照技术成熟程度分类传统能源（常规能源）：技术上比较成熟，已被人类广泛利用，如煤、石油、天然气、{{b1026}}等。新能源（非常规能源）：传统能源之外的各种能源形式，如太阳能、地热能、风能、海洋能、{{b1027}}、可燃冰、{{b1028}}等。","blanks":[{"id":"b1026","answer":"水能","source":""},{"id":"b1027","answer":"核能","source":""},{"id":"b1028","answer":"生物质能","source":""}]},{"id":"q0501","unit":"u079","page":0,"subtitle":"","text":"（2）按照产生方式分类一次能源：自然界中本来就有的各种形式的能源，如化石能源（煤、石油、天然气、{{b1029}}等）、太阳能、风能、地热能、{{b1030}}、潮汐能等。二次能源：由一次能源经过转化或加工制造而产生的能源，如{{b1031}}、氢能、煤气、沼气（主要成分为{{b1032}}）、汽油、柴油、煤油、酒精、焦炭、蒸汽等。","blanks":[{"id":"b1029","answer":"油页岩","source":""},{"id":"b1030","answer":"水能","source":""},{"id":"b1031","answer":"电能","source":""},{"id":"b1032","answer":"甲烷","source":""}]},{"id":"q0502","unit":"u079","page":0,"subtitle":"","text":"（3）按照再生能力分类按照再生能力，可以将{{b1033}}分为可再生能源和不可再生能源。可再生能源：在自然界中可以循环再生的能源，如太阳能、水能、风能、{{b1034}}、地热能、海洋能等。不可再生能源：在自然界中经过亿万年形成，短期内无法恢复，且随着大规模开发利用，储量越来越少，总有枯竭一天的能源，如化石能源、{{b1035}}等。","blanks":[{"id":"b1033","answer":"能源","source":""},{"id":"b1034","answer":"生物质能","source":""},{"id":"b1035","answer":"核能","source":""}]},{"id":"q0503","unit":"u079","page":0,"subtitle":"","text":"（1）核能是原子核结构发生变化时所释放出的能量，是目前{{b1036}}现实的、可大规模代替化石燃料的能源，包括裂变能和聚变能。核裂变：主要用于核电站发电，主要燃料是{{b1037}}。核聚变：目前人类已实现不受控制的核聚变，如{{b1038}}的爆炸，但尚不能对其能量进行控制和有效利用。核能发展1991 年，中国大陆第一座核电站{{b1039}}核电站并网发电。1994 年，中国大陆第一座大型商用核电站{{b1040}}核电站建成。2021 年，中国第三代核电技术“华龙一号”核电机组福建福清核电5 号机组投入商业运行。2023 年，全球首座第四代核电技术石岛湾高温气冷堆核电站投入商业运行。2025 年1 月20 日，我国有“人造太阳”之称的全超导托卡马克{{b1041}}实验装置（EAST）首次完成1 亿摄氏度1000 秒“高质量燃烧”，标志我国{{b1042}} 能源研究实现从基础科学向工程实践的重大跨越。","blanks":[{"id":"b1036","answer":"唯一","source":""},{"id":"b1037","answer":"铀","source":""},{"id":"b1038","answer":"氢弹","source":""},{"id":"b1039","answer":"秦山","source":""},{"id":"b1040","answer":"大亚湾","source":""},{"id":"b1041","answer":"东方超环","source":""},{"id":"b1042","answer":"聚变","source":""}]},{"id":"q0504","unit":"u079","page":0,"subtitle":"","text":"（3）生物质能是太阳能以化学能形式贮存在生物质中的能量形式，即以生物质为载体的能量。生物质能是唯一一种可再生的{{b1043}}，也是人类历史上{{b1044}} 使用的能源。","blanks":[{"id":"b1043","answer":"碳源","source":""},{"id":"b1044","answer":"最早","source":""}]},{"id":"q0505","unit":"u080","page":0,"subtitle":"","text":"（1）{{b1045}}：物体由气态转化为固态，放热。如，霜、雪、雾凇的形成。","blanks":[{"id":"b1045","answer":"凝华","source":""}]},{"id":"q0506","unit":"u080","page":0,"subtitle":"","text":"（2）{{b1046}}：物体由固态转化为气态，吸热。如，衣柜中的樟脑丸变小。","blanks":[{"id":"b1046","answer":"升华","source":""}]},{"id":"q0507","unit":"u080","page":0,"subtitle":"","text":"（1）液化：物体由气态转化为液态，{{b1047}}。如，雨、露、雾的形成。","blanks":[{"id":"b1047","answer":"放热","source":""}]},{"id":"q0508","unit":"u080","page":0,"subtitle":"","text":"（2）汽化：物体由液态转化为气态，{{b1048}}。如，酒精挥发。","blanks":[{"id":"b1048","answer":"吸热","source":""}]},{"id":"q0509","unit":"u081","page":0,"subtitle":"","text":"1.传热方式热传导：不同温度的物体{{b1049}}所发生的热能从高温向低温部分转移的现象。主要发生在{{b1050}}中，在气体或液体等流体中，热传导往往和热对流同时发生。热对流：由于流体（{{b1051}}或气体）的宏观运动，使冷热流体相互掺混，从而实现热量传递的过程。热辐射：物体以{{b1052}}（主要是红外线）的形式向外发射能量的过程。{{b1053}}任何介质，可以在真空中传播，是在真空中最为有效的传热方式。","blanks":[{"id":"b1049","answer":"相互接触","source":""},{"id":"b1050","answer":"固体","source":""},{"id":"b1051","answer":"液体","source":""},{"id":"b1052","answer":"电磁波","source":""},{"id":"b1053","answer":"不需要","source":""}]},{"id":"q0510","unit":"u081","page":0,"subtitle":"","text":"2.分子运动论一切物质的分子都在不停地做无规则的运动，这种无规则运动叫做分子的热运动。温度越高，热运动{{b1054}}。如，食物的腌制、气味的扩散、颜色的浸染等。","blanks":[{"id":"b1054","answer":"越剧烈","source":""}]},{"id":"q0511","unit":"u082","page":0,"subtitle":"","text":"1.直线传播定义：光在同种均匀介质中沿直线传播。应用：影子的形成、{{b1055}}、日食、月食、激光准直。","blanks":[{"id":"b1055","answer":"小孔成像","source":""}]},{"id":"q0512","unit":"u082","page":0,"subtitle":"","text":"2.反射定义：光在两种物质分界面上改变传播方向又返回原来物质中的现象。应用：镜子、水面的{{b1056}}、月光下的水坑、潜望镜。","blanks":[{"id":"b1056","answer":"倒影","source":""}]},{"id":"q0513","unit":"u082","page":0,"subtitle":"","text":"3.折射定义：光从一种透明介质斜射入另一种透明介质时，在两种介质的交界处传播方向发生改变的现象。应用：{{b1057}}、{{b1058}}、水中筷子的弯折、水中鱼看上去比实际大、潭清疑水浅、海市蜃楼、彩虹。","blanks":[{"id":"b1057","answer":"放大镜","source":""},{"id":"b1058","answer":"近视眼镜","source":""}]},{"id":"q0514","unit":"u082","page":0,"subtitle":"","text":"4.散射定义：光通过不均匀介质时一部分光偏离原方向传播的现象。应用：晴天时天空是蓝色的、雾天时光线变得朦胧、{{b1059}}现象、彩霞。","blanks":[{"id":"b1059","answer":"丁达尔","source":""}]},{"id":"q0515","unit":"u083","page":0,"subtitle":"","text":"糖类、脂肪、蛋白质、维生素、无机盐和水是人体所需的六大营养物质。其中，糖类、脂肪和蛋白质能够提供能量，维生素、无机盐和水不能提供能量。在动物饥饿或者冬眠时，能量物质消耗的顺序是：{{b1060}}→{{b1061}}→蛋白质。单位物质的能量含量是：糖类≈蛋白质<脂肪。","blanks":[{"id":"b1060","answer":"糖类","source":""},{"id":"b1061","answer":"脂肪","source":""}]},{"id":"q0516","unit":"u083","page":0,"subtitle":"","text":"1.糖类（碳水化合物）糖类是人体最重要的{{b1062}}物质。血液中的糖类主要为{{b1063}}。蔗糖、麦芽糖、淀粉等需要酶分解成单糖才能被人体吸收。","blanks":[{"id":"b1062","answer":"供能","source":""},{"id":"b1063","answer":"葡萄糖","source":""}]},{"id":"q0517","unit":"u083","page":0,"subtitle":"","text":"2.脂肪是人体最重要的{{b1064}}物质。一般作为备用能源物质贮存在体内。","blanks":[{"id":"b1064","answer":"储能","source":""}]},{"id":"q0518","unit":"u083","page":0,"subtitle":"","text":"3.蛋白质是细胞中含量最多的有机物，是{{b1065}}的主要承担者，是生命的物质基础。","blanks":[{"id":"b1065","answer":"生命活动","source":""}]},{"id":"q0519","unit":"u083","page":0,"subtitle":"","text":"4.维生素是人和动物为维持正常的生理功能而必须从食物中获得的一类微量有机物质，多数{{b1066}}由人体自身合成。维生素不参与构成人体细胞，也不提供能量，但可以调节人体{{b1067}}。常见的维生素：维生素   性状            缺乏症维生素A  脂溶性        {{b1068}}、干眼症、皮肤粗糙干燥维生素B1 水溶性    {{b1069}}（表现为神经炎、水肿）、食欲不振维生素B2 水溶性         {{b1070}}、口角炎、唇炎、舌炎维生素C  水溶性  {{b1071}}（维生素C缺乏症）、免疫力下降、缺铁性贫血维生素D  脂溶性      骨质疏松（成人）、{{b1072}}（儿童）维生素E  脂溶性        上皮细胞变性、孕育异常维生素K  脂溶性        凝血时间延长、出血不止","blanks":[{"id":"b1066","answer":"不能","source":""},{"id":"b1067","answer":"新陈代谢","source":""},{"id":"b1068","answer":"夜盲症","source":""},{"id":"b1069","answer":"脚气病","source":""},{"id":"b1070","answer":"口腔溃疡","source":""},{"id":"b1071","answer":"坏血病","source":""},{"id":"b1072","answer":"佝偻病","source":""}]},{"id":"q0520","unit":"u083","page":0,"subtitle":"","text":"5.无机盐（矿物质）无机盐在人体中占比很少，在细胞中大多数以离子形式存在。对无机盐的摄取可以补充人体所需的各种元素。{{b1073}}：参与甲状腺素的合成，被称作“智慧元素”。缺乏时会引发甲状腺肿（大脖子病），过量时会造成甲亢。铁：参与血红蛋白的形成，缺乏时会造成缺铁性贫血。{{b1074}}：促进生长发育，增强组织再生能力，增强记忆力。缺乏时会造成生长迟滞、大脑发育不良。硒：被称作“{{b1075}}”“抗癌之王”“心脏守护神”。缺乏时会引发克山病（以心肌病变为主的地方性心肌病）和大骨节病。","blanks":[{"id":"b1073","answer":"碘","source":""},{"id":"b1074","answer":"锌","source":""},{"id":"b1075","answer":"生命元素","source":""}]},{"id":"q0521","unit":"u084","page":0,"subtitle":"","text":"1.烫伤后应立即用20℃左右的凉水冲洗以止痛、减少渗出和肿胀，避免或减少水泡形成。等冷却后才可小心地将贴身衣服脱去。{{b1076}}用冰块凉敷，以免产生冻伤。不可擅自在伤口处涂药或涂其他物质，以免影响创面情况的观察与处理。若烫伤处有水泡，不可挑破，应用干净纱布覆盖，去医院处理。","blanks":[{"id":"b1076","answer":"不可","source":""}]},{"id":"q0522","unit":"u084","page":0,"subtitle":"","text":"2.中暑应停止活动并在凉爽、通风的环境中休息，脱去多余的或者紧身的衣服。如果患者有反应并且没有恶心呕吐，可给患者喝水或者运动饮料，也可服用人丹、十滴水、藿香正气水等中药。用湿的凉毛巾放置于患者的头部和躯干部以降温，或将冰袋置于患者的 {{b1077}}、颈侧和{{b1078}}处。","blanks":[{"id":"b1077","answer":"前额","source":""},{"id":"b1078","answer":"腹股沟","source":""}]},{"id":"q0523","unit":"u084","page":0,"subtitle":"","text":"4.煤气中毒当有人在室内煤气中毒，首先应{{b1079}}，将患者迅速转移到通风口处，使其呼吸到新鲜的空气，缓解组织缺氧，并对昏迷者进行人工呼吸。煤气泄漏应禁止一切能够引起火花的行为（如开灯、打开排风扇、点燃打火机等）。","blanks":[{"id":"b1079","answer":"开窗通风","source":""}]},{"id":"q0524","unit":"u084","page":0,"subtitle":"","text":"5.关节扭伤后48 小时内，应{{b1080}}伤处，抬高压迫，予以紧急处理。刚扭伤时，不可热敷、按揉、擦涂红花油等活血化瘀的药剂。冷敷和热敷血遇热而活，遇寒则凝，所以在受伤早期宜{{b1081}}，以减少局部血肿；在出血停止以后再{{b1082}}，可加速消散伤处周围的瘀血。一般而言，受伤24 到48小时后视情况使用热敷。","blanks":[{"id":"b1080","answer":"冷敷","source":""},{"id":"b1081","answer":"冷敷","source":""},{"id":"b1082","answer":"热敷","source":""}]},{"id":"q0525","unit":"u084","page":0,"subtitle":"","text":"6.重金属中毒重金属指的是密度大于4.5g/cm3 的金属。误食铜、镍、钴、铅、锌、锡、锑、铋、镉、汞等金属可导致重金属中毒，需要通过补充{{b1083}}（如牛奶、豆浆等）来缓解中毒症状。","blanks":[{"id":"b1083","answer":"蛋白质","source":""}]},{"id":"q0526","unit":"u084","page":0,"subtitle":"","text":"7.急性呼吸道异物堵塞“海姆立克腹部冲击法”，被称为“生命的拥抱”。对于1 岁以上儿童及成人，发生重度气道梗阻且{{b1084}}时，先进行5 次背部拍击，即用掌根在患者两侧肩胛骨连线的中点处，快速、有力地连续拍击5 次。如果拍背后异物未排出，立即转为腹部冲击。交替进行“5 次背部拍击”和“5次腹部冲击”，直到异物排出或患者失去意识。对于1 岁以下婴儿，严禁使用腹部冲击法，应采用“{{b1085}}+按胸”法，以免损伤其未发育成熟的肝、脾等内脏。对于孕妇和肥胖者，先进行5 次背部拍击，若异物未排出，则采取{{b1086}}。","blanks":[{"id":"b1084","answer":"无法咳嗽","source":""},{"id":"b1085","answer":"拍背","source":""},{"id":"b1086","answer":"胸部冲击","source":""}]},{"id":"q0527","unit":"u085","page":0,"subtitle":"","text":"1.火灾安全疏散的正确顺序：着火层—着火层的{{b1087}}—着火层的{{b1088}}。高层建筑火灾逃生要有序疏散，勿乘电梯；不能跳楼，可利用疏散楼梯、阳台、落水管等，用绳索顺绳滑下逃生自救。穿过充满烟气的楼道逃生时，要尽量{{b1089}}头部的高度，用湿毛巾或口罩捂住口鼻，匍匐着撤离。沿墙壁方向逃生可以明确逃生方向。身上着火后应就地打滚或利用厚重的衣物、被子等物体覆压火苗。","blanks":[{"id":"b1087","answer":"上一层","source":""},{"id":"b1088","answer":"下一层","source":""},{"id":"b1089","answer":"降低","source":""}]},{"id":"q0528","unit":"u085","page":0,"subtitle":"","text":"2.洪水若时间充裕，应按照预定路线，有组织地向山坡、{{b1090}}等处转移；来不及转移时，应立即爬上屋顶、大树、高墙等高处，做暂时避险，等待救援。","blanks":[{"id":"b1090","answer":"高地","source":""}]},{"id":"q0529","unit":"u085","page":0,"subtitle":"","text":"3.泥石流发生泥石流时，要立即向坚固的高地或与泥石流成{{b1091}}方向的两侧山坡跑，离开沟道、河谷地带。","blanks":[{"id":"b1091","answer":"垂直","source":""}]},{"id":"q0530","unit":"u085","page":0,"subtitle":"","text":"1.地震的类型及分布地震按其成因一般分为{{b1092}}、火山地震、塌陷地震。世界有三大地震带，即{{b1093}}地震带（世界上最大的地震带）、欧亚地震带、海岭地震带。其中环太平洋地震带主要影响我国东部地区，欧亚地震带主要影响我国西南地区，海岭地震带不影响我国。","blanks":[{"id":"b1092","answer":"构造地震","source":""},{"id":"b1093","answer":"环太平洋","source":""}]},{"id":"q0531","unit":"u085","page":0,"subtitle":"","text":"（3）震级：衡量地震本身大小，代表地震释放能量的多少。一次地震，只有 {{b1094}}震级。我国目前使用的震级标准是里氏分级表，共分9 个等级，震级相差一级，地震所释放的能量相差30 倍。","blanks":[{"id":"b1094","answer":"一个","source":""}]},{"id":"q0532","unit":"u085","page":0,"subtitle":"","text":"（4）烈度：衡量地震对地表及建筑物的影响和破坏程度。一次地震，可以有 {{b1095}}烈度。一般来说，震级越大，烈度{{b1096}}。","blanks":[{"id":"b1095","answer":"多个","source":""},{"id":"b1096","answer":"越大","source":""}]},{"id":"q0533","unit":"u085","page":0,"subtitle":"","text":"（5）地震波 {{b1097}}（P波）：振动方向与传播方向一致。会引起地面上下颠簸，破坏力相对较弱。传播速度最快，穿透力最强，可以在固体、液体和气体中传播。{{b1098}}（S波）：振动方向与传播方向垂直。会引起地面水平摇晃，对建筑物的剪切破坏力强。传播速度较慢，只能在固体中传播，不能在液体和气体中传播。","blanks":[{"id":"b1097","answer":"纵波","source":""},{"id":"b1098","answer":"横波","source":""}]},{"id":"q0534","unit":"u086","page":0,"subtitle":"","text":"2.拉动经济增长的“三驾马车”投资、{{b1099}}和出口是拉动经济增长的“三驾马车”，是拉动经济增长的最主要力量。其中投资和消费合称为{{b1100}}，出口称为{{b1101}}。","blanks":[{"id":"b1099","answer":"消费","source":""},{"id":"b1100","answer":"内需","source":""},{"id":"b1101","answer":"外需","source":""}]},{"id":"q0535","unit":"u086","page":0,"subtitle":"","text":"（1）国内生产总值（GDP）国内生产总值是一个{{b1102}}概念，是指经济社会（即一国或一地区）在一定时期内运用生产要素所生产的全部最终产品（物品和劳务）的市场价值。GDP是经济增长核算的核心指标，其概念可从以下几方面理解：①GDP是一国范围内生产的最终产品的市场价值，从而是一个地域概念。②GDP是一定时期内（往往为一年）所生产而不是所售卖掉的最终产品价值。③GDP是计算期内生产的最终产品价值，因而是{{b1103}}而不是存量。流量是一定时期内发生的变量，存量是一定时点上存在的变量。④GDP测度的是当期{{b1104}}的价值，中间产品不计入。⑤GDP是一个市场价值的概念，一般仅指{{b1105}}导致的价值。","blanks":[{"id":"b1102","answer":"地域","source":""},{"id":"b1103","answer":"流量","source":""},{"id":"b1104","answer":"最终产品","source":""},{"id":"b1105","answer":"市场活动","source":""}]},{"id":"q0536","unit":"u086","page":0,"subtitle":"","text":"（2）国民生产总值（GNP）国民生产总值是一个{{b1106}}概念，是指一个国家或一个地区的常住居民在一定时期运用拥有的生产要素所生产的全部最终产品（物品和劳务）的市场价值。","blanks":[{"id":"b1106","answer":"国民","source":""}]},{"id":"q0537","unit":"u087","page":0,"subtitle":"","text":"1.通货膨胀的含义通货膨胀是指在货币流通条件下，因货币供给{{b1107}}货币实际需求，导致货币贬值，而引起的一段时间内商品和劳务的价格持续而普遍地{{b1108}}现象。其实质是社会总需求{{b1109}}社会总供给。","blanks":[{"id":"b1107","answer":"大于","source":""},{"id":"b1108","answer":"上涨","source":""},{"id":"b1109","answer":"大于","source":""}]},{"id":"q0538","unit":"u087","page":0,"subtitle":"","text":"2.通货膨胀的衡量物价指数是衡量通货膨胀程度的基本指标，最常见的是消费价格指数（CPI）。消费价格指数（CPI）也称居民消费价格指数，是反映与居民生活有关的产品及劳务价格统计出来的物价变动指标。按国际惯例，当CPI增幅连续超过{{b1110}}时，就意味着发生了通货膨胀；当 CPI增幅低于1%且持续一段时间，预示着通货紧缩的风险。","blanks":[{"id":"b1110","answer":"3%","source":""}]},{"id":"q0539","unit":"u087","page":0,"subtitle":"","text":"3.通货膨胀的影响通货膨胀不利于{{b1111}}收入者，有利于变动收入者；通货膨胀不利于{{b1112}}，有利于债务人；通货膨胀不利于工人，有利于雇主。","blanks":[{"id":"b1111","answer":"固定","source":""},{"id":"b1112","answer":"债权人","source":""}]},{"id":"q0540","unit":"u088","page":0,"subtitle":"","text":"1.财政政策和货币政策的内涵财政政策是指{{b1113}}通过变动财政收入和财政支出以保持社会总供给和社会总需求平衡的一种经济政策。主要工具包括收入部分的税收和国债以及支出部分的政府购买和转移支付。货币政策是指{{b1114}}通过控制和调节货币供应量以保持社会总供给和社会总需求平衡的一种经济政策。主要工具包括法定存款准备金率、{{b1115}}、{{b1116}}、基准利率。法定存款准备金率、再贴现率、公开市场业务、基准利率法定存款准备金率：中央银行规定的商业银行对于存款所必须保持的准备金的比例。再贴现率：商业银行将其贴现的未到期票据向中央银行申请再贴现时的预扣利率。公开市场业务：中央银行通过买进或卖出有价证券，吞吐基础货币，调节货币供应量的活动。基准利率：中央银行规定的{{b1117}}利率。","blanks":[{"id":"b1113","answer":"政府","source":""},{"id":"b1114","answer":"中央银行","source":""},{"id":"b1115","answer":"再贴现率","source":""},{"id":"b1116","answer":"公开市场业务","source":""},{"id":"b1117","answer":"存贷款基准","source":""}]},{"id":"q0541","unit":"u088","page":0,"subtitle":"","text":"2.财政政策和货币政策的运用经济  政策  政策目标        具体措施形势  性质  类型财政 增加财政收入、减少财  {{b1118}}税收、{{b1119}}国债、政策  政支出，抑制总需求     减少支出通货                           {{b1120}}法定存款准备金     紧缩性膨胀         货币 降低货币供应量，抑制  率、{{b1121}}再贴现率、政策     总需求       {{b1122}}利率、{{b1123}}有价证券财政 减少财政收入、增加财  {{b1124}}税收、{{b1125}}国债、政策  政支出，刺激总需求     增加支出通货                           {{b1126}}法定存款准备金     扩张性紧缩         货币 增加货币供应量，刺激  率、{{b1127}}再贴现率、政策     总需求       {{b1128}}利率、{{b1129}}有价证券","blanks":[{"id":"b1118","answer":"增加","source":""},{"id":"b1119","answer":"减少","source":""},{"id":"b1120","answer":"提高","source":""},{"id":"b1121","answer":"提高","source":""},{"id":"b1122","answer":"提高","source":""},{"id":"b1123","answer":"卖出","source":""},{"id":"b1124","answer":"减少","source":""},{"id":"b1125","answer":"增加","source":""},{"id":"b1126","answer":"降低","source":""},{"id":"b1127","answer":"降低","source":""},{"id":"b1128","answer":"降低","source":""},{"id":"b1129","answer":"买入","source":""}]},{"id":"q0542","unit":"u089","page":0,"subtitle":"","text":"3.汇率变动的影响汇率变动    本国进口  本国出口  进口商品物价  资本流动本币汇率下降 {{b1130}}   有利于        {{b1131}}     资本{{b1132}} （本币贬值）本币汇率上升 {{b1133}}   不利于        {{b1134}}     资本{{b1135}} （本币升值）","blanks":[{"id":"b1130","answer":"不利于","source":""},{"id":"b1131","answer":"上涨","source":""},{"id":"b1132","answer":"流出","source":""},{"id":"b1133","answer":"有利于","source":""},{"id":"b1134","answer":"下降","source":""},{"id":"b1135","answer":"流入","source":""}]},{"id":"q0543","unit":"u090","page":0,"subtitle":"","text":"“{{b1136}}”事件：极其罕见、难以预测，但一旦发生就会产生颠覆性影响的小概率事件。“{{b1137}}”事件：明显的、高概率的、早已存在，但却被人们有意或无意忽视，最终可能酿成重大危机的事件。流动性陷阱：当利率降至零或接近零的极低水平时，人们宁愿以现金或储蓄的形式持有货币，而不愿进行投资或消费，导致中央银行通过增加货币供应量、降低利率来刺激经济的货币政策完全无效的状态。{{b1138}}递减：在一定时间内，在其他商品的消费数量保持不变的条件下，当一个人连续消费某种物品时，随着所消费的该物品的数量增加，其所带来的效用的增加量有递减的趋势。拉弗曲线：当税率在一定的限度以下时，提高税率能增加政府税收收入，但超过这一限度时，再提高税率反而导致政府税收收入{{b1139}}。恩格尔系数：表示食品支出总额占个人消费支出总额的比重。通常将其作为衡量家庭或国家{{b1140}}的指标，恩格尔系数越大，一个国家或家庭生活越 {{b1141}}；反之，恩格尔系数越小，生活越{{b1142}}。基尼系数：在全部居民收入中，用于进行不平均分配的那部分收入占总收入的百分比。它是用来综合考察居民内部{{b1143}}差异状况的指标。基尼系数介于 {{b1144}}之间，基尼系数{{b1145}}，表示收入分配差距越大、越不公平；基尼系数越接近0，表示收入分配差距越小、越公平。国际上通常把{{b1146}}作为“警戒线”。赤字率：财政赤字与同期国内生产总值（GDP）之比。这是衡量一个国家财政政策力度和风险水平的重要指标。国际上通常将3%作为赤字率的警戒线。狭义货币（M1）：包含流通中货币（M0）、单位活期存款、个人{{b1147}}、非银行支付机构客户备付金。代表“随时能花的钱”，反映{{b1148}}购买力。广义货币（M2）：包含M1 以及单位定期和其他存款、个人存款、非存款类金融机构存款、非存款机构部门持有的货币市场基金份额。代表“所有的钱”，反映{{b1149}}购买力。","blanks":[{"id":"b1136","answer":"黑天鹅","source":""},{"id":"b1137","answer":"灰犀牛","source":""},{"id":"b1138","answer":"边际效用","source":""},{"id":"b1139","answer":"减少","source":""},{"id":"b1140","answer":"富裕程度","source":""},{"id":"b1141","answer":"贫穷","source":""},{"id":"b1142","answer":"富裕","source":""},{"id":"b1143","answer":"收入分配","source":""},{"id":"b1144","answer":"0和1","source":""},{"id":"b1145","answer":"越大","source":""},{"id":"b1146","answer":"0.4","source":""},{"id":"b1147","answer":"活期存款","source":""},{"id":"b1148","answer":"现实","source":""},{"id":"b1149","answer":"潜在","source":""}]},{"id":"q0544","unit":"u091","page":0,"subtitle":"","text":"按离太阳{{b1150}}的顺序排列为：水星、金星、地球、火星、木星、土星、天王星、海王星。","blanks":[{"id":"b1150","answer":"由近及远","source":""}]},{"id":"q0545","unit":"u091","page":0,"subtitle":"","text":"1.水星：离太阳最近、公转速度最快、体积和质量{{b1151}}、昼夜温差{{b1152}} 的行星。古代被称为“{{b1153}}”。","blanks":[{"id":"b1151","answer":"最小","source":""},{"id":"b1152","answer":"最大","source":""},{"id":"b1153","answer":"辰星","source":""}]},{"id":"q0546","unit":"u091","page":0,"subtitle":"","text":"2.金星：自转方向{{b1154}}，距地球最近、自转最慢、夜空中{{b1155}}的行星。古代被称为“{{b1156}}”“{{b1157}}”“太白”。","blanks":[{"id":"b1154","answer":"与其他行星相反","source":""},{"id":"b1155","answer":"最亮","source":""},{"id":"b1156","answer":"启明星","source":""},{"id":"b1157","answer":"长庚星","source":""}]},{"id":"q0547","unit":"u091","page":0,"subtitle":"","text":"3.地球：{{b1158}}最大、{{b1159}}最大、密度最大的类地行星（岩石行星）。","blanks":[{"id":"b1158","answer":"体积","source":""},{"id":"b1159","answer":"质量","source":""}]},{"id":"q0548","unit":"u091","page":0,"subtitle":"","text":"4.火星：表面富含{{b1160}}，被称为“红色星球”。古代被称为“荧惑星”。","blanks":[{"id":"b1160","answer":"氧化铁","source":""}]},{"id":"q0549","unit":"u091","page":0,"subtitle":"","text":"5.木星：质量和体积{{b1161}}、自转最快的行星。古代被称为“岁星”。","blanks":[{"id":"b1161","answer":"最大","source":""}]},{"id":"q0550","unit":"u091","page":0,"subtitle":"","text":"8.海王星：大气活动最猛烈、表面风速最快，是唯一利用{{b1162}}而非有计划的观测发现的行星。","blanks":[{"id":"b1162","answer":"数学计算","source":""}]},{"id":"q0551","unit":"u092","page":0,"subtitle":"","text":"1.概述月球是地球唯一的天然卫星，是离地球最近的天体。月亮本身不发光，反射的是太阳的光。{{b1163}}是月面上最显著的地貌特征。由于缺乏大气层保护，月球昼夜温差极大。月球自西向东自转，自转周期与公转周期几乎一致，故月球是一颗同步卫星。月球引力是地球海洋{{b1164}}产生的最主要原因。潮汐锁定地球引力导致月球自转速度逐渐减慢，最终使其自转周期与公转周期完全一致，因而月球总是以{{b1165}}（正面）朝向地球。","blanks":[{"id":"b1163","answer":"环形山","source":""},{"id":"b1164","answer":"潮汐","source":""},{"id":"b1165","answer":"同一面","source":""}]},{"id":"q0552","unit":"u092","page":0,"subtitle":"","text":"2.月相变化的周期为一个朔望月，即29.53 天。月相   新月（朔）   上弦月   满月（望）    下弦月日期（农历）   {{b1166}}  初七、初八  十五、十六  二十二、二十三半圆形            半圆形外观    不可见           圆形亮面朝西           亮面朝东","blanks":[{"id":"b1166","answer":"初一","source":""}]},{"id":"q0553","unit":"u092","page":0,"subtitle":"","text":"3.日食和月食日食              月食 {{b1167}}运动到太阳和地球中间， {{b1168}}运动到太阳和月球中间，概念三者在一条直线。        三者在一条直线。时间  只可能发生在农历{{b1169}}前后  只可能发生在农历{{b1170}}前后分类   日偏食、日全食、日环食    月偏食、月全食、半影月食","blanks":[{"id":"b1167","answer":"月球","source":""},{"id":"b1168","answer":"地球","source":""},{"id":"b1169","answer":"初一","source":""},{"id":"b1170","answer":"十五","source":""}]},{"id":"q0554","unit":"u093","page":0,"subtitle":"","text":"1.对流雨，也叫热雷雨，是近地面空气局部受热或高层空气强烈降温，导致上下层空气发生对流，使低层空气上升，水汽在高空冷却、凝结而形成的降水。强烈的对流雨常伴有强风、雷电、冰雹或龙卷风，但雨时{{b1171}}，雨区范围也较小，或呈不连续的条块分布。多发生在{{b1172}}酷热的午后。{{b1173}}地带全年以对流雨为主。","blanks":[{"id":"b1171","answer":"短","source":""},{"id":"b1172","answer":"夏季","source":""},{"id":"b1173","answer":"赤道","source":""}]},{"id":"q0555","unit":"u093","page":0,"subtitle":"","text":"2.地形雨当潮湿的气团前进时，遇到高山阻挡，气流被迫缓慢上升，引起绝热降温，发生凝结而形成的降水。地形雨多降在{{b1174}}的山坡（{{b1175}}）上，背风坡面则因空气下沉引起绝热增温，反使云量消减，降雨减少。","blanks":[{"id":"b1174","answer":"迎风","source":""},{"id":"b1175","answer":"迎风坡","source":""}]},{"id":"q0556","unit":"u093","page":0,"subtitle":"","text":"3.锋面雨冷、暖两种性质不同的气团相遇时，暖湿空气被抬升，在高空冷却凝结而形成的降水。雨势通常比较和缓。降水区域呈带状分布，水平范围很大。降雨持续时间较长，短则几天，长则半个月以上。常见的有{{b1176}}、{{b1177}}等。梅雨，是在每年6、7 月份的东南季风带来的太平洋暖湿气流，经过中国 {{b1178}}地区、中国台湾地区、日本中南部以及韩国南部等地出现的持续天阴有雨的气候现象。由于正是江南梅子的成熟期，故称其为“梅雨”。","blanks":[{"id":"b1176","answer":"冷锋雨","source":""},{"id":"b1177","answer":"暖锋雨","source":""},{"id":"b1178","answer":"长江中下游","source":""}]},{"id":"q0557","unit":"u093","page":0,"subtitle":"","text":"4.台风雨是由热带气旋（台风或飓风）带来的降水。降水主要集中在台风眼周围的“{{b1179}}”，这里上升气流最强，降雨最猛烈；而{{b1180}}内部气流下沉，通常是晴朗无风的。主要影响热带、亚热带沿海地区，多发生在夏秋季节。","blanks":[{"id":"b1179","answer":"云墙","source":""},{"id":"b1180","answer":"台风眼","source":""}]},{"id":"q0558","unit":"u094","page":0,"subtitle":"","text":"我国共有14 个陆上邻国，6 个隔海相望的国家。14 个与我国接壤的国家：朝鲜、蒙古、俄罗斯、哈萨克斯坦、吉尔吉斯斯坦、塔吉克斯坦、印度、尼泊尔、不丹、阿富汗、{{b1181}}、缅甸、老挝、越南。6 个隔海相望的国家：日本、韩国、{{b1182}}、马来西亚、文莱、印度尼西亚。周边国家之最 {{b1183}}：世界上面积最大的国家。{{b1184}}：世界上最大的内陆国。{{b1185}}：世界上最大的群岛国家，被称为“万岛之国”。","blanks":[{"id":"b1181","answer":"巴基斯坦","source":""},{"id":"b1182","answer":"菲律宾","source":""},{"id":"b1183","answer":"俄罗斯","source":""},{"id":"b1184","answer":"哈萨克斯坦","source":""},{"id":"b1185","answer":"印度尼西亚","source":""}]},{"id":"q0559","unit":"u095","page":0,"subtitle":"","text":"1.主要
