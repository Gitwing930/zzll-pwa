<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>政治理论 & 常识判断填空学习 · 行测考点</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A62621">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="政治理论填空">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23A62621'/%3E%3Cpath d='M9 8h14M16 8v16M12 24h8' stroke='%23F7F1E6' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ============ 基础变量 ============ */
:root{
  --paper:#F6F2EA;
  --paper-2:#EFE9DD;
  --card:#FFFFFF;
  --ink:#2B2721;
  --ink-2:#5C554A;
  --ink-3:#8C8377;
  --line:#E4DCC E;
  --line:#E3DCCF;
  --red:#A62621;
  --red-deep:#8C1F1B;
  --red-soft:#F7E9E7;
  --green:#2E7D43;
  --green-soft:#E7F3EA;
  --wrong:#C0392B;
  --wrong-soft:#FBEAE7;
  --gold:#B7862E;
  --shadow:0 1px 2px rgba(60,45,30,.05),0 6px 20px rgba(60,45,30,.06);
  --radius:12px;
  --serif:"Noto Serif SC",Songti SC,STSong,SimSun,serif;
  --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  line-height:1.7;
  font-size:15.5px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C9BFAE;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
.app{min-height:100vh}
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;position:sticky;top:0;z-index:40;
  background:rgba(246,242,234,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:9px;color:var(--ink)}
.topbar .menu-btn:hover{background:var(--paper-2)}
.topbar .brand{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--red-deep);letter-spacing:.5px}
.topbar .brand small{font-family:var(--sans);font-weight:400;font-size:11px;color:var(--ink-3);display:block;letter-spacing:0}

.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:290px;z-index:60;
  background:var(--card);border-right:1px solid var(--line);
  display:none;flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,.12);
}
.sidebar.open{display:flex;animation:sbIn .24s ease}
@keyframes sbIn{from{transform:translateX(-100%)}to{transform:none}}
.sidebar .sb-head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.sidebar .sb-logo{font-family:var(--serif);font-size:18px;font-weight:900;color:var(--red-deep);letter-spacing:1px}
.sidebar .sb-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.sb-close{position:absolute;top:12px;right:10px;width:32px;height:32px;border-radius:8px;color:var(--ink-2);font-size:20px}
.sb-close:hover{background:var(--paper-2)}
.overlay{position:fixed;inset:0;background:rgba(30,24,18,.4);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}

.main{padding:18px 16px 60px;max-width:920px;margin:0 auto}
@media(min-width:980px){
  .topbar{display:none}
  .sidebar{display:flex!important;animation:none;box-shadow:none}
  .main{margin-left:290px;max-width:calc(100% - 290px);padding:30px 40px 70px}
  .main-inner{max-width:860px;margin:0 auto}
}

/* ============ 导航树 ============ */
.nav-view{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;color:var(--ink-2);font-size:14px}
.nav-view:hover{background:var(--paper-2)}
.nav-view.active{background:var(--red-soft);color:var(--red-deep);font-weight:600}
.nav-view .nv-ico{width:18px;height:18px;flex:none;display:inline-flex}
.nav-pian{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);padding:11px 10px 5px;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
.nav-pian .pdot{width:7px;height:7px;border-radius:2px;background:var(--red);flex:none}
.nav-chap{font-size:12.5px;font-weight:600;color:var(--ink-3);padding:8px 10px 2px 16px}
.nav-unit{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px 7px 24px;border-radius:8px;font-size:13.5px;color:var(--ink-2);line-height:1.35}
.nav-unit:hover{background:var(--paper-2)}
.nav-unit.active{background:var(--red-soft);color:var(--red-deep);font-weight:600}
.nav-unit .nu-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-unit .nu-pct{font-size:11px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.nav-unit.done .nu-pct{color:var(--green)}
.nav-unit.locked{opacity:.55}
.nav-unit .lock{width:13px;height:13px;flex:none}

/* ============ 首页 / 统计 ============ */
.hero{background:linear-gradient(135deg,#A62621,#8C1F1B);border-radius:18px;padding:26px 24px;color:#FBEFEA;box-shadow:var(--shadow)}
.hero h1{font-family:var(--serif);font-size:23px;font-weight:900;letter-spacing:1px;line-height:1.4}
.hero p{font-size:13.5px;opacity:.88;margin-top:7px}
.hero .ring-row{display:flex;align-items:center;gap:22px;margin-top:20px;flex-wrap:wrap}
.ring{--p:0;width:96px;height:96px;border-radius:50%;flex:none;
  background:conic-gradient(#F4D58D calc(var(--p)*1%),rgba(255,255,255,.18) 0);
  display:flex;align-items:center;justify-content:center;position:relative}
.ring::before{content:"";position:absolute;inset:9px;background:#96231F;border-radius:50%}
.ring .ring-txt{position:relative;text-align:center;z-index:1}
.ring .ring-txt b{font-size:22px;font-weight:700;display:block;line-height:1}
.ring .ring-txt span{font-size:10.5px;opacity:.85}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap;flex:1;min-width:200px}
.hero-stats .hs b{font-size:22px;font-weight:700;display:block;line-height:1.1}
.hero-stats .hs span{font-size:12px;opacity:.85}

.section-title{font-family:var(--serif);font-size:17px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.section-title::before{content:"";width:5px;height:17px;background:var(--red);border-radius:2px}

.pian-grid{display:grid;grid-template-columns:1fr;gap:13px}
@media(min-width:680px){.pian-grid{grid-template-columns:repeat(2,1fr)}}
.pian-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .15s,box-shadow .15s}
.pian-card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(60,45,30,.06),0 12px 28px rgba(60,45,30,.1)}
.pian-card .pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pian-card .pc-name{font-family:var(--serif);font-weight:700;font-size:15.5px}
.pian-card .pc-tag{font-size:11px;background:var(--paper-2);color:var(--ink-2);padding:2px 9px;border-radius:20px}
.pian-card .pc-desc{font-size:12.5px;color:var(--ink-3);margin:6px 0 12px}
.pbar{height:7px;background:var(--paper-2);border-radius:6px;overflow:hidden}
.pbar > i{display:block;height:100%;background:linear-gradient(90deg,#C0392B,#A62621);border-radius:6px;transition:width .4s}
.pian-card .pc-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:7px}
.pian-card.locked{opacity:.7}
.pian-card.locked .pc-name{color:var(--ink-2)}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:680px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.stat-card b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;display:block;line-height:1.1;color:var(--red-deep)}
.stat-card.good b{color:var(--green)}
.stat-card.warn b{color:var(--gold)}
.stat-card span{font-size:12px;color:var(--ink-3)}

/* ============ 学习区 ============ */
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:6px;line-height:1.6}
.crumb b{color:var(--ink-2);font-weight:500}
.unit-head{margin-bottom:16px}
.unit-head h2{font-family:var(--serif);font-size:21px;font-weight:800;line-height:1.4;color:var(--ink)}
.unit-progress{display:flex;align-items:center;gap:12px;margin-top:12px}
.unit-progress .pbar{flex:1}
.unit-progress .up-txt{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:500;border:1px solid transparent;transition:all .15s;min-height:38px}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-deep)}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{background:var(--paper-2)}
.btn-soft{background:var(--red-soft);color:var(--red-deep)}
.btn-soft:hover{background:#f0d9d6}
.seg{display:inline-flex;background:var(--paper-2);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:7px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--red-deep);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toolbar .spacer{flex:1}

.q-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:13px;box-shadow:var(--shadow)}
.q-sub{font-size:12px;font-weight:600;color:var(--red);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.q-sub .q-idx{background:var(--red-soft);color:var(--red-deep);border-radius:6px;padding:1px 8px;font-size:11px;font-weight:600}
.q-text{font-size:16px;line-height:2.15;color:var(--ink);word-break:break-word}

/* 填空输入 */
.blank{display:inline-block;vertical-align:baseline;margin:0 2px;position:relative}
.blank input{
  font-family:var(--sans);font-size:15.5px;text-align:center;
  border:none;border-bottom:2px solid #B4A992;background:var(--paper-2);
  border-radius:6px 6px 2px 2px;padding:2px 6px 3px;color:var(--ink);
  min-width:64px;transition:background .15s,border-color .15s;
}
.blank input::placeholder{color:#C3BAA9}
.blank input:focus{outline:none;background:#FDFAF3;border-bottom-color:var(--red)}
.blank.ok input{background:var(--green-soft);border-bottom-color:var(--green);color:var(--green);font-weight:600}
.blank.no input{background:var(--wrong-soft);border-bottom-color:var(--wrong);color:var(--wrong)}
.blank .reveal{font-weight:600;color:var(--red-deep);background:var(--red-soft);border-radius:5px;padding:1px 7px;margin:0 1px;white-space:nowrap}
.blank .ans-tip{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:20;
  background:#3A332B;color:#fff;font-size:12px;padding:4px 9px;border-radius:6px;white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.2)}
.blank.no .ans-tip{display:block}
.blank .eye{position:absolute;top:-9px;right:-9px;width:19px;height:19px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:none;align-items:center;justify-content:center;color:var(--ink-3)}
.blank .eye svg{width:11px;height:11px}
.blank:hover .eye{display:inline-flex}
.blank .eye:hover{color:var(--red-deep)}
.blank.pending{display:inline-block;padding:0 8px;border-radius:5px;background:#FBF3D9;color:#9A7420;border:1px dashed #D9C28A;font-size:13px;font-weight:600;cursor:help}

/* ===== 选词填空模式 ===== */
.match-slot{display:inline-block;min-width:64px;padding:2px 10px;border-bottom:2px dashed #B4A992;background:var(--paper-2);border-radius:6px;text-align:center;cursor:pointer;color:var(--ink-2);font-weight:500;transition:all .12s;font-size:15.5px}
.blank.match-blank{cursor:pointer}
.blank.match-selected .match-slot{border-color:var(--red);background:#FDFAF3;color:var(--red-deep);border-bottom-style:solid}
.blank.match-ok .match-slot{background:var(--green-soft);border-color:var(--green);border-bottom-style:solid;color:var(--green);font-weight:600;cursor:default}
.blank.match-no .match-slot{background:var(--wrong-soft);border-color:var(--wrong);color:var(--wrong)}
.bank{background:var(--card);border:1.5px solid var(--red);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);position:sticky;bottom:10px;z-index:10}
.bank-title{font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;min-height:24px}
.bank-title .dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
.bank-title .bank-remain{margin-left:auto;font-weight:600;color:var(--red-deep);font-variant-numeric:tabular-nums}
.bank-title .bank-fold{flex:none;color:var(--ink-3);transition:transform .18s}
.bank.collapsed .bank-title .bank-fold{transform:rotate(-90deg)}
.bank-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;max-height:30vh;overflow-y:auto;padding-bottom:2px}
.bank.collapsed .bank-chips{display:none}
.chip{background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;transition:all .12s;line-height:1.3}
.chip:hover{background:var(--red-soft);border-color:var(--red);color:var(--red-deep)}
.chip.picked{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 3px 10px rgba(166,38,33,.3)}
.chip.used{background:var(--green-soft);color:var(--green);border-color:var(--green);cursor:default;pointer-events:none;opacity:.75}
.chip.shake{animation:chshake .3s}
@keyframes chshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* 对照模式 */
body.mode-read .q-text{line-height:2.2}
.blank.answered .reveal{color:var(--green);background:var(--green-soft)}

.unit-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;flex-wrap:wrap}
.unit-foot .score{font-size:14px;color:var(--ink-2)}
.unit-foot .score b{font-size:18px;color:var(--red-deep);font-variant-numeric:tabular-nums}
.nav-pager{display:flex;gap:10px}

/* 错题本 */
.wrong-group{margin-bottom:18px}
.wrong-group h3{font-family:var(--serif);font-size:15px;margin-bottom:10px;color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--line)}
.wrong-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-bottom:9px;box-shadow:var(--shadow)}
.wrong-item .q-text{font-size:15px;line-height:2.05}
.wrong-item .wi-meta{font-size:11.5px;color:var(--wrong);margin-top:7px}
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-3)}
.empty-state .es-ico{width:64px;height:64px;margin:0 auto 16px;opacity:.5}
.empty-state h3{font-family:var(--serif);font-size:18px;color:var(--ink-2);margin-bottom:8px}
.empty-state p{font-size:13.5px;margin-bottom:18px}

/* 来源 */
.src-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--gold);text-decoration:none;margin-top:8px;word-break:break-all}
.src-link svg{width:12px;height:12px;flex:none}
.src-link:hover{text-decoration:underline}

/* toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#332C24;color:#fff;padding:11px 22px;border-radius:10px;font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hidden{display:none!important}
</style>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>
<div class="app">
  <!-- 移动端顶栏 -->
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="打开目录">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">政治理论 &amp; 常识判断<small id="brandSub">行测考点</small></div>
  </div>

  <!-- 遮罩 -->
  <div class="overlay" id="overlay"></div>

  <!-- 侧边导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <button class="sb-close" id="sbClose" aria-label="关闭目录">&times;</button>
      <div class="sb-logo">政治理论填空</div>
      <div class="sb-sub">行测 · 考点挖空记忆</div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <div class="main-inner" id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

age":22,"subtitle":"（四）作风建设","text":"3.要持续深化纠治{{b0306}}主义、{{b0307}}主义、享乐主义和奢靡之风。","blanks":[{"id":"b0306","answer":"形式","source":""},{"id":"b0307","answer":"官僚","source":""}]},{"id":"q0166","unit":"u016","page":22,"subtitle":"（五）纪律建设","text":"加强纪律建设是全面从严治党的{{b0308}}之策。","blanks":[{"id":"b0308","answer":"治本","source":""}]},{"id":"q0167","unit":"u016","page":22,"subtitle":"（六）制度建设","text":"1.从严治党要靠思想教育，也要靠制度保障，靠制度是{{b0309}}之策、根本之策。","blanks":[{"id":"b0309","answer":"长远","source":""}]},{"id":"q0168","unit":"u016","page":22,"subtitle":"（六）制度建设","text":"2.要坚持以{{b0310}}为根本，以{{b0311}}为核心，完善党内法规制度体系。","blanks":[{"id":"b0310","answer":"党章","source":""},{"id":"b0311","answer":"民主集中制","source":""}]},{"id":"q0169","unit":"u016","page":22,"subtitle":"（六）制度建设","text":"3.{{b0312}}监督是永葆党的肌体健康的生命之源，在党和国家各种监督形式中是最根本的、第一位的。","blanks":[{"id":"b0312","answer":"党内","source":""}]},{"id":"q0170","unit":"u016","page":22,"subtitle":"（七）反腐倡廉建设","text":"1.腐败是党长期执政面临的最大{{b0313}}，反腐败是最彻底的{{b0314}}。","blanks":[{"id":"b0313","answer":"威胁","source":""},{"id":"b0314","answer":"自我革命","source":""}]},{"id":"q0171","unit":"u016","page":22,"subtitle":"（七）反腐倡廉建设","text":"2.反腐倡廉的核心是{{b0315}}制约和监督权力。","blanks":[{"id":"b0315","answer":"制度","source":""}]},{"id":"q0172","unit":"u016","page":22,"subtitle":"（七）反腐倡廉建设","text":"3.坚持不敢腐、不能腐、不想腐一体推进。把{{b0316}}腐的强大震慑效能、{{b0317}}腐的刚性制度约束、{{b0318}}腐的思想教育优势融于一体。","blanks":[{"id":"b0316","answer":"不敢","source":""},{"id":"b0317","answer":"不能","source":""},{"id":"b0318","answer":"不想","source":""}]},{"id":"q0173","unit":"u016","page":22,"subtitle":"（七）反腐倡廉建设","text":"4.党的{{b0319}}是跳出历史周期率的第二个答案。勇于{{b0320}}，是中国共产党区别于其他政党的显著标志，也是我们党最大的优势、最鲜明的品格。","blanks":[{"id":"b0319","answer":"自我革命","source":""},{"id":"b0320","answer":"自我革命","source":""}]},{"id":"q0174","unit":"u017","page":22,"subtitle":"","text":"1.总体国家安全观是总体的、系统的、{{b0321}}的大安全。以国家利益为准则，以{{b0322}}安全为根本，以{{b0323}}安全为基础，以{{b0324}}安全为宗旨，以军事、科技、文化、社会安全为保障，以促进国际安全为依托。","blanks":[{"id":"b0321","answer":"相对","source":""},{"id":"b0322","answer":"政治","source":""},{"id":"b0323","answer":"经济","source":""},{"id":"b0324","answer":"人民","source":""}]},{"id":"q0175","unit":"u017","page":22,"subtitle":"","text":"2.总体国家安全观的关键和灵魂是“{{b0325}}”，它突出大安全理念。","blanks":[{"id":"b0325","answer":"总体","source":""}]},{"id":"q0176","unit":"u017","page":22,"subtitle":"","text":"3.坚持把{{b0326}}安全摆在首位，这是新时代中国国家安全的生命线。","blanks":[{"id":"b0326","answer":"政治","source":""}]},{"id":"q0177","unit":"u017","page":22,"subtitle":"","text":"4.践行{{b0327}}安全宗旨，这是新时代中国国家安全的根本立场。","blanks":[{"id":"b0327","answer":"人民","source":""}]},{"id":"q0178","unit":"u018","page":23,"subtitle":"","text":"教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性{{b0328}}。","blanks":[{"id":"b0328","answer":"支撑","source":""}]},{"id":"q0179","unit":"u018","page":23,"subtitle":"","text":"必须坚持{{b0329}}是第一生产力、{{b0330}}是第一资源、{{b0331}}是第一动力，加快教育强国、科技强国、人才强国建设。","blanks":[{"id":"b0329","answer":"科技","source":""},{"id":"b0330","answer":"人才","source":""},{"id":"b0331","answer":"创新","source":""}]},{"id":"q0180","unit":"u018","page":23,"subtitle":"一、加快建设教育强国","text":"1.建设教育强国是全面推进强国建设、民族复兴伟业的{{b0332}}任务、坚实基础、战略支撑。","blanks":[{"id":"b0332","answer":"先导","source":""}]},{"id":"q0181","unit":"u018","page":23,"subtitle":"2.培养什么人、为谁培养人、怎样培养人是教育的根本问题，也是建设教育强国的核心课题。","text":"3.必须以坚持党对教育事业的全面领导为根本{{b0333}}，以{{b0334}}为根本任务，以为党育人、为国育才为根本目标。","blanks":[{"id":"b0333","answer":"保证","source":""},{"id":"b0334","answer":"立德树人","source":""}]},{"id":"q0182","unit":"u018","page":23,"subtitle":"2.培养什么人、为谁培养人、怎样培养人是教育的根本问题，也是建设教育强国的核心课题。","text":"4.{{b0335}}发展是教育的生命线。要把{{b0336}}教育作为基点，{{b0337}}教育作为龙头。","blanks":[{"id":"b0335","answer":"高质量","source":""},{"id":"b0336","answer":"基础","source":""},{"id":"b0337","answer":"高等","source":""}]},{"id":"q0183","unit":"u018","page":23,"subtitle":"二、加快建设科技强国","text":"1.实现高水平科技{{b0338}}是国家强盛和民族复兴的战略基石。","blanks":[{"id":"b0338","answer":"自立自强","source":""}]},{"id":"q0184","unit":"u018","page":23,"subtitle":"2.全面建成社会主义现代化强国关键看科技自立自强，这是促进发展大局的根本支撑。","text":"3.{{b0339}}研究是科技创新的源头，{{b0340}}研究是基础研究转化为实际应用的桥梁。","blanks":[{"id":"b0339","answer":"基础","source":""},{"id":"b0340","answer":"应用","source":""}]},{"id":"q0185","unit":"u018","page":23,"subtitle":"2.全面建成社会主义现代化强国关键看科技自立自强，这是促进发展大局的根本支撑。","text":"4.加大研发投入，健全{{b0341}}投入为主、社会多渠道投入机制。","blanks":[{"id":"b0341","answer":"政府","source":""}]},{"id":"q0186","unit":"u018","page":23,"subtitle":"2.全面建成社会主义现代化强国关键看科技自立自强，这是促进发展大局的根本支撑。","text":"5.强化基础研究前瞻性、战略性、系统性布局，坚持目标导向和{{b0342}}“两条腿走路”，有组织推进{{b0343}}导向的体系化基础研究、{{b0344}}导向的探索性基础研究、{{b0345}}导向的应用性基础研究，把握科技发展大趋势，下好自主创新先手棋。","blanks":[{"id":"b0342","answer":"自由探索","source":""},{"id":"b0343","answer":"战略","source":""},{"id":"b0344","answer":"前沿","source":""},{"id":"b0345","answer":"市场","source":""}]},{"id":"q0187","unit":"u018","page":23,"subtitle":"6.国家实验室、国家科研机构、高水平研究型大学、科技领军企业都是国家战略科技力量的重要组成部分。","text":"{{b0346}}要发挥引领作用，多出战略性、关键性重大科技成果。","blanks":[{"id":"b0346","answer":"国家实验室","source":""}]},{"id":"q0188","unit":"u018","page":23,"subtitle":"6.国家实验室、国家科研机构、高水平研究型大学、科技领军企业都是国家战略科技力量的重要组成部分。","text":"{{b0347}}要发挥建制化组织作用，加快建设原始创新策源地。","blanks":[{"id":"b0347","answer":"国家科研机构","source":""}]},{"id":"q0189","unit":"u018","page":23,"subtitle":"6.国家实验室、国家科研机构、高水平研究型大学、科技领军企业都是国家战略科技力量的重要组成部分。","text":"{{b0348}}是基础研究的主力军和重大科技突破的生力军。","blanks":[{"id":"b0348","answer":"高水平研究型大学","source":""}]},{"id":"q0190","unit":"u018","page":23,"subtitle":"6.国家实验室、国家科研机构、高水平研究型大学、科技领军企业都是国家战略科技力量的重要组成部分。","text":"{{b0349}}是科技创新的主体。","blanks":[{"id":"b0349","answer":"企业","source":""}]},{"id":"q0191","unit":"u018","page":24,"subtitle":"三、加快建设人才强国","text":"1.人才是实现民族振兴、赢得国际竞争主动的战略{{b0350}}。","blanks":[{"id":"b0350","answer":"资源","source":""}]},{"id":"q0192","unit":"u018","page":24,"subtitle":"三、加快建设人才强国","text":"2.坚持{{b0351}}对人才工作的全面领导，是我国人才体系的鲜明政治优势，也是建设人才强国的“纲”和“本”。","blanks":[{"id":"b0351","answer":"党","source":""}]},{"id":"q0193","unit":"u018","page":24,"subtitle":"三、加快建设人才强国","text":"3.走好人才{{b0352}}之路，满足庞大的人才需求必须主要依靠自己培养。","blanks":[{"id":"b0352","answer":"自主培养","source":""}]},{"id":"q0194","unit":"u018","page":24,"subtitle":"三、加快建设人才强国","text":"4.改进人才评价机制，建立健全以{{b0353}}能力、质量、实效、贡献为导向的评价体系。","blanks":[{"id":"b0353","answer":"创新","source":""}]},{"id":"q0195","unit":"u019","page":25,"subtitle":"1.物质","text":"物质的唯一特性是{{b0354}}。","blanks":[{"id":"b0354","answer":"客观实在性","source":""}]},{"id":"q0196","unit":"u019","page":25,"subtitle":"1.物质","text":"物质的根本属性和存在方式是{{b0355}}。","blanks":[{"id":"b0355","answer":"运动","source":""}]},{"id":"q0197","unit":"u019","page":25,"subtitle":"1.物质","text":"世界上的事物都是{{b0356}}运动和{{b0357}}静止的统一。","blanks":[{"id":"b0356","answer":"绝对","source":""},{"id":"b0357","answer":"相对","source":""}]},{"id":"q0198","unit":"u019","page":25,"subtitle":"2.意识","text":"意识的本质是人脑对客观存在的{{b0358}}。","blanks":[{"id":"b0358","answer":"主观映象","source":""}]},{"id":"q0199","unit":"u019","page":25,"subtitle":"3.物质和意识的辩证关系","text":"{{b0359}}决定{{b0360}}，要求一切从实际出发。","blanks":[{"id":"b0359","answer":"物质","source":""},{"id":"b0360","answer":"意识","source":""}]},{"id":"q0200","unit":"u019","page":25,"subtitle":"3.物质和意识的辩证关系","text":"意识具有{{b0361}}，对物质起能动的反作用。{{b0362}}的意识对事物的发展具有促进作用，{{b0363}}的意识对事物的发展具有阻碍作用。","blanks":[{"id":"b0361","answer":"主观能动性","source":""},{"id":"b0362","answer":"正确","source":""},{"id":"b0363","answer":"错误","source":""}]},{"id":"q0201","unit":"u019","page":25,"subtitle":"3.物质和意识的辩证关系","text":"{{b0364}}是正确发挥主观能动性的前提。","blanks":[{"id":"b0364","answer":"尊重客观规律","source":""}]},{"id":"q0202","unit":"u020","page":25,"subtitle":"","text":"{{b0365}}和{{b0366}}的观点是唯物辩证法的总观点和总特征。","blanks":[{"id":"b0365","answer":"联系","source":""},{"id":"b0366","answer":"发展","source":""}]},{"id":"q0203","unit":"u020","page":25,"subtitle":"1.联系的特征","text":"（1）联系的{{b0367}}","blanks":[{"id":"b0367","answer":"客观性","source":""}]},{"id":"q0204","unit":"u020","page":25,"subtitle":"1.联系的特征","text":"（2）联系的{{b0368}}","blanks":[{"id":"b0368","answer":"普遍性","source":""}]},{"id":"q0205","unit":"u020","page":25,"subtitle":"（1）整体居于主导地位，整体统率着部分，整体具有部分所没有的新功能。","text":"（2）部分{{b0369}}整体，{{b0370}}部分的功能及其变化甚至决定整体的功能。","blanks":[{"id":"b0369","answer":"制约","source":""},{"id":"b0370","answer":"关键","source":""}]},{"id":"q0206","unit":"u020","page":25,"subtitle":"二、事物的永恒发展","text":"发展的实质是{{b0371}}的产生和{{b0372}}的灭亡。","blanks":[{"id":"b0371","answer":"新事物","source":""},{"id":"b0372","answer":"旧事物","source":""}]},{"id":"q0207","unit":"u021","page":26,"subtitle":"","text":"一、对立统一规律：揭示了事物发展的{{b0373}}和{{b0374}}","blanks":[{"id":"b0373","answer":"源泉","source":""},{"id":"b0374","answer":"动力","source":""}]},{"id":"q0208","unit":"u021","page":26,"subtitle":"","text":"对立统一规律又称{{b0375}}规律，是唯物辩证法的实质和核心。","blanks":[{"id":"b0375","answer":"矛盾","source":""}]},{"id":"q0209","unit":"u021","page":26,"subtitle":"","text":"1.矛盾的基本属性：矛盾的{{b0376}}和{{b0377}}","blanks":[{"id":"b0376","answer":"同一性","source":""},{"id":"b0377","answer":"斗争性","source":""}]},{"id":"q0210","unit":"u021","page":26,"subtitle":"","text":"矛盾的{{b0378}}是指矛盾双方相互依存、相互贯通的性质和趋势。","blanks":[{"id":"b0378","answer":"同一性","source":""}]},{"id":"q0211","unit":"u021","page":26,"subtitle":"","text":"矛盾的{{b0379}}是指矛盾双方相互排斥、相互分离的性质和趋势。","blanks":[{"id":"b0379","answer":"斗争性","source":""}]},{"id":"q0212","unit":"u021","page":26,"subtitle":"2.矛盾的普遍性和特殊性","text":"（1）矛盾的{{b0380}}性","blanks":[{"id":"b0380","answer":"普遍","source":""}]},{"id":"q0213","unit":"u021","page":26,"subtitle":"2.矛盾的普遍性和特殊性","text":"方法论：坚持{{b0381}}，全面地看问题，一分为二地看问题。","blanks":[{"id":"b0381","answer":"矛盾分析法","source":""}]},{"id":"q0214","unit":"u021","page":26,"subtitle":"2.矛盾的普遍性和特殊性","text":"（2）矛盾的{{b0382}}性","blanks":[{"id":"b0382","answer":"特殊","source":""}]},{"id":"q0215","unit":"u021","page":26,"subtitle":"2.矛盾的普遍性和特殊性","text":"原理：具体事物的矛盾及每一矛盾的不同方面各有其特点。矛盾的{{b0383}}规定了一事物区别于其他事物的本质。","blanks":[{"id":"b0383","answer":"特殊性","source":""}]},{"id":"q0216","unit":"u021","page":26,"subtitle":"2.矛盾的普遍性和特殊性","text":"方法论：做到{{b0384}}。","blanks":[{"id":"b0384","answer":"具体问题具体分析","source":""}]},{"id":"q0217","unit":"u021","page":26,"subtitle":"（3）矛盾的普遍性和特殊性的关系","text":"矛盾的普遍性即矛盾的{{b0385}}，矛盾的特殊性即矛盾的{{b0386}}。矛盾的{{b0387}}是无条件的、绝对的，矛盾的{{b0388}}是有条件的、相对的。","blanks":[{"id":"b0385","answer":"共性","source":""},{"id":"b0386","answer":"个性","source":""},{"id":"b0387","answer":"共性","source":""},{"id":"b0388","answer":"个性","source":""}]},{"id":"q0218","unit":"u021","page":26,"subtitle":"（3）矛盾的普遍性和特殊性的关系","text":"{{b0389}}寓于{{b0390}}之中，特殊性又都是包含着普遍性的特殊性。","blanks":[{"id":"b0389","answer":"普遍性","source":""},{"id":"b0390","answer":"特殊性","source":""}]},{"id":"q0219","unit":"u021","page":26,"subtitle":"（2）矛盾主要方面和次要方面","text":"主要方面：居于支配地位的方面。事物的{{b0391}}由主要矛盾的主要方面决定。","blanks":[{"id":"b0391","answer":"性质","source":""}]},{"id":"q0220","unit":"u021","page":26,"subtitle":"（3）坚持两点论和重点论的统一","text":"{{b0392}}就是全面论。在研究复杂事物的发展过程时，既要看到主要矛盾，又要看到次要矛盾；在研究某一矛盾时，既要看到矛盾的主要方面，又要看到矛盾的次要方面。","blanks":[{"id":"b0392","answer":"两点论","source":""}]},{"id":"q0221","unit":"u021","page":26,"subtitle":"（3）坚持两点论和重点论的统一","text":"{{b0393}}就是分清矛盾主次抓重点。要求在研究复杂事物的发展过程时，要着重地把握它的主要矛盾；在分析某一矛盾时，要着重地把握它的主要方面。","blanks":[{"id":"b0393","answer":"重点论","source":""}]},{"id":"q0222","unit":"u021","page":27,"subtitle":"（2）内因和外因的辩证关系","text":"{{b0394}}是事物发展变化的{{b0395}}，是第一位的原因。{{b0396}}是事物发展变化的条件，是第二位的原因。{{b0397}}通过{{b0398}}而起作用。","blanks":[{"id":"b0394","answer":"内因","source":""},{"id":"b0395","answer":"根据","source":""},{"id":"b0396","answer":"外因","source":""},{"id":"b0397","answer":"外因","source":""},{"id":"b0398","answer":"内因","source":""}]},{"id":"q0223","unit":"u021","page":27,"subtitle":"（2）内因和外因的辩证关系","text":"二、量变质变规律：揭示了事物发展的{{b0399}}和{{b0400}}","blanks":[{"id":"b0399","answer":"形式","source":""},{"id":"b0400","answer":"状态","source":""}]},{"id":"q0224","unit":"u021","page":27,"subtitle":"1.量变和质变的区分标志","text":"（1）区分量变和质变的根本标志是事物变化是否超出{{b0401}}的范围。","blanks":[{"id":"b0401","answer":"度","source":""}]},{"id":"q0225","unit":"u021","page":27,"subtitle":"2.量变和质变的辩证关系","text":"（1）{{b0402}}是{{b0403}}的必要准备。","blanks":[{"id":"b0402","answer":"量变","source":""},{"id":"b0403","answer":"质变","source":""}]},{"id":"q0226","unit":"u021","page":27,"subtitle":"2.量变和质变的辩证关系","text":"（2）{{b0404}}是{{b0405}}的必然结果，量变达到一定{{b0406}}必然引起质变。","blanks":[{"id":"b0404","answer":"质变","source":""},{"id":"b0405","answer":"量变","source":""},{"id":"b0406","answer":"程度","source":""}]},{"id":"q0227","unit":"u021","page":27,"subtitle":"2.量变和质变的辩证关系","text":"三、否定之否定规律：揭示了事物发展的{{b0407}}和{{b0408}}","blanks":[{"id":"b0407","answer":"方向","source":""},{"id":"b0408","answer":"道路","source":""}]},{"id":"q0228","unit":"u021","page":27,"subtitle":"1.辩证的否定观","text":"（1）辩证的否定是事物的{{b0409}}否定。","blanks":[{"id":"b0409","answer":"自我","source":""}]},{"id":"q0229","unit":"u021","page":27,"subtitle":"（2）辩证的否定是事物发展和联系的环节。","text":"（3）辩证的否定的实质是“{{b0410}}”，即既克服又保留。","blanks":[{"id":"b0410","answer":"扬弃","source":""}]},{"id":"q0230","unit":"u021","page":27,"subtitle":"2.事物发展的辩证否定的过程——否定之否定","text":"（1）事物的发展表现为{{b0411}}上升和{{b0412}}前进的过程。","blanks":[{"id":"b0411","answer":"螺旋式","source":""},{"id":"b0412","answer":"波浪式","source":""}]},{"id":"q0231","unit":"u021","page":27,"subtitle":"2.事物发展的辩证否定的过程——否定之否定","text":"（2）事物的发展过程是{{b0413}}和{{b0414}}的统一。","blanks":[{"id":"b0413","answer":"前进性","source":""},{"id":"b0414","answer":"曲折性","source":""}]},{"id":"q0232","unit":"u022","page":27,"subtitle":"1.实践决定认识","text":"（1）实践是认识的{{b0415}}。","blanks":[{"id":"b0415","answer":"来源","source":""}]},{"id":"q0233","unit":"u022","page":27,"subtitle":"1.实践决定认识","text":"（2）实践是认识发展的{{b0416}}。","blanks":[{"id":"b0416","answer":"动力","source":""}]},{"id":"q0234","unit":"u022","page":27,"subtitle":"2.认识反作用于实践","text":"{{b0417}}的认识对实践起着积极的促进作用；{{b0418}}的认识则对实践起消极的阻碍作用，甚至导致实践的失败。","blanks":[{"id":"b0417","answer":"正确","source":""},{"id":"b0418","answer":"错误","source":""}]},{"id":"q0235","unit":"u023","page":28,"subtitle":"","text":"社会历史发展的基本规律指社会的{{b0419}}矛盾运动，社会{{b0420}}矛盾包括生产力与生产关系的矛盾、经济基础与上层建筑的矛盾。社会{{b0421}}矛盾是社会历史发展的{{b0422}}动力。","blanks":[{"id":"b0419","answer":"基本","source":""},{"id":"b0420","answer":"基本","source":""},{"id":"b0421","answer":"基本","source":""},{"id":"b0422","answer":"根本","source":""}]},{"id":"q0236","unit":"u023","page":28,"subtitle":"1.生产力","text":"生产力的基本要素包括劳动者、劳动资料、劳动对象。其中，{{b0423}}起主导作用。{{b0424}}是劳动资料的主要内容，是生产力发展水平的客观标志。{{b0425}}是第一生产力，是先进生产力的集中体现和主要标志。","blanks":[{"id":"b0423","answer":"劳动者","source":""},{"id":"b0424","answer":"生产工具","source":""},{"id":"b0425","answer":"科学技术","source":""}]},{"id":"q0237","unit":"u023","page":28,"subtitle":"2.生产关系","text":"生产关系由生产资料的{{b0426}}形式、人们在生产中的地位和相互关系、产品{{b0427}}形式等方面构成。{{b0428}}是生产关系的基础，是区分社会制度的根本标志。","blanks":[{"id":"b0426","answer":"所有制","source":""},{"id":"b0427","answer":"分配","source":""},{"id":"b0428","answer":"生产资料所有制","source":""}]},{"id":"q0238","unit":"u023","page":28,"subtitle":"3.生产力和生产关系的辩证关系及其矛盾运动","text":"生产力{{b0429}}生产关系；生产关系对生产力具有能动的反作用；生产力与生产关系的矛盾运动推动社会发展。","blanks":[{"id":"b0429","answer":"决定","source":""}]},{"id":"q0239","unit":"u023","page":28,"subtitle":"1.经济基础","text":"经济基础是指由社会一定发展阶段的生产力所决定的生产关系的总和。经济基础中具有决定意义的是{{b0430}}。","blanks":[{"id":"b0430","answer":"生产资料所有制","source":""}]},{"id":"q0240","unit":"u023","page":28,"subtitle":"2.上层建筑","text":"观念上层建筑：包括政治法律思想、道德、艺术、{{b0431}}、{{b0432}}等意识形态。","blanks":[{"id":"b0431","answer":"宗教","source":""},{"id":"b0432","answer":"哲学","source":""}]},{"id":"q0241","unit":"u023","page":28,"subtitle":"2.上层建筑","text":"在整个上层建筑中，{{b0433}}上层建筑居主导地位，国家政权是核心。","blanks":[{"id":"b0433","answer":"政治","source":""}]},{"id":"q0242","unit":"u023","page":28,"subtitle":"3.经济基础和上层建筑的辩证关系及其矛盾运动","text":"经济基础{{b0434}}上层建筑；上层建筑反作用于经济基础；经济基础与上层建筑的矛盾运动推动社会发展。","blanks":[{"id":"b0434","answer":"决定","source":""}]},{"id":"q0243","unit":"u023","page":29,"subtitle":"三、社会基本矛盾的关系","text":"社会基本矛盾中{{b0435}}和{{b0436}}的矛盾是更根本的，它决定{{b0437}}和{{b0438}}的矛盾；而生产力和生产关系矛盾的解决又依赖于经济基础和上层建筑矛盾的解决。","blanks":[{"id":"b0435","answer":"生产力","source":""},{"id":"b0436","answer":"生产关系","source":""},{"id":"b0437","answer":"经济基础","source":""},{"id":"b0438","answer":"上层建筑","source":""}]},{"id":"q0244","unit":"u024","page":29,"subtitle":"1.两种历史观的对立","text":"{{b0439}}史观把历史发展的原因归于少数统治者或社会精英的创造，属于历史唯心主义观点。","blanks":[{"id":"b0439","answer":"英雄","source":""}]},{"id":"q0245","unit":"u024","page":29,"subtitle":"1.两种历史观的对立","text":"{{b0440}}史观认为对历史发展起决定作用的是人民群众，但是也{{b0441}}个人尤其是少数历史人物的作用，属于历史唯物主义观点。","blanks":[{"id":"b0440","answer":"群众","source":""},{"id":"b0441","answer":"承认","source":""}]},{"id":"q0246","unit":"u024","page":29,"subtitle":"2.人民群众在创造历史过程中的决定作用","text":"人民群众是社会历史的主体，是历史的{{b0442}}，对社会发展起决定性作用。","blanks":[{"id":"b0442","answer":"创造者","source":""}]},{"id":"q0247","unit":"u025","page":30,"subtitle":"1.关于经济工作的新认识","text":"必须坚持投资于{{b0443}}和投资于{{b0444}}紧密结合。","blanks":[{"id":"b0443","answer":"物","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7050963.htm"},{"id":"b0444","answer":"人","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7050963.htm"}]},{"id":"q0248","unit":"u025","page":30,"subtitle":"2.2026年经济工作的重点任务","text":"一是坚持{{b0445}}主导，建设强大国内市场；","blanks":[{"id":"b0445","answer":"内需","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7050963.htm"}]},{"id":"q0249","unit":"u025","page":30,"subtitle":"2.2026年经济工作的重点任务","text":"二是坚持{{b0446}}驱动，加紧培育壮大新动能；","blanks":[{"id":"b0446","answer":"创新","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7050963.htm"}]},{"id":"q0250","unit":"u025","page":30,"subtitle":"2.2026年经济工作的重点任务","text":"六是坚持“{{b0447}}”引领，推动全面绿色转型；","blanks":[{"id":"b0447","answer":"双碳","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7050963.htm"}]},{"id":"q0251","unit":"u025","page":30,"subtitle":"2.2026年经济工作的重点任务","text":"七是坚持{{b0448}}为大，努力为人民群众多办实事；","blanks":[{"id":"b0448","answer":"民生","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7050963.htm"}]},{"id":"q0252","unit":"u025","page":30,"subtitle":"3.2026年经济工作的关键着力点","text":"围绕做强{{b0449}}大循环，拓展内需增长新空间；","blanks":[{"id":"b0449","answer":"国内","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7050963.htm"}]},{"id":"q0253","unit":"u025","page":30,"subtitle":"3.2026年经济工作的关键着力点","text":"围绕发展新质生产力，推动{{b0450}}创新和{{b0451}}创新深度融合；","blanks":[{"id":"b0450","answer":"科技","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7050963.htm"},{"id":"b0451","answer":"产业","source":"https://www.gov.cn/yaowen/liebiao/202512/content_7050963.htm"}]},{"id":"q0254","unit":"u026","page":31,"subtitle":"（一）2025年工作成就","text":"国内生产总值增长{{b0452}}%，总量达到{{b0453}}.19万亿元。实施学前{{b0454}}年免费教育政策、惠及1400万儿童，全面实施{{b0455}}补贴制度、惠及3000多万婴幼儿。粮食产量达到1.{{b0456}}3万亿斤。","blanks":[{"id":"b0452","answer":"5","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0453","answer":"140","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0454","answer":"一","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0455","answer":"育儿","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0456","answer":"4","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0255","unit":"u026","page":31,"subtitle":"（一）2025年工作成就","text":"人工智能、生物医药、机器人、量子科技等研发应用走在世界前列，芯片自主研发有了新突破，天问{{b0457}}号开启“追星”之旅，北斗规模应用全面拓展，{{b0458}}水电工程开工建设，首艘国产{{b0459}}航母{{b0460}}正式入列，国产大模型引领全球开源生态。","blanks":[{"id":"b0457","answer":"二","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0458","answer":"雅下","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0459","answer":"电磁弹射型","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0460","answer":"福建舰","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0256","unit":"u026","page":31,"subtitle":"（二）“十四五”时期工作成就","text":"国内生产总值连续跨越110万亿元、120万亿元、130万亿元、140万亿元台阶，年均增长5.4%、明显高于全球平均增速。全社会研发经费投入年均增长10%。{{b0461}}增加值规模连续16年保持全球第一，{{b0462}}领域外资准入限制措施全部取消。货物贸易第{{b0463}}大国地位更加巩固。森林覆盖率提高到{{b0464}}%以上，成为全球森林资源增长最快最多的国家，构建起全球最大、发展最快的可再生能源体系。","blanks":[{"id":"b0461","answer":"制造业","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0462","answer":"制造业","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0463","answer":"一","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0464","answer":"25","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0257","unit":"u026","page":31,"subtitle":"（三）2026年政策取向","text":"坚持稳中求进、提质增效，发挥存量政策和增量政策集成效应，加大{{b0465}}周期和{{b0466}}周期调节力度，切实提升宏观经济治理效能。","blanks":[{"id":"b0465","answer":"逆","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0466","answer":"跨","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0258","unit":"u026","page":31,"subtitle":"（三）2026年政策取向","text":"1.继续实施更加积极的{{b0467}}政策。今年赤字率拟按{{b0468}}%左右安排，赤字规模比上年{{b0469}}2300亿元。今年财政支出继续保持相当规模，要持续用力优化支出结构，更加注重支持提振消费、投资于{{b0470}}、保障民生等方面，提高财政资金使用效益。中央财政{{b0471}}对地方财力性转移支付规模，开展整合统筹使用转移支付资金试点，增强地方自主财力和统筹能力。各级政府要更好“当家理财”，建立健全增收节支机制，强化预算约束，{{b0472}}一般性支出，坚决落实过紧日子的要求。","blanks":[{"id":"b0467","answer":"财政","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0468","answer":"4","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0469","answer":"增加","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0470","answer":"人","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0471","answer":"增加","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0472","answer":"严控","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0259","unit":"u026","page":31,"subtitle":"（三）2026年政策取向","text":"2.继续实施适度宽松的{{b0473}}政策。把促进经济稳定增长、物价合理{{b0474}}作为货币政策的重要考量，灵活高效运用{{b0475}}准{{b0476}}息等多种政策工具，保持流动性充裕，使社会融资规模、货币供应量增长同经济增长、价格总水平预期目标相匹配。畅通货币政策传导机制，引导金融机构加力支持扩大{{b0477}}、科技创新、{{b0478}}企业等重点领域。规范信贷市场经营行为，{{b0479}}融资中间费用，促进社会综合融资成本低位运行。","blanks":[{"id":"b0473","answer":"货币","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0474","answer":"回升","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0475","answer":"降","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0476","answer":"降","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0477","answer":"内需","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0478","answer":"中小微","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0479","answer":"降低","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0260","unit":"u026","page":32,"subtitle":"（三）2026年政策取向","text":"3.强化改革举措与宏观政策协同。增强宏观政策取向一致性和有效性，将各类经济政策和非经济政策、存量政策和增量政策纳入宏观政策取向{{b0480}}评估。","blanks":[{"id":"b0480","answer":"一致性","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0261","unit":"u026","page":32,"subtitle":"（四）2026年政府工作任务","text":"1.着力建设强大国内市场。坚持{{b0481}}主导，统筹促消费和扩投资，拓展内需增长新空间，更好发挥我国超大规模市场优势。","blanks":[{"id":"b0481","answer":"内需","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0262","unit":"u026","page":32,"subtitle":"（四）2026年政府工作任务","text":"（1）深入实施提振消费专项行动。制定实施城乡居民增收计划，在促进低收入群体增收、增加居民{{b0482}}收入、完善薪酬和社保制度等方面推出一批务实举措。促进{{b0483}}消费扩容升级，支持消费品以旧换新，优化政策实施机制。扩大个人消费贷款和服务业经营主体贷款{{b0484}}息政策支持领域，{{b0485}}贴息上限，延长实施期限。支持{{b0486}}的地方推广中小学春秋假，落实职工带薪错峰休假制度。","blanks":[{"id":"b0482","answer":"财产性","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0483","answer":"商品","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0484","answer":"贴","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0485","answer":"提高","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0486","answer":"有条件","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0263","unit":"u026","page":32,"subtitle":"（四）2026年政府工作任务","text":"（2）充分挖掘释放有效投资潜力。增强{{b0487}}主导的有效投资增长动力，提高{{b0488}}类政府投资比重。单列并提高用于{{b0489}}建设的地方政府专项债券额度，继续向投资项目准备充分、资金用得好的地方倾斜。","blanks":[{"id":"b0487","answer":"市场","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0488","answer":"民生","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0489","answer":"项目","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0264","unit":"u026","page":32,"subtitle":"（四）2026年政府工作任务","text":"2.加紧培育壮大新动能。坚持把发展经济的着力点放在{{b0490}}经济上，因地制宜发展新质生产力，建设现代化产业体系。","blanks":[{"id":"b0490","answer":"实体","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0265","unit":"u026","page":32,"subtitle":"（1）优化提升传统产业。","text":"（2）培育壮大新兴产业和未来产业。实施产业创新工程，鼓励{{b0491}}带头开放应用场景，打造集成电路、航空航天、生物医药、低空经济等{{b0492}}支柱产业。建立未来产业投入增长和风险分担机制，培育发展未来能源、量子科技、生物制造、{{b0493}}智能、脑机接口、6G等未来产业。高效用好国家创业投资引导基金，大力发展创业投资、天使投资，{{b0494}}投资基金要带头做耐心资本，推动更多初创企业加快成长为科技领军企业。","blanks":[{"id":"b0491","answer":"央企国企","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0492","answer":"新兴","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0493","answer":"具身","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0494","answer":"政府","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0266","unit":"u026","page":32,"subtitle":"3.加快高水平科技自立自强。","text":"（1）加强原始创新和关键核心技术攻关。继续{{b0495}}基础研究投入比重，加大长期{{b0496}}支持。","blanks":[{"id":"b0495","answer":"提高","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0496","answer":"稳定","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0267","unit":"u026","page":32,"subtitle":"3.加快高水平科技自立自强。","text":"（2）推动科技创新和产业创新深度融合。建设北京（京津冀）、上海（长三角）、粤港澳大湾区国际科技创新中心，打造世界级科技创新策源地。强化{{b0497}}创新主体地位，支持科技领军企业牵头组建创新联合体，提高承担国家重大科技项目比例。","blanks":[{"id":"b0497","answer":"企业","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0268","unit":"u026","page":32,"subtitle":"4.持续深化重点领域改革。","text":"（1）纵深推进全国统一大市场建设。完善统计、财税、考核等制度，规范地方政府经济促进行为，出台地方政府招商引资鼓励和禁止事项清单，{{b0498}}税收优惠、财政补贴政策。加强反垄断、反不正当竞争，强化公平竞争审查{{b0499}}约束，综合运用产能调控、标准引领、价格执法、质量监管等手段，深入{{b0500}}“内卷式”竞争，营造良好市场生态。深化要素{{b0501}}配置综合改革试点，将更多符合条件的地区纳入试点范围。","blanks":[{"id":"b0498","answer":"规范","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0499","answer":"刚性","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0500","answer":"整治","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0501","answer":"市场化","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0269","unit":"u026","page":33,"subtitle":"4.持续深化重点领域改革。","text":"（2）推进财税金融体制改革。加大财政资源和预算统筹力度，{{b0502}}国有资本收益收取比例。调整优化消费税征税范围、税率，并推进部分品目征收环节后移。规范金融机构竞争秩序，深入推进地方中小金融机构{{b0503}}量提质。持续深化资本市场投融资综合改革，进一步健全中长期资金入市机制，完善投资者保护制度，拓展私募股权和创投基金退出渠道，提高{{b0504}}融资、股权融资比重。","blanks":[{"id":"b0502","answer":"提高","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0503","answer":"减","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0504","answer":"直接","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0270","unit":"u026","page":33,"subtitle":"4.持续深化重点领域改革。","text":"5.进一步扩大高水平对外开放。坚持合作共赢，稳步扩大{{b0505}}开放，拓展国际循环，以开放促改革促发展。","blanks":[{"id":"b0505","answer":"制度型","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0271","unit":"u026","page":33,"subtitle":"4.持续深化重点领域改革。","text":"（1）积极扩大自主开放。以{{b0506}}为重点扩大市场准入和开放领域，进一步扩大增值电信、生物技术、外商独资医院等领域开放试点，有序扩大数字领域开放，{{b0507}}跨境服务贸易负面清单。优化自由贸易试验区布局范围、提升创新引领发展能级，扎实推进{{b0508}}自由贸易港建设。","blanks":[{"id":"b0506","answer":"服务业","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0507","answer":"压减","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0508","answer":"海南","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0272","unit":"u026","page":33,"subtitle":"（2）推动外贸稳规模优结构。引导企业优化全球市场布局，推进贸易投资一体化、内外贸一体化发展。","text":"（3）扩大双向投资合作。深化外商投资促进体制机制改革，保障外资企业国民待遇，实施新版鼓励外商投资产业目录，促进外资境内再投资、扩大{{b0509}}生产。","blanks":[{"id":"b0509","answer":"本地化","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0273","unit":"u026","page":33,"subtitle":"6.推动新型城镇化和区域协调发展。深入实施区域协调发展战略、区域重大战略、主体功能区战略和新型城镇化战略，构建优势互补、高质量发展的区域经济布局和国土空间体系。","text":"（1）深入推进以人为本的新型城镇化。科学有序推进农业转移人口市民化，因地制宜放宽在{{b0510}}参加中考报名条件，进一步完善“人地钱”挂钩政策。坚持城市内涵式发展，优化现代化城市体系。","blanks":[{"id":"b0510","answer":"流入地","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0274","unit":"u026","page":33,"subtitle":"6.推动新型城镇化和区域协调发展。深入实施区域协调发展战略、区域重大战略、主体功能区战略和新型城镇化战略，构建优势互补、高质量发展的区域经济布局和国土空间体系。","text":"（2）不断增强区域发展协调性。支持{{b0511}}、长三角、粤港澳大湾区打造世界级城市群。加大{{b0512}}政策支持力度，深入推进兴边富民行动，促进革命老区、民族地区、边疆地区、资源枯竭城市等振兴发展。","blanks":[{"id":"b0511","answer":"京津冀","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0512","answer":"差异化","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0275","unit":"u026","page":33,"subtitle":"7.更大力度保障和改善民生。坚持民生为大，加强普惠性、基础性、兜底性民生建设，努力为人民群众多办实事。","text":"（1）促进高质量充分就业。实施稳岗扩容提质行动，支持{{b0513}}密集型行业企业稳定岗位。","blanks":[{"id":"b0513","answer":"劳动","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0276","unit":"u026","page":34,"subtitle":"7.更大力度保障和改善民生。坚持民生为大，加强普惠性、基础性、兜底性民生建设，努力为人民群众多办实事。","text":"（2）推动教育公平与质量提升。推动基础教育扩优提质，统筹{{b0514}}教育优质均衡发展、{{b0515}}教育优质普惠发展，完善免费学前教育政策，增加{{b0516}}高中学位供给。","blanks":[{"id":"b0514","answer":"义务","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0515","answer":"学前","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0516","answer":"普通","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0277","unit":"u026","page":34,"subtitle":"7.更大力度保障和改善民生。坚持民生为大，加强普惠性、基础性、兜底性民生建设，努力为人民群众多办实事。","text":"（3）强化基本医疗卫生服务。健全医疗、医保、医药{{b0517}}发展和治理机制，深化以{{b0518}}为导向的公立医院改革，加强县区、基层医疗机构运行保障。健全多层次医疗保障体系，稳步推动基本医疗保险{{b0519}}统筹。","blanks":[{"id":"b0517","answer":"协同","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0518","answer":"公益性","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0519","answer":"省级","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0278","unit":"u026","page":34,"subtitle":"7.更大力度保障和改善民生。坚持民生为大，加强普惠性、基础性、兜底性民生建设，努力为人民群众多办实事。","text":"（4）加强社会保障和服务。完善并落实基本养老保险{{b0520}}统筹制度，扩大失业、工伤保险覆盖面，稳妥有序推进职业伤害保障试点扩围，健全社保关系转移接续政策。加强初婚初育家庭住房保障，支持多子女家庭{{b0521}}住房需求。","blanks":[{"id":"b0520","answer":"全国","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0521","answer":"改善性","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0279","unit":"u026","page":34,"subtitle":"8.加强重点领域风险防范化解和安全能力建设。","text":"（1）着力稳定房地产市场。因城施策控增量、去库存、优供给，探索多渠道盘活存量商品房，鼓励收购存量商品房重点用于{{b0522}}性住房等。进一步发挥“保交房”的{{b0523}}名单制度作用，防范债务违约风险。","blanks":[{"id":"b0522","answer":"保障","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"},{"id":"b0523","answer":"白","source":"https://www.news.cn/20260313/21f91e772c194b0692e6684bf72d58e9/c.html"}]},{"id":"q0280","unit":"u027","page":34,"subtitle":"","text":"到{{b0524}}年建成健康中国，是中共中央作出的一项战略决策。“十五五”是实现这一目标的关键时期，我们必须统筹谋划、加紧推进，力求取得{{b0525}}进展。","blanks":[{"id":"b0524","answer":"2035","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"},{"id":"b0525","answer":"决定性","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"}]},{"id":"q0281","unit":"u027","page":34,"subtitle":"","text":"第一，坚持从我国国情出发推动卫生与健康事业发展。我国是社会主义国家，是人口规模巨大、城乡区域{{b0526}}仍然较大的发展中国家，这决定我们必须坚持党对卫生与健康工作的领导，坚持人民至上、生命至上，坚持健康优先发展战略，坚持基本医疗卫生事业的{{b0527}}，走中国特色卫生与健康发展道路。","blanks":[{"id":"b0526","answer":"差距","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"},{"id":"b0527","answer":"公益性","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"}]},{"id":"q0282","unit":"u027","page":34,"subtitle":"","text":"中共中央明确提出新时代卫生与健康工作方针，即以{{b0528}}为重点，以改革创新为动力，{{b0529}}为主，中西医并重，把健康融入所有政策，人民共建共享。","blanks":[{"id":"b0528","answer":"基层","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"},{"id":"b0529","answer":"预防","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"}]},{"id":"q0283","unit":"u027","page":35,"subtitle":"","text":"第二，突出重点推进健康中国建设。要继续优化体系布局，实施医疗卫生强基工程，促进{{b0530}}诊疗，加强县区和基层医疗卫生机构运行保障。","blanks":[{"id":"b0530","answer":"分级","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"}]},{"id":"q0284","unit":"u027","page":35,"subtitle":"","text":"第三，为健康中国建设提供有力保障。要健全党委统一领导、党政齐抓共管的工作格局，将健康理念融入公共政策制定实施的全过程。要深化公立医院改革和医保支付方式改革，健全药品价格形成机制、优化药品和医用耗材{{b0531}}采购政策，提高医保资金使用效率，完善医疗、医保、医药协同发展和治理机制。","blanks":[{"id":"b0531","answer":"集中","source":"http://politics.people.com.cn/n1/2026/0731/c1024-40771831.html"}]},{"id":"q0285","unit":"u028","page":35,"subtitle":"","text":"2025年，党中央深入推进党风廉政建设和反腐败斗争，取得显著成效。强化政治监督，深化政治巡视，有力保障党中央重大决策部署贯彻落实；扎实开展深入贯彻{{b0532}}精神学习教育，推动全党进一步改作风树新风；保持反腐败高压态势，推进风腐同查同治，深化整治群众身边不正之风和腐败问题，着力铲除腐败滋生的土壤和条件。","blanks":[{"id":"b0532","answer":"中央八项规定","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0286","unit":"u028","page":35,"subtitle":"1.深刻把握实现“十五五”时期目标任务对维护党的团结统一提出的更高要求，坚定不移推动全党拥护“两个确立”、做到“两个维护”；","text":"2.深刻把握实现“十五五”时期目标任务对把权力关进{{b0533}}笼子提出的更高要求，坚定不移强化制度治权、依规用权；","blanks":[{"id":"b0533","answer":"制度","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0287","unit":"u028","page":35,"subtitle":"4.深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业。","text":"第一，强化{{b0534}}监督，推动全党凝心聚力实现“十五五”时期目标任务。","blanks":[{"id":"b0534","answer":"政治","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0288","unit":"u028","page":35,"subtitle":"4.深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业。","text":"第二，强化正风肃纪，巩固拓展深入贯彻中央八项规定精神学习教育成果。持续狠刹{{b0535}}主义、{{b0536}}之风，对违规吃喝、违规收送礼品礼金等易发多发问题深化整治；对以调研考察、开展党建活动、培训的名义搞公款旅游，变相公款出国（境）旅游等问题严肃查处；对借民生项目违规建设楼堂馆所等新动向密切关注并纠治。持续整治{{b0537}}主义、{{b0538}}主义，坚决纠治临近换届等待观望不作为，换届后急功近利“翻烧饼”、搞“政绩工程”等突出问题，推动为基层减负。","blanks":[{"id":"b0535","answer":"享乐","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0536","answer":"奢靡","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0537","answer":"形式","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0538","answer":"官僚","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0289","unit":"u028","page":36,"subtitle":"4.深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业。","text":"第三，强化标本兼治，用好一体推进不敢腐、不能腐、不想腐战略抓手。以保持高压震慑强化{{b0539}}腐，坚持猛药去疴、重典治乱。以加强监督制约强化{{b0540}}腐，健全授权用权制权相统一、清晰透明可追溯的制度机制。以深化廉洁教育强化{{b0541}}腐，不断塑造清正廉洁的思想品格、廉洁奉公的政德修养、廉洁自律的道德操守、崇廉拒腐的社会风尚。以完善体制机制促进一体推进，健全党委统一领导下的反腐败工作机制。","blanks":[{"id":"b0539","answer":"不敢","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0540","answer":"不能","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0541","answer":"不想","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0290","unit":"u028","page":36,"subtitle":"4.深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业。","text":"第四，强化执纪执法为民，持续深化群众身边不正之风和腐败问题集中整治。推动{{b0542}}级主战场持续深化整治工作，发挥{{b0543}}监督作用，提升基层监督能力。","blanks":[{"id":"b0542","answer":"县","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0543","answer":"群众","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0291","unit":"u028","page":36,"subtitle":"4.深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业。","text":"第五，强化政治巡视，增强巡视监督震慑力、穿透力、推动力。深化巡视巡察上下联动，加强对省区市{{b0544}}、中央单位内部{{b0545}}、对村{{b0546}}工作指导督导。","blanks":[{"id":"b0544","answer":"巡视","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0545","answer":"巡视","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"},{"id":"b0546","answer":"巡察","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7054741.htm"}]},{"id":"q0292","unit":"u029","page":36,"subtitle":"","text":"党的十八大以来，以习近平同志为核心的党中央围绕建设什么样的长期{{b0547}}的{{b0548}}政党、怎样建设长期{{b0549}}的{{b0550}}政党的重大时代课题，提出一系列新理念新思想新战略，形成习近平党建思想。","blanks":[{"id":"b0547","answer":"执政","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"},{"id":"b0548","answer":"马克思主义","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"},{"id":"b0549","answer":"执政","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"},{"id":"b0550","answer":"马克思主义","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0293","unit":"u029","page":36,"subtitle":"1.习近平党建思想的重要地位","text":"习近平党建思想丰富和发展了马克思主义建党学说，是坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合推进党的理论创新的重大成果，是党和人民实践经验和集体智慧的结晶，是习近平新时代中国特色社会主义思想的重要组成部分，为深入推进新时代党的建设新的伟大{{b0551}}提供了根本遵循和行动指南。","blanks":[{"id":"b0551","answer":"工程","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0294","unit":"u029","page":36,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持{{b0552}}是中国特色社会主义最本质的特征；","blanks":[{"id":"b0552","answer":"党的领导","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0295","unit":"u029","page":36,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持不忘{{b0553}}、牢记{{b0554}}是党的宗旨立场和价值取向；","blanks":[{"id":"b0553","answer":"初心","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"},{"id":"b0554","answer":"使命","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0296","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持以党的{{b0555}}建设为统领是新时代党的建设的根本要求；","blanks":[{"id":"b0555","answer":"政治","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0297","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持用党的创新理论凝心铸魂是党的思想建设的{{b0556}}任务；","blanks":[{"id":"b0556","answer":"根本","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072807.htm"}]},{"id":"q0298","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持健全上下贯通、执行有力的{{b0557}}体系是党的优势所在、力量所在；","blanks":[{"id":"b0557","answer":"组织","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0299","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持建设堪当民族复兴重任的高素质{{b0558}}队伍是关系党和国家事业的关键性问题；","blanks":[{"id":"b0558","answer":"干部","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0300","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持推进{{b0559}}建设常态化长效化是保持党同人民群众血肉联系的有效途径；","blanks":[{"id":"b0559","answer":"作风","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0301","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持用严明的{{b0560}}管全党治全党是全面从严治党的治本之策；","blanks":[{"id":"b0560","answer":"纪律","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0302","unit":"u029","page":37,"subtitle":"2.习近平党建思想的科学内涵","text":"坚持{{b0561}}治党、依规治党是全面从严治党的长远和根本之策；","blanks":[{"id":"b0561","answer":"制度","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0303","unit":"u029","page":37,"subtitle":"4.习近平党建思想的实践基础和理论渊源","text":"习近平党建思想是对新时代全面{{b0562}}实践经验的概括和凝练；习近平党建思想是对马克思主义建党学说的继承和发展；习近平党建思想是对中华优秀传统文化的传承和转化；习近平党建思想是对马克思主义政党经验教训的总结和镜鉴。","blanks":[{"id":"b0562","answer":"从严治党","source":"https://www.gov.cn/yaowen/liebiao/202606/content_7072157.htm"}]},{"id":"q0304","unit":"u030","page":38,"subtitle":"","text":"未来产业具有{{b0563}}、战略性、颠覆性等特点，需要科学谋划、全局统筹。","blanks":[{"id":"b0563","answer":"前瞻性","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0305","unit":"u030","page":38,"subtitle":"","text":"要综合考虑国家战略需求、技术成熟程度、要素支撑条件等因素，因地制宜、{{b0564}}发展。","blanks":[{"id":"b0564","answer":"错位","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0306","unit":"u030","page":38,"subtitle":"","text":"要充分发挥新型举国体制优势，坚持“{{b0565}}出题、{{b0566}}答题”，加大重点领域关键核心技术攻关力度，加强{{b0567}}研究战略性、前瞻性、体系化布局，加快科技成果转化应用。","blanks":[{"id":"b0565","answer":"产业","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"},{"id":"b0566","answer":"科技","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"},{"id":"b0567","answer":"基础","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0307","unit":"u030","page":38,"subtitle":"","text":"要发挥{{b0568}}主体作用，推动各类创新资源向企业集聚，大力培育核心技术领先、创新能力强的科技领军企业和高新技术企业，引领带动产业向前沿和高端领域迈进。","blanks":[{"id":"b0568","answer":"企业","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0308","unit":"u030","page":38,"subtitle":"","text":"要完善财税等政策，大力发展{{b0569}}金融，全方位做好人才培养、引进、使用工作，在全社会营造鼓励创新的浓厚氛围。","blanks":[{"id":"b0569","answer":"科技","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0309","unit":"u030","page":38,"subtitle":"","text":"要统筹发展和{{b0570}}，探索科学有效的监管方式，防范相关风险，确保既“放得活”又“管得好”。要深化国际合作，积极推动各方标准共建、规则共商、产业共促。","blanks":[{"id":"b0570","answer":"安全","source":"https://www.gov.cn/yaowen/liebiao/202601/content_7056737.htm"}]},{"id":"q0310","unit":"u031","page":38,"subtitle":"","text":"要站在统筹高质量发展和高水平安全的战略高度，充分认识做好防灾减灾救灾工作的重要性。做好防灾减灾救灾工作必须坚持党的全面领导，坚持人民至上、{{b0571}}至上，坚持尊重自然规律，坚持{{b0572}}为主，坚持改革创新，坚持系统观念，坚持社会共治。","blanks":[{"id":"b0571","answer":"生命","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"},{"id":"b0572","answer":"预防","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"}]},{"id":"q0311","unit":"u031","page":39,"subtitle":"","text":"降低灾害风险，减轻灾害损失，重在事前{{b0573}}。要坚持{{b0574}}管控，将安全韧性要求贯穿国土空间规划及各类建设规划之中。强化工程治理，合理提高重要城市和灾害多发地区关键基础设施设防标准，加紧补齐相关短板。要树牢{{b0575}}思维、{{b0576}}思维，不断提升大灾巨灾应对处置能力。健全大安全大应急框架下应急指挥机制，推进国家综合性消防救援队伍和国家区域应急救援中心建设。","blanks":[{"id":"b0573","answer":"预防","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"},{"id":"b0574","answer":"源头","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"},{"id":"b0575","answer":"底线","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"},{"id":"b0576","answer":"极限","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"}]},{"id":"q0312","unit":"u031","page":39,"subtitle":"","text":"基层是抵御自然灾害的第一线，抓基层、强基础的工作始终不能放松。要完善基层应急救援力量体系，强化应急场所建设和物资装备保障，抓好群测群防群治。各地区各有关部门要守土尽责，坚持统分结合、{{b0577}}衔接、上下联动，推动形成齐抓共管、协同配合的工作格局。树立和践行正确政绩观，坚决纠正重发展轻安全、重救灾轻预防等倾向。","blanks":[{"id":"b0577","answer":"防救","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078121.htm"}]},{"id":"q0313","unit":"u032","page":39,"subtitle":"","text":"高质量推进国防和军队现代化，是推进中国式现代化的应有之义。“十五五”时期，要深入贯彻新时代强军思想，强化{{b0578}}引领，推动基本实现国防和军队现代化取得{{b0579}}进展。","blanks":[{"id":"b0578","answer":"政治","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"},{"id":"b0579","answer":"决定性","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"}]},{"id":"q0314","unit":"u032","page":39,"subtitle":"","text":"{{b0580}}建军是人民军队立军之本，关乎国防和军队现代化建设方向和底色。要坚持和加强党对军队的绝对领导，全面落实新时代政治建军方略，加强理论武装，深化思想整风，打牢官兵听党话、跟党走的思想根基，确保枪杆子永远听党指挥。要深入推进反腐败斗争，健全重大项目监管体系，确保各项建设质量托底、能力托底、廉洁托底。","blanks":[{"id":"b0580","answer":"政治","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"}]},{"id":"q0315","unit":"u032","page":39,"subtitle":"","text":"高质量推进国防和军队现代化，根本指向和检验标准始终是{{b0581}}。要加强作战能力体系集成，搞好{{b0582}}检验评估，扎实推进练兵备战，有效捍卫国家主权、安全、发展利益。巩固提高{{b0583}}国家战略体系和能力，是高质量推进国防和军队现代化的必由之路。","blanks":[{"id":"b0581","answer":"战斗力","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"},{"id":"b0582","answer":"实战化","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"},{"id":"b0583","answer":"一体化","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7077129.htm"}]},{"id":"q0316","unit":"u033","page":40,"subtitle":"1.充分认识制定和实施五年规划是我们的重要政治优势","text":"（1）制定和实施五年规划是我们党治国理政一条重要经验，是中国特色社会主义制度一个重要政治优势：有利于实现党的领导、有利于集中力量办大事、有利于前瞻性把握{{b0584}}问题、有利于保持事业{{b0585}}。","blanks":[{"id":"b0584","answer":"战略","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0585","answer":"连续性","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"}]},{"id":"q0317","unit":"u033","page":40,"subtitle":"（1）扎扎实实建设现代化产业体系","text":"《建议》把建设{{b0586}}摆在“十五五”时期各项战略任务的第一条。这些年我国经济顶风破浪、保持强大韧性和活力，战略依托就是完整的产业体系。各地区各行业要找准定位，坚持{{b0587}}、绿色化、融合化方向，发挥{{b0588}}优势，形成上下游产业相互衔接、各展其长、同向发力的生动局面。要保持{{b0589}}合理比重，大力发展先进制造业。发展新质生产力是建设现代化产业体系的必然要求。要坚持因地制宜，不能一哄而上、跟风冒进，更不能喜新厌旧、把{{b0590}}产业优势丢掉。","blanks":[{"id":"b0586","answer":"现代化产业体系","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0587","answer":"智能化","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0588","answer":"比较","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0589","answer":"制造业","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0590","answer":"传统","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"}]},{"id":"q0318","unit":"u033","page":40,"subtitle":"（2）以加快构建新发展格局赢得战略主动","text":"要坚持以{{b0591}}大循环为主体，正确处理消费和投资、需求和供给的关系，坚持惠民生和促消费、投资于物和投资于人紧密结合，努力提高国民经济循环质量和效率，让{{b0592}}成为经济发展的主动力。要以做强{{b0593}}循环提升扩大高水平对外开放的自主性，以拓展{{b0594}}循环增强国内改革发展的活力，努力实现内外联通、互促共进。","blanks":[{"id":"b0591","answer":"国内","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0592","answer":"内需","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0593","answer":"国内","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"},{"id":"b0594","answer":"国际","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"}]},{"id":"q0319","unit":"u033","page":40,"subtitle":"（3）推动经济和社会协调发展","text":"促进社会发展，{{b0595}}是重点，要把发展经济和改善民生有机统一起来。","blanks":[{"id":"b0595","answer":"改善民生","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"}]},{"id":"q0320","unit":"u033","page":40,"subtitle":"（3）推动经济和社会协调发展","text":"{{b0596}}是发展的前提。必须统筹发展和安全，深入贯彻总体国家安全观，全力维护国家安全和社会稳定。","blanks":[{"id":"b0596","answer":"安全","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7067548.htm"}]},{"id":"q0321","unit":"u034","page":41,"subtitle":"","text":"要牢牢把握雄安新区作为北京{{b0597}}功能疏解集中承载地的首要功能定位，保持战略定力和历史耐心，进一步解放思想、开拓思路、加强协调、凝聚合力，以改革创新为引领增强内生发展动力，以要素资源合理集聚为重点激发新区活力，努力建设新时代创新高地和推动高质量发展样板。","blanks":[{"id":"b0597","answer":"非首都","source":"https://www.gov.cn/yaowen/liebiao/202603/content_7063552.htm"}]},{"id":"q0322","unit":"u034","page":41,"subtitle":"","text":"深入推进雄安新区高质量建设和发展，必须坚持新区功能定位，更加有力有序推进北京非首都功能疏解和承接。要积极稳妥{{b0598}}推进央企、高校、医院疏解项目建设，有序推进金融机构、科研院所、事业单位疏解，支持疏解单位更好发展。","blanks":[{"id":"b0598","answer":"分批","source":"https://www.gov.cn/yaowen/liebiao/202603/content_7063552.htm"}]},{"id":"q0323","unit":"u034","page":41,"subtitle":"","text":"雄安新区要以{{b0599}}为动力，推动科技创新与产业创新深度融合，因地制宜发展新质生产力，培育符合新区实际的现代化产业体系。要高水平建设雄安中关村科技园，推动更多科创成果转化落地。推动新兴产业和未来产业集群式发展，积极发展{{b0600}}服务业，支持{{b0601}}产业改造升级。","blanks":[{"id":"b0599","answer":"改革创新","source":"https://www.gov.cn/yaowen/liebiao/202603/content_7063552.htm"},{"id":"b0600","answer":"生产性","source":"https://www.gov.cn/yaowen/liebiao/202603/content_7063552.htm"},{"id":"b0601","answer":"传统","source":"https://www.gov.cn/yaowen/liebiao/202603/content_7063552.htm"}]},{"id":"q0324","unit":"u035","page":41,"subtitle":"","text":"第二，坚持以和平发展守护共同家园。两岸同胞要守护好、建设好这个共同家园，根本在于坚持“{{b0602}}”、反对“台独”，核心是认同两岸同属一个中国。","blanks":[{"id":"b0602","answer":"九二共识","source":"https://www.gov.cn/yaowen/liebiao/202604/content_7065151.htm"}]},{"id":"q0325","unit":"u036","page":42,"subtitle":"","text":"基础研究是整个科学体系的{{b0603}}，是所有技术问题的总机关。要以更大力度、更实举措加强基础研究，提升我国{{b0604}}创新能力，进一步打牢科技强国建设根基。","blanks":[{"id":"b0603","answer":"源头","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"},{"id":"b0604","answer":"原始","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"}]},{"id":"q0326","unit":"u036","page":42,"subtitle":"","text":"要加强统筹谋划和顶层设计，优化基础研究系统布局。坚持“{{b0605}}”战略导向，进一步明确基础研究的主攻方向和重点领域。强化国家科研机构、高水平研究型大学等引领作用，鼓励和规范发展新型研发机构，推动{{b0606}}主导的产学研用深度融合，打通基础研究、应用开发、成果转化的创新链条。加强基础学科建设，促进应用学科与基础学科协调发展。","blanks":[{"id":"b0605","answer":"四个面向","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"},{"id":"b0606","answer":"企业","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"}]},{"id":"q0327","unit":"u036","page":42,"subtitle":"","text":"要一体推进教育科技人才发展，全方位做好培养、引进、使用工作，壮大基础研究人才队伍。遵循人才成长规律，提高教育质量，源源不断培养基础研究后备力量。优化科教{{b0607}}育人机制，注重在科研一线发现和培养人才。坚持任务牵引、以老带新，大力扶持青年人才。弘扬科学家精神，加强科普宣传，激发青少年的想象力和探求欲，让投身基础研究成为更多青少年的人生追求。","blanks":[{"id":"b0607","answer":"协同","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"}]},{"id":"q0328","unit":"u036","page":42,"subtitle":"","text":"要加强对基础研究的支持保障。逐步提高基础研究经费占比，形成{{b0608}}化投入格局。体系化布局建设重大科技基础设施，建设智能化科研平台系统。健全符合基础研究特点的{{b0609}}评价体系，改善基础研究人员的工作和生活条件，营造开放包容、{{b0610}}失败的创新环境。","blanks":[{"id":"b0608","answer":"多元","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"},{"id":"b0609","answer":"分类","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"},{"id":"b0610","answer":"宽容","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7081174.htm"}]},{"id":"q0329","unit":"u037","page":42,"subtitle":"","text":"105年来，我们党团结带领全国各族人民不懈奋斗，创造了新民主主义革命、社会主义革命和建设、改革开放和社会主义现代化建设、{{b0611}}的伟大成就。105年不懈奋斗，从根本上改变了中国人民的前途命运，开辟了实现中华民族伟大复兴的正确道路，展示了马克思主义的强大生命力，深刻影响了世界历史进程，锻造了强大的中国共产党。","blanks":[{"id":"b0611","answer":"新时代中国特色社会主义","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0330","unit":"u037","page":43,"subtitle":"","text":"必须紧紧依靠{{b0612}}创造历史伟业，践行以{{b0613}}为中心的发展思想，充分激发亿万人民的积极性主动性创造性，统筹推进“五位一体”总体布局、协调推进“四个全面”战略布局，完整准确全面贯彻新发展理念，加快构建新发展格局，扎实推动高质量发展。","blanks":[{"id":"b0612","answer":"人民","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"},{"id":"b0613","answer":"人民","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0331","unit":"u037","page":43,"subtitle":"","text":"必须积极应对前进道路上的风险挑战，强化忧患意识、坚持{{b0614}}思维，发扬斗争精神、增强斗争本领，更好统筹国内国际两个大局，统筹发展和安全。","blanks":[{"id":"b0614","answer":"底线","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0332","unit":"u037","page":43,"subtitle":"","text":"必须持续推动构建人类命运共同体，高举和平、发展、合作、共赢旗帜，弘扬全人类共同价值，推动落实全球{{b0615}}倡议、全球安全倡议、全球文明倡议、全球{{b0616}}倡议，为世界和平与发展注入更多正能量。","blanks":[{"id":"b0615","answer":"发展","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"},{"id":"b0616","answer":"治理","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0333","unit":"u037","page":43,"subtitle":"","text":"必须持之以恒推进全面从严治党，全面贯彻新时代党建思想，健全全面从严治党体系，以党的{{b0617}}建设为统领加强党的各方面建设，坚决打好反腐败斗争攻坚战持久战总体战，不断增强党的政治领导力、思想引领力、群众组织力、社会号召力。","blanks":[{"id":"b0617","answer":"政治","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0334","unit":"u037","page":43,"subtitle":"","text":"{{b0618}}：30多年坚守在服务群众、化解矛盾的第一线，累计接待服务群众2万余人次，调解各类矛盾纠纷2500余件；总结形成“老马三十六策”等基层群众工作法，为加强和改进基层思想政治工作提供有益经验。","blanks":[{"id":"b0618","answer":"马善祥","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0335","unit":"u037","page":44,"subtitle":"","text":"{{b0619}}：担任村党支部书记多年，坚持发展为民、产业强村，开创“户户有股、人人劳动、家家分红”的集体经济发展模式，带领西辛庄村从贫困落后的黄河半滩区村发展为全国文明村、乡村振兴样板村。","blanks":[{"id":"b0619","answer":"李连成","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0336","unit":"u037","page":44,"subtitle":"","text":"{{b0620}}：30年来扎根基层治理一线，践行新时代“枫桥经验”，探索实行“四步议事”、“社区工作36法”等社区治理先进做法，调解各类纠纷1000余件；建立“吴亚琴工作站”，开发《社区治理与基层党建》等10余类培训课程，培训基层治理骨干近3万名。","blanks":[{"id":"b0620","answer":"吴亚琴","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0337","unit":"u037","page":44,"subtitle":"","text":"{{b0621}}：扎根丘陵山区发展现代农业60余载，奋战在乡村振兴一线，把论文写在大地上、把成果留在农民家；探索出“党支部+合作社+农户”的戴庄经验，累计推广农业新品种新技术350多万亩，帮助农民增收超300亿元。","blanks":[{"id":"b0621","answer":"赵亚夫","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm"}]},{"id":"q0338","unit":"u038","page":44,"subtitle":"","text":"党的十八大以来，我国正从全球科技{{b0622}}、贡献者向开拓者、{{b0623}}加速转变，成为创新力上升最快的国家之一。{{b0624}}是人类文明进步的不竭动力，新一轮科技革命和产业变革深刻改变人类生产生活方式和世界发展格局，科技实力和创新能力越来越成为国家的核心竞争力。当前，人工智能蓬勃兴起，以数据、算力、算法等为关键要素，以神经科学、认知科学、计算科学、数学等理论突破和学科交叉为基础，以智能前沿技术群体性突破和广泛渗透赋能为标志，呈现数据驱动、万物互联、人机协同、跨界融合等显著特征。","blanks":[{"id":"b0622","answer":"参与者","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0623","answer":"引领者","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0624","answer":"科技创新","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0339","unit":"u038","page":45,"subtitle":"","text":"第一，增强科技创新体系化攻关能力。要坚持“四个面向”战略导向，进一步加强科技战略规划、政策措施、重大任务、科研力量、资源平台、区域创新等方面统筹，{{b0625}}科技攻关组织化程度，提升国家创新体系整体效能。","blanks":[{"id":"b0625","answer":"提高","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0340","unit":"u038","page":45,"subtitle":"","text":"第二，推动科技创新和产业创新深度融合。这是以高水平科技自立自强引领发展新质生产力的关键。要突出科技创新{{b0626}}和产业{{b0627}}牵引，推动产学研融通创新，打通科技加速向现实生产力转化的通道。科技创新要突出{{b0628}}导向，支持高校、科研院所对接企业开展科研攻关和人才培养，以高质量科技供给赋能产业创新。产业创新要提出科学问题，强化{{b0629}}创新主体地位，支持企业与高校、科研院所共建平台、共克难题，以高端化、绿色化、智能化产业需求牵引科技创新。","blanks":[{"id":"b0626","answer":"供给","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0627","answer":"需求","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0628","answer":"应用","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0629","answer":"企业","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0341","unit":"u038","page":45,"subtitle":"","text":"第三，大力培养优秀青年科技人才。{{b0630}}推进教育科技人才发展，是我们在实践中摸索总结的成功经验。要优化科教{{b0631}}育人机制，坚持在培养中使用、在使用中培养，注重在科研一线发现和培养更多优秀青年科技人才。加大对科研人员职业早期和长周期稳定支持力度，完善科技奖励、收入分配等制度，帮助解决实际困难，让他们潜心钻研、安身安心安业。要抓住全球人才流动窗口期，积极引进海外优秀青年人才和团队。","blanks":[{"id":"b0630","answer":"一体","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0631","answer":"协同","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0342","unit":"u038","page":45,"subtitle":"","text":"第四，提高科技创新投入效能。“十四五”时期，我国全社会研发经费投入保持年均10%的增长，投入强度2025年达到2.8%、首次超过{{b0632}}国家平均水平。要完善中央财政科技经费分配和管理使用机制，重点向战略性、关键性领域倾斜；健全重大科技任务央地投入共担机制，合理配置中央和地方财政资金，引导地方聚焦{{b0633}}战略需求加大研发投入。要引导{{b0634}}增加研发投入，调动更多社会力量支持科技创新。","blanks":[{"id":"b0632","answer":"经合组织","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0633","answer":"国家","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"},{"id":"b0634","answer":"企业","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0343","unit":"u038","page":45,"subtitle":"","text":"第五，用好科技评价指挥棒。项目评审、机构评估、人才评价都要强化创新能力、质量、实效、贡献导向，体现不同类别的{{b0635}}，不能评价指标权重模糊甚至本末倒置，不能搞“一刀切”、“一锅煮”。要持续深化科教界“帽子”治理，防止简单以称号头衔确定薪酬待遇、配置创新资源。","blanks":[{"id":"b0635","answer":"差异性","source":"https://www.news.cn/politics/leaders/20260708/56ca39eefcbb43d6bd8cd5bf88f10b93/c.html"}]},{"id":"q0344","unit":"u039","page":45,"subtitle":"","text":"我们要学习江泽民同志坚定如磐的政治信仰。江泽民同志说：“我们共产党人的根本政治信仰是社会主义和{{b0636}}主义，世界观是马克思主义的{{b0637}}唯物主义和{{b0638}}唯物主义，这是任何时候都丝毫不能动摇的。”他提出我们党始终是中国{{b0639}}阶级的先锋队，同时是中国人民和中华民族的先锋队，强调领导干部要讲学习、讲政治、讲正气，推动着力解决提高领导水平和执政水平、增强拒腐防变和抵御风险能力两大历史性课题，保持党的先进性和纯洁性，扎实推进了党的建设新的伟大工程。","blanks":[{"id":"b0636","answer":"共产","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0637","answer":"辩证","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0638","answer":"历史","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0639","answer":"工人","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"}]},{"id":"q0345","unit":"u039","page":46,"subtitle":"","text":"我们要学习江泽民同志真挚深厚的为民情怀。江泽民同志强调：“全心全意为人民服务，立党为公，执政为民，是我们党同一切剥削阶级政党的根本区别。”他深刻指出，发展经济的根本目的是提高全国人民生活水平和质量，强调要全面建设惠及十几亿人口的更高水平的小康社会。他领导实施{{b0640}}大开发战略、国家八七扶贫攻坚计划，出台增加农民收入、关心国有企业下岗职工生活和再就业等政策举措，有力推动了新时期实现人民生活从温饱不足到{{b0641}}小康、奔向全面小康的历史性跨越。","blanks":[{"id":"b0640","answer":"西部","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0641","answer":"总体","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"}]},{"id":"q0346","unit":"u039","page":46,"subtitle":"","text":"我们要学习江泽民同志与时俱进的创新精神。江泽民同志强调：“创新是一个民族进步的灵魂，是一个国家兴旺发达的不竭动力，也是一个政党永葆生机的源泉。”他提出党的全部理论和工作要体现时代性、把握规律性、富于创造性，集中全党智慧创立“三个代表”重要思想，强调我们党始终代表中国先进{{b0642}}的发展要求、代表中国先进{{b0643}}的前进方向、代表中国最广大人民的根本利益，进一步回答了什么是社会主义、怎样建设社会主义的问题，创造性回答了建设{{b0644}}、怎样{{b0645}}的问题，深化了我们对新的时代条件下推进中国特色社会主义事业、加强党的建设规律的认识。他领导我们确定党在社会主义初级阶段的基本{{b0646}}，确立社会主义{{b0647}}经济体制的改革目标和基本框架，确立{{b0648}}为主体、多种所有制经济共同发展的基本经济制度和{{b0649}}分配为主体、多种分配方式并存的分配制度，推动经济体制、政治体制、文化体制等各方面改革。他提出坚持“引进来”和“走出去”相结合，以开放促改革促发展，领导我们成功加入{{b0650}}组织，形成对外开放新格局。","blanks":[{"id":"b0642","answer":"生产力","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0643","answer":"文化","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0644","answer":"什么样的党","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0645","answer":"建设党","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0646","answer":"纲领","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0647","answer":"市场","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0648","answer":"公有制","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0649","answer":"按劳","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0650","answer":"世界贸易","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"}]},{"id":"q0347","unit":"u039","page":46,"subtitle":"","text":"我们要学习江泽民同志深谋远虑的战略思维。江泽民同志从二十一世纪头20年是我国必须紧紧抓住并且可以大有作为的重要战略机遇期这一重大判断出发，对全面{{b0651}}小康社会、实现第三步战略目标进行前瞻性谋划；坚持把{{b0652}}作为党执政兴国的第一要务，引领全党全国各族人民聚精会神搞建设、一心一意谋发展；领导我们积极发展社会主义民主政治，实施{{b0653}}基本方略，发展社会主义先进文化；领导实现香港、澳门顺利回归，推动两岸双方达成体现一个中国原则的“{{b0654}}共识”，有力开展反分裂、反“台独”重大斗争；提出一系列外交和国际战略思想，推动世界多极化和经济全球化朝着正确方向发展。","blanks":[{"id":"b0651","answer":"建设","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0652","answer":"发展","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0653","answer":"依法治国","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"},{"id":"b0654","answer":"九二","source":"https://www.gov.cn/yaowen/liebiao/202608/content_7078250.htm"}]},{"id":"q0348","unit":"u040","page":47,"subtitle":"","text":"人类不得不直面时代之问：当机器开始思考，人类如何与之相处？当算法参与决策，安全如何保障？当技术挑战伦理，治理如何跟上？当鸿沟不断拉大，普惠如何实现？中方认为，各国应当秉持{{b0655}}、{{b0656}}理念，让人工智能成为促进共同繁荣、维护共同安全的一个重要动力源，携手构建公正合理的全球人工智能治理体系。","blanks":[{"id":"b0655","answer":"以人为本","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"},{"id":"b0656","answer":"向上向善","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"}]},{"id":"q0349","unit":"u040","page":47,"subtitle":"","text":"第一，坚持开放共赢，驱动创新{{b0657}}。抓住难得的历史性机遇，鼓励{{b0658}}、合作共享，全面促进人工智能科技创新、产业发展、场景应用，协同推进传统产业改造升级、新兴产业培育壮大、未来产业前瞻布局，让人工智能赋能千行百业。","blanks":[{"id":"b0657","answer":"发展","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"},{"id":"b0658","answer":"开源开放","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"}]},{"id":"q0350","unit":"u040","page":47,"subtitle":"","text":"第二，强化风险意识，确保{{b0659}}可控。共同反对在人工智能领域泛化国家安全概念、把本国安全凌驾于他国安全之上的做法。","blanks":[{"id":"b0659","answer":"安全","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"}]},{"id":"q0351","unit":"u040","page":47,"subtitle":"","text":"第三，鼓励包容并蓄，促进文明互鉴。用{{b0660}}塑造人工智能的价值观，善用人工智能技术增进不同文明的理解和包容，促进不同文明交流互鉴，精心培育各美其美、美美与共的文明百花园。","blanks":[{"id":"b0660","answer":"全人类共同价值","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"}]},{"id":"q0352","unit":"u040","page":47,"subtitle":"","text":"第四，倡导和衷共济，完善全球治理。践行真正的多边主义，切实发挥{{b0661}}的重要作用，加强人工智能发展战略、治理规则、技术标准的对接协调，早日形成具有广泛共识的全球治理框架，让这一前沿技术更好造福人类社会。","blanks":[{"id":"b0661","answer":"联合国","source":"https://www.gov.cn/yaowen/liebiao/202607/content_7075874.htm"}]},{"id":"q0353","unit":"u041","page":47,"subtitle":"","text":"今年是上海合作组织成立25周年。25年来，上海合作组织走过不平凡历程。最重大的发展成就是一步步成为世界上{{b0662}}最广、{{b0663}}最多、发展潜力巨大的新型区域合作组织；最宝贵的精神财富是开创性提出和始终遵循{{b0664}}、{{b0665}}、平等、协商、尊重多样文明、谋求共同发展的“上海精神”；最重要的合作经验是找到{{b0666}}、不对抗、不针对第三方的正确共处之道，推动地区国家携手建设共同家园。","blanks":[{"id":"b0662","answer":"幅员","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":"b0663","answer":"人口","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":"b0664","answer":"互信","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":"b0665","answer":"互利","source":"https://www.gov.cn/yaowen/liebiao/202609/content_7079836.htm"},{"id":
